  <script>
    function loadMenu() {
      google.script.run
        .withSuccessHandler(buildMenu)
        .withFailureHandler(showError)
          .getNavigation();
    }
    function readMenuCatalog() {
      const element = document.getElementById('nilavaram-menu-catalog');
      if (!element) {
        throw new Error('MenuCatalog.html is not included in Dashboard.html.');
      }
      const catalog = JSON.parse(element.textContent || '[]');
      return Array.isArray(catalog) ? catalog : [];
    }

    function buildMenuLegacy(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      window.nilavaramNavigation = data;

      data.forEach(function(section) {
        if (section.type === 'link') {
          const directButton = document.createElement('button');
          directButton.type = 'button';
          directButton.className = 'menu-button';
          directButton.textContent = section.label;
          directButton.onclick = function() {
            openModule(section.moduleId, section.label);
          };
          menu.appendChild(directButton);
          return;
        }

        const wrapper = document.createElement('section');
        wrapper.className = 'menu-section';
        const groupButton = document.createElement('button');
        groupButton.type = 'button';
        groupButton.className = 'menu-group-button';
        groupButton.setAttribute('aria-expanded', 'false');

        const label = document.createElement('span');
        label.textContent = section.label;
        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.textContent = 'â†“';
        arrow.setAttribute('aria-hidden', 'true');
        groupButton.appendChild(label);
        groupButton.appendChild(arrow);

        const submenu = document.createElement('div');
        submenu.className = 'submenu';

        section.buttons.forEach(function(item) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'menu-button';
          button.textContent = item.label;
          button.onclick = function() { openModule(item.moduleId, item.label); };
          submenu.appendChild(button);
        });

        if (section.buttons.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'submenu-empty';
          empty.textContent = 'Modules will be added next.';
          submenu.appendChild(empty);
        }

        groupButton.onclick = function() {
          const isOpen = submenu.classList.toggle('is-open');
          groupButton.setAttribute('aria-expanded', String(isOpen));
          arrow.textContent = isOpen ? 'â†‘' : 'â†“';
        };

        wrapper.appendChild(groupButton);
        wrapper.appendChild(submenu);
        menu.appendChild(wrapper);
      });
    }

    function buildMenu(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      const navigation = (data || []).filter(function(section) {
        return section.id !== 'dashboard' && section.moduleId !== 'dashboard';
      });
      window.nilavaramNavigation = navigation;

      const tools = document.createElement('div');
      tools.className = 'sidebar-tools';
      tools.innerHTML =
        '<label class="sidebar-search-label" for="menu-select">Select menu item</label>' +
        '<select id="menu-select">' +
        '<option value="">Choose a menu item...</option>' +
        '</select>';
      menu.appendChild(tools);

      const menuSelect = document.getElementById('menu-select');
      menuSelect.onchange = function(event) {
        const option = event.target.options[event.target.selectedIndex];
        if (!option || !option.dataset.moduleId) return;
        openModule(option.dataset.moduleId, option.dataset.label, true);
        event.target.value = '';
      };

      const dashboardOption = document.createElement('option');
      dashboardOption.value = 'dashboard';
      dashboardOption.dataset.moduleId = 'dashboard';
      dashboardOption.dataset.label = 'Dashboard';
      dashboardOption.textContent = 'Dashboard';
      menuSelect.appendChild(dashboardOption);
      renderMenuOptions(navigation, menuSelect);
      const moduleCount = navigation.reduce(function(total, section) {
        return total + countNavigationModules(section);
      }, 0);
      const count = document.createElement('span');
      count.className = 'sidebar-search-count';
      count.textContent = moduleCount + ' menu item(s) loaded.';
      tools.appendChild(count);
      if (menuSelect.options.length === 1) {
        const notice = document.createElement('p');
        notice.className = 'error';
        notice.textContent = 'No Firestore menu items were returned for this user.';
        menu.appendChild(notice);
      }
      renderNavigationReference(navigation, moduleCount);
      const loading = document.getElementById('dashboard-loading');
      if (loading) {
        loading.textContent = moduleCount
          ? 'Menu items are loaded and you can choose from the drop down box on the left side.'
          : 'No menu items were returned. Please check the navigation source.';
      }
    }

    function countNavigationModules(node) {
      return (node.moduleId ? 1 : 0) +
        (node.children || []).reduce(function(total, child) {
          return total + countNavigationModules(child);
        }, 0);
    }

    function renderNavigationReference(navigation, moduleCount) {
      const output = document.getElementById('output');
      if (!output || moduleCount === 0) return;
      const list = document.createElement('div');
      list.className = 'navigation-reference';
      const heading = document.createElement('h3');
      heading.textContent = 'Available menu items (' + moduleCount + ')';
      list.appendChild(heading);
      const tree = document.createElement('ul');
      navigation.forEach(function(section) {
        appendNavigationReferenceNode(tree, section, 0);
      });
      list.appendChild(tree);
      output.appendChild(list);
    }

    function appendNavigationReferenceNode(parent, node, level) {
      const item = document.createElement('li');
      item.textContent = (level ? '  '.repeat(level) : '') + node.label;
      parent.appendChild(item);
      (node.children || []).forEach(function(child) {
        appendNavigationReferenceNode(parent, child, level + 1);
      });
    }

    function renderMenuOptions(data, select) {
      data.forEach(function(section) {
        if (section.moduleId) {
          appendMenuOption(section, select, 0);
          return;
        }
        const group = document.createElement('optgroup');
        group.label = section.label;
        addMenuOptions(section.children || [], group, 1);
        if (group.options.length) select.appendChild(group);
      });
    }

    function addMenuOptions(nodes, parent, level) {
      nodes.forEach(function(node) {
        if (node.moduleId) {
          appendMenuOption(node, parent, level);
        }
        addMenuOptions(node.children || [], parent, level + 1);
      });
    }

    function appendMenuOption(node, parent, level) {
      const option = document.createElement('option');
      option.value = node.id || node.moduleId;
      option.dataset.moduleId = node.moduleId;
      option.dataset.label = node.label;
      option.textContent = Array(level + 1).join('- ') + node.label;
      parent.appendChild(option);
    }

    function createNavigationNode(node, level) {
      const children = node.children || [];
      if (node.type === 'link' && (!node.children || !node.children.length)) {
        const directButton = document.createElement('button');
        directButton.type = 'button';
        directButton.className = 'menu-button menu-level-' + level;
        directButton.textContent = level >= 3
          ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
          : (level === 2
            ? sentenceStyleMenuLabel(node.label)
            : node.label);
        directButton.onclick = function() {
          openModule(node.moduleId, node.label);
        };
        return directButton;
      }

      const wrapper = document.createElement(level === 1 ? 'section' : 'div');
      wrapper.className = 'menu-section';
      const heading = document.createElement('div');
      heading.className = level === 1
        ? 'menu-main-heading'
        : 'menu-subheading';
      heading.textContent = level >= 3
        ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
        : (level === 2
          ? sentenceStyleMenuLabel(node.label)
          : node.label);

      const submenu = document.createElement('div');
      submenu.className = 'menu-open-list';
      children.forEach(function(child) {
        submenu.appendChild(createNavigationNode(child, level + 1));
      });

      if (children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'submenu-empty';
        empty.textContent = 'Modules will be added next.';
        submenu.appendChild(empty);
      }

      wrapper.appendChild(heading);
      wrapper.appendChild(submenu);
      return wrapper;
    }

    function openModule(moduleId, label, openSeparateWindow) {
      if (openSeparateWindow) {
        openModuleWindow(moduleId, label);
        return;
      }
      moveContentToTop();
      document.getElementById('output').textContent = 'Loading ' + label + '...';

      if (moduleId === 'dashboard') {
        showDefaultDashboard();
        const loading = document.getElementById('dashboard-loading');
        if (loading) {
          loading.textContent =
            'Menu items are loaded and you can choose from the drop down box on the left side.';
        }
        return;
      }
      if (moduleId === 'all-businesses') {
        document.getElementById('output').innerHTML =
          '<h2>All Businesses</h2>' +
          '<p>Business records and management actions will be added next.</p>';
        return;
      }
      if (moduleId === 'system-status') {
        const data = window.nilavaramDashboardInfo;
        document.getElementById('output').innerHTML =
          '<h2>System Status</h2>' +
          '<p><b>Application:</b> Nilavaram</p>' +
          '<p><b>Version:</b> ' + escapeHtml(data.version) + '</p>' +
          '<p><b>Status:</b> ' + escapeHtml(data.status) + '</p>';
        return;
      }
      if (moduleId === 'pending-features') {
        showPendingFeatures();
        return;
      }
      if (['backup-status', 'wizard-backup', 'back-up', 'backup'].indexOf(moduleId) !== -1 ||
          /backup/i.test(String(label || '')) || /back up/i.test(String(label || ''))) {
        showBackupStatus();
        return;
      }
      if (['archive-library', 'upload-documents', 'missing-documents', 'expiring-documents', 'archived-documents'].indexOf(moduleId) !== -1) {
        showDocumentArchive();
        return;
      }
      if (moduleId === 'about-version-history') {
        showCodeChangeHistory();
        return;
      }
      if (['nilavaram-core',
        'project-start',
        'navigation-guide',
        'getting-started',
        'users-access-guide',
        'accounting-guide',
        'accounting-operating-rules',
        'documents-imports-guide',
        'inactivity-sign-in',
        'project-architecture',
        'faq',
        'about-version-history',
        'admin-technical-guide'
      ].indexOf(moduleId) !== -1) {
        showHelpArticle(moduleId, label);
        return;
      }
      if (moduleId === 'alerts') {
        showAlerts();
        return;
      }
      if (moduleId === 'reminders') {
        showReminders();
        return;
      }
      if (moduleId === 'chart-of-accounts') {
        showChartOfAccounts('list');
        return;
      }
      if (moduleId === 'account-add-new') {
        showChartOfAccounts('add');
        return;
      }
      if (moduleId === 'account-batch-edit') {
        showChartOfAccounts('batch');
        return;
      }
      if (['input-main',
        'input-receipt',
        'input-payment',
        'input-journal',
        'input-upload-csv',
        'input-upload-pdf',
        'input-upload-image',
        'input-upload-txt',
        'input-workbench',
        'input-acode-map'
      ].indexOf(moduleId) !== -1) {
        showInputWorkspace(moduleId);
        return;
      }
      if (moduleId === 'new-transaction') {
        showTransactionWorkbench('source-input');
        return;
      }
      if (['transaction-workbench',
        'source-input',
        'reconciliation-validation',
        'account-rule-review',
        'manual-journal-entry'
      ].indexOf(moduleId) !== -1) {
        showTransactionWorkbench(moduleId);
        return;
      }
      if (moduleId === 'users') {
        showUsers();
        return;
      }
      if (moduleId === 'firestore') {
        google.script.run
          .withSuccessHandler(function(result) {
            document.getElementById('output').innerHTML =
              '<pre>' + escapeHtml(JSON.stringify(result, null, 2)) + '</pre>';
          })
          .withFailureHandler(showError)
          .testFirestore();
        return;
      }
      if (moduleId === 'connections') {
        showConnections();
        return;
      }
      if (String(moduleId || '').indexOf('wizard-') === 0) {
        showAccountingWizardStatus(moduleId, label);
        return;
      }

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('output').textContent = result.message;
        })
        .withFailureHandler(showError)
        .openModule(moduleId);
    }

      function openModuleWindow(moduleId, label) {
        const baseUrl = window.location.href.split('?')[0];
        const query = '?moduleId=' + encodeURIComponent(moduleId) +
          '&moduleLabel=' + encodeURIComponent(label || moduleId);
        const popup = window.open(
          baseUrl + query,
          'Nilavaram_' + String(moduleId || 'module').replace(/[^a-z0-9]/gi, '_'),
          'popup=yes,width=1500,height=900,resizable=yes,scrollbars=yes'
        );
        if (!popup) {
          showError({
            message: 'The module window was blocked. Allow pop-ups for Nilavaram and select the menu item again.'
          });
          return;
        }
        popup.focus();
      }

    function showAccountingWizardStatus(moduleId, label) {

        'wizard-accounting-year': {
          status: 'Visible â€” controlled setup is pending',
          text: 'This screen will set the opening date, fiscal year and ' +
            'reporting-period controls. It must be completed before live ' +
            'opening balances or transactions are posted.'
        },
        'wizard-opening-tb': {
          status: 'Visible â€” opening-entry workflow is pending',
          text: 'The Opening Trial Balance will require balanced debit and ' +
            'credit lines, active Chart of Accounts codes, supporting ' +
            'evidence, approval and an append-only audit record. For BOA ' +
            'x0137, a positive opening balance will debit the bank asset and ' +
            'credit Mâ€™s Equity for the same verified amount.'
        },
        'wizard-sheet-index': {
          status: 'Visible â€” source index is pending',
          text: 'This will list each bank statement, CSV, PDF, image or text ' +
            'batch with its date range, file identity, import status and ' +
            'duplicate-control result.'
        },
        'wizard-create-acode-map': {
          status: 'Visible â€” mapping editor is pending',
          text: 'This will create reusable description-to-account suggestions ' +
            'from previously approved accounting decisions.'
        },
        'wizard-validate-acode-map': {
          status: 'Visible â€” validation control is pending',
          text: 'This will check every suggested code against the active ' +
            'Chart of Accounts and show green approval or red review status.'
        },
        'wizard-ledger': {
          status: 'Visible â€” report engine is pending',
          text: 'The General Ledger will be generated only from posted, ' +
            'balanced journal lines and will retain links to source evidence.'
        },
        'wizard-trial-balance': {
          status: 'Visible â€” report engine is pending',
          text: 'The Trial Balance will show account debit and credit totals ' +
            'and must balance to zero difference.'
        },
        'wizard-profit-loss': {
          status: 'Visible â€” report engine is pending',
          text: 'Profit and Loss will report posted income and expenses for ' +

        },
        'wizard-profit-loss-appropriation': {
          status: 'Visible â€” report engine is pending',
          text: 'Profit and Loss Appropriation will show approved allocations ' +
            'of the period result without altering the underlying audit trail.'
        },
        'wizard-balance-sheet': {
          status: 'Visible â€” report engine is pending',
          text: 'The Balance Sheet will report assets, liabilities and equity ' +
            'as of a selected date from posted journal lines.'
        },
        'wizard-error-check': {
          status: 'Visible â€” consolidated control screen is pending',
          text: 'This will consolidate red alerts for duplicates, imbalance, ' +
            'missing evidence, invalid account codes and reconciliation ' +
            'differences.'
        },
        'wizard-all-reports': {
          status: 'Visible â€” enabled after individual reports are verified',
          text: 'One click will create the complete report package only after ' +
            'the Ledger, Trial Balance, Profit and Loss, Appropriation and ' +
            'Balance Sheet have each passed their controls.'
        },
        'wizard-export-csv': {
          status: 'Visible â€” export is pending',
          text: 'This will export approved tabular accounting data with the ' +
            'selected business, period and generation timestamp.'
        },
        'wizard-export-pdf': {
          status: 'Visible â€” export is pending',
          text: 'This will export approved reports as dated PDF evidence.'
        },
        'wizard-search': {
          status: 'Visible â€” indexed search is pending',
          text: 'Search will locate transactions, account codes, descriptions, ' +
            'document references, reconciliation items and audit events.'
        }
      };
      const item = details[moduleId] || {
        status: 'Visible â€” implementation is pending',
        text: 'This Accounting Wizard function is recorded in the navigation ' +
          'and will be activated through the controlled development sequence.'
      };
      document.getElementById('output').innerHTML =
        '<h2>' + escapeHtml(label) + '</h2>' +
        '<p><b>Status:</b> ' + escapeHtml(item.status) + '</p>' +
        '<p>' + escapeHtml(item.text) + '</p>' +
        '<p class="help-meta">A visible menu item does not mean that live ' +
        'posting or final reporting has been enabled. Nilavaram will label ' +
        'each function accurately until verification is complete.</p>';
    }
    </script>
