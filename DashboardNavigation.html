<script>
  window.nilavaramShellEntities = window.nilavaramShellEntities || [];

  function showClientSection(show) {
    const section = document.getElementById('client-section');
    if (section) section.hidden = !show;
  }

  function showClientLoadingMessage(show, text) {
    const message = document.getElementById('client-loading-msg');
    if (!message) return;
    message.hidden = !show;
    if (text) message.textContent = text;
  }

  function showEntityLoadingMessage(show, text) {
    const message = document.getElementById('entity-loading-msg');
    if (message) message.hidden = !show;
    if (text) message.textContent = text || message.textContent;
  }

  function showEntitySection(show) {
    const section = document.getElementById('entity-section');
    if (section) section.hidden = !show;
  }

  function showMenuSection(show) {
    const section = document.getElementById('menu-section');
    if (section) section.hidden = !show;
  }

  function saveSelectedClient(clientId, clientName) {
    window.nilavaramSelectedClient = { id: clientId, name: clientName };
    try {
      sessionStorage.setItem('nilavaramSelectedClientId', clientId);
      sessionStorage.setItem('nilavaramSelectedClientName', clientName);
    } catch (error) {}
  }

  function saveSelectedBusiness(entityId, entityName) {
    window.nilavaramSelectedEntity = { id: entityId, name: entityName };
    try {
      sessionStorage.setItem('nilavaramSelectedEntityId', entityId);
      sessionStorage.setItem('nilavaramSelectedEntityName', entityName);
    } catch (error) {}
  }

  function countNavigationModules(node) {
    if (!node) return 0;
    let count = node.moduleId ? 1 : 0;
    (node.children || []).forEach(function(child) {
      count += countNavigationModules(child);
    });
    return count;
  }

  function buildShellSkeleton() {
    const menu = document.getElementById('menu');
    menu.textContent = '';

    const tools = document.createElement('div');
    tools.className = 'sidebar-tools';
    tools.innerHTML =
      '<p id="client-loading-msg" class="help-meta">Connecting securely...</p>' +
      '<div id="client-section" hidden>' +
        '<label class="sidebar-search-label" for="client-select">1. Select client</label>' +
        '<select id="client-select"></select>' +
      '</div>' +
      '<p id="entity-loading-msg" class="help-meta" hidden>Loading business names...</p>' +
      '<div id="entity-section" hidden>' +
        '<label class="sidebar-search-label" for="entity-select">2. Select business</label>' +
        '<select id="entity-select"></select>' +
        '<div id="entity-reference" class="entity-reference"></div>' +
        '<div id="entity-add-panel" class="entity-add-panel" hidden></div>' +
      '</div>' +
      '<div id="menu-section" hidden>' +
        '<label class="sidebar-search-label" for="menu-select">3. Select menu item</label>' +
        '<select id="menu-select" disabled>' +
          '<option value="">Choose a business first...</option>' +
        '</select>' +
      '</div>' +
      '<span class="sidebar-search-count" id="menu-item-count"></span>';
    menu.appendChild(tools);

    const reference = document.createElement('div');
    reference.id = 'menu-reference';
    reference.className = 'navigation-reference';
    menu.appendChild(reference);

    const clientSelect = document.getElementById('client-select');
    if (clientSelect) clientSelect.onchange = onClientSelected;

    const entitySelect = document.getElementById('entity-select');
    if (entitySelect) entitySelect.onchange = updateMenuSelectorState;

    const menuSelect = document.getElementById('menu-select');
    if (menuSelect) {
      menuSelect.onchange = function(event) {
        const option = event.target.options[event.target.selectedIndex];
        if (!option || !option.dataset.moduleId) return;
        openModule(option.dataset.moduleId, option.dataset.label, true);
        event.target.value = '';
      };
    }
  }

  function applyShellFromEngine(shell) {
    const data = shell.info || {};
    window.nilavaramDashboardInfo = data;
    window.nilavaramSessionPolicy = shell.sessionPolicy || {
      warningMinutes: 9,
      timeoutMinutes: 10
    };
    renderStartupInfo(data);

    if (typeof blockInactiveShellAccess === 'function' &&
        blockInactiveShellAccess(data)) {
      return;
    }

    if (shell.shellError) {
      showClientLoadingMessage(true, shell.shellError);
      showClientSection(true);
      showWorkspaceNotice(shell.shellError);
      return;
    }

    populateClientSelector(shell.clients || []);

    showWorkspaceNotice(
      'Choose a client, then a business, then a menu item.'
    );
  }

  function populateClientSelector(clients) {
    const select = document.getElementById('client-select');
    if (!select) return;

    select.textContent = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = clients.length ? 'Choose a client...' : 'No clients available';
    select.appendChild(placeholder);

    clients.forEach(function(client) {
      const option = document.createElement('option');
      option.value = client.id;
      option.textContent = client.name;
      select.appendChild(option);
      showClientSection(true);
      showClientLoadingMessage(false);
    });

    let savedClientId = '';
    try {
      savedClientId = sessionStorage.getItem('nilavaramSelectedClientId') || '';
    } catch (error) {
      savedClientId = '';
    }

    if (savedClientId && select.querySelector('option[value="' + savedClientId + '"]')) {
      select.value = savedClientId;
      onClientSelected();
    } else {
      showEntitySection(false);
      showMenuSection(false);
      showEntityLoadingMessage(true, 'Choose a client first...');
    }
  }

  function onClientSelected() {
    const select = document.getElementById('client-select');
    if (!select || !select.value) {
      showEntitySection(false);
      showMenuSection(false);
      showEntityLoadingMessage(true, 'Choose a client first...');
      return;
    }

    saveSelectedClient(
      select.value,
      select.options[select.selectedIndex].text
    );

    clearWorkspaceError();
    updateWorkspaceSelectionDisplay();
    showWorkspaceProgress(
      'Step 2: Loading businesses for ' +
        select.options[select.selectedIndex].text + '…',
      30
    );
    showEntityLoadingMessage(true, 'Loading business names...');
    showEntitySection(false);
    showMenuSection(false);

    google.script.run
      .withSuccessHandler(function(entities) {
        hideWorkspaceProgress();
        showWorkspaceNotice(
          'Loaded ' + (entities || []).length +
          ' business(es). Choose one, then the menu will load.'
        );
        populateBusinessSelector(entities || []);
      })
      .withFailureHandler(function(error) {
        showWorkspaceError(
          'Could not load businesses.',
          error && error.message ? error.message : String(error)
        );
        showEntityLoadingMessage(
          true,
          error && error.message ? error.message : String(error)
        );
      })
      .getBusinessEntitiesForClient(select.value);
  }
    
  function applyNavigationToMenu(navigation) {
    const filtered = (navigation || []).filter(function(section) {
      return section.id !== 'dashboard' && section.moduleId !== 'dashboard';
    });
    window.nilavaramNavigation = filtered;

    const menuSelect = document.getElementById('menu-select');
    if (!menuSelect) return;

    menuSelect.textContent = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Choose a menu item...';
    menuSelect.appendChild(placeholder);
    renderMenuOptions(filtered, menuSelect);

    const moduleCount = filtered.reduce(function(total, section) {
      return total + countNavigationModules(section);
    }, 0);

    const count = document.getElementById('menu-item-count');
    if (count) {
      count.textContent = moduleCount + ' menu item(s) available.';
    }

    renderSidebarNavigationReference(filtered, moduleCount);
    updateMenuSelectorState(true);
  }

  function renderEntityReference(entities) {
    const panel = document.getElementById('entity-reference');
    if (!panel) return;

    if (!entities.length) {
      panel.innerHTML =
        '<p class="help-meta">No business names are recorded yet for ' +
        'this client. Enter the first name below.</p>';
      return;
    }

    const list = document.createElement('ul');
    entities.forEach(function(entity) {
      const item = document.createElement('li');
      item.textContent = entity.name;
      list.appendChild(item);
    });
    panel.innerHTML = '<h3>Business entities (' + entities.length + ')</h3>';
    panel.appendChild(list);
  }

  function renderEntityAddPanel(canEdit) {
    const panel = document.getElementById('entity-add-panel');
    if (!panel) return;
    if (!canEdit) {
      panel.hidden = true;
      panel.textContent = '';
      return;
    }
    panel.hidden = false;
    panel.innerHTML =
      '<label class="sidebar-search-label" for="entity-add-input">Add business name</label>' +
      '<div class="entity-add-row">' +
      '<input id="entity-add-input" type="text" placeholder="Enter business name">' +
      '<button id="entity-add-button" class="secondary-button" type="button">Add</button>' +
      '</div>' +
      '<p id="entity-add-result" class="help-meta" aria-live="polite"></p>';

    document.getElementById('entity-add-button').onclick = function() {
      const input = document.getElementById('entity-add-input');
      const result = document.getElementById('entity-add-result');
      result.textContent = 'Saving...';
      google.script.run
        .withSuccessHandler(function(response) {
          input.value = '';
          result.textContent = 'Added ' + response.entity.name + '.';
          onClientSelected();
        })
        .withFailureHandler(function(error) {
          result.textContent = error && error.message ? error.message : String(error);
        })
        .addClientBusinessEntity(
          input.value,
          window.nilavaramSelectedClient && window.nilavaramSelectedClient.name
        );
    };
  }

  function populateBusinessSelector(entities) {
    window.nilavaramShellEntities = entities || [];
    const select = document.getElementById('entity-select');
    if (!select) return;

    select.textContent = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = entities.length
      ? 'Choose a business...'
      : 'No businesses yet — add one below';
    select.appendChild(placeholder);

    entities.forEach(function(entity) {
      const option = document.createElement('option');
      option.value = entity.id;
      option.textContent = entity.name;
      select.appendChild(option);
    });

    let savedEntityId = '';
    try {
      savedEntityId = sessionStorage.getItem('nilavaramSelectedEntityId') || '';
    } catch (error) {
      savedEntityId = '';
    }
    if (savedEntityId && select.querySelector('option[value="' + savedEntityId + '"]')) {
      select.value = savedEntityId;
    }

    renderEntityReference(entities);
    const role = window.nilavaramDashboardInfo && window.nilavaramDashboardInfo.role;
    renderEntityAddPanel(
      !entities.length ||
      role === 'superadmin' ||
      role === 'admin' ||
      role === 'editor'
    );

    showEntityLoadingMessage(false);
    showEntitySection(true);
    showMenuSection(true);

    if (select.value) {
      saveSelectedBusiness(
        select.value,
        select.options[select.selectedIndex].text
      );
      updateWorkspaceSelectionDisplay();
      updateMenuSelectorState(true);
      reloadNavigationForCurrentSelection();
    } else {
      updateMenuSelectorState(true);
    }
  }
  
  function updateMenuSelectorState(skipReload) {
    const entitySelect = document.getElementById('entity-select');
    const menuSelect = document.getElementById('menu-select');
    if (!entitySelect || !menuSelect) return;

    if (entitySelect.value) {
      saveSelectedBusiness(
        entitySelect.value,
        entitySelect.options[entitySelect.selectedIndex].text
      );
      updateWorkspaceSelectionDisplay();
    }

    const enabled = Boolean(entitySelect.value);
    menuSelect.disabled = !enabled;

    if (menuSelect.options.length) {
      menuSelect.options[0].textContent = enabled
        ? 'Choose a menu item...'
        : 'Choose a business first...';
    }

    if (!enabled) {
      menuSelect.value = '';
      return;
    }

    if (skipReload !== true) {
      reloadNavigationForCurrentSelection();
    }
  }

  function reloadNavigationForCurrentSelection() {
    const clientId = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.id;
    const entityId = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.id;
    const clientName = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.name;
    const entityName = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.name;

    updateWorkspaceSelectionDisplay();

    if (!clientId || !entityId) {
      showWorkspaceError(
        'Menu not loaded.',
        'clientId=' + clientId + ', entityId=' + entityId +
        '. Reselect client and business.'
      );
      return;
    }

    clearWorkspaceError();
    showWorkspaceProgress(
      'Step 3: Loading menu items from Firestore for ' +
        clientName + ' / ' + entityName + '…',
      null
    );

    google.script.run
    .withSuccessHandler(function(navigation) {
      try {
        const menus = Array.isArray(navigation) ? navigation : [];
        hideWorkspaceProgress();
        if (!menus.length) {
          showWorkspaceError(
            'No menu items returned.',
            'getNavigationForShell("' + clientId + '", "' + entityId + '") ' +
            'returned 0 groups. Run rewriteNavigationInFirestore() in Apps Script.'
          );
          return;
        }
        let moduleCount = 0;
        menus.forEach(function(section) {
          moduleCount += countNavigationModules(section);
        });
        applyNavigationToMenu(menus);
        showWorkspaceNotice(
          'Menu loaded: ' + moduleCount + ' item(s) for ' +
            clientName + ' / ' + entityName + '.'
        );
      } catch (error) {
        showWorkspaceError(
          'Menu load failed in browser.',
          (error && error.message ? error.message : String(error))
        );
      }
    })
      .withFailureHandler(function(error) {
        showWorkspaceError(
          'Menu load failed.',
          (error && error.message ? error.message : String(error)) +
            '\nCall: getNavigationForShell("' + clientId + '", "' + entityId + '")' +
            '\nCheck Apps Script → Executions for timeout or error.'
        );
      })
      .getNavigationForShell(clientId, entityId);
  }

  function renderSidebarNavigationReference(navigation, moduleCount) {
    const reference = document.getElementById('menu-reference');
    if (!reference) return;
    reference.textContent = '';
    const heading = document.createElement('h3');
    heading.textContent = 'Available menu items (' + moduleCount + ')';
    reference.appendChild(heading);
    const tree = document.createElement('ul');
    navigation.forEach(function(section) {
      appendNavigationReferenceNode(tree, section, 0);
    });
    reference.appendChild(tree);
  }

  function appendNavigationReferenceNode(parent, node, level) {
    const item = document.createElement('li');
    item.className = 'navigation-reference-item';
    item.textContent = (level ? '  '.repeat(level) : '') + node.label;

    if (node.moduleId) {
      item.title = 'Use step 3 dropdown above to open this item.';
      item.addEventListener('mouseenter', function() {
        showWorkspaceNotice(
          'To open "' + node.label + '", choose it from the step 3 dropdown above.'
        );
      });
      item.addEventListener('click', function() {
        showWorkspaceNotice(
          'Please select "' + node.label + '" from the dropdown in step 3 above.'
        );
      });
    }

    parent.appendChild(item);
    (node.children || []).forEach(function(child) {
      appendNavigationReferenceNode(parent, child, level + 1);
    });
  }

  function renderMenuOptions(data, select) {
    (data || []).forEach(function(section) {
      if (section.moduleId) {
        appendMenuOption(section, select, 0);
        return;
      }
      const group = document.createElement('optgroup');
      group.label = section.label;
      addMenuOptions(section.children || [], group, 1);
      if (group.childNodes.length) {
        select.appendChild(group);
      }
    });
  }

  function addMenuOptions(nodes, parent, level) {
    nodes.forEach(function(node) {
      if (node.moduleId) {
        appendMenuOption(node, parent, level);
      }
      addMenuOptions(node.children || [], parent, level + 1);
    });
  }

  function appendMenuOption(node, parent, level) {
    const option = document.createElement('option');
    option.value = node.id || node.moduleId;
    option.dataset.moduleId = node.moduleId;
    option.dataset.label = node.label;
    option.textContent = Array(level + 1).join('- ') + node.label;
    parent.appendChild(option);
  }

  function openModule(moduleId, label, openSeparateWindow) {
    if (typeof IS_MAIN_WORKSPACE !== 'undefined' && IS_MAIN_WORKSPACE &&
        typeof IS_MODULE_WINDOW === 'undefined') {
      openModuleWindow(moduleId, label);
      return;
    }
    if (openSeparateWindow) {
      openModuleWindow(moduleId, label);
      return;
    }
    moveContentToTop();
    document.getElementById('output').textContent = 'Loading ' + label + '...';

    if (moduleId === 'all-businesses') {
      document.getElementById('output').innerHTML =
        '<h2>All Businesses</h2>' +
        '<p>Business records and management actions will be added next.</p>';
      return;
    }
    if (moduleId === 'system-status') {
      const data = window.nilavaramDashboardInfo || {};
      document.getElementById('output').innerHTML =
        '<h2>System Status</h2>' +
        '<p><b>Application:</b> Nilavaram</p>' +
        '<p><b>Version:</b> ' + escapeHtml(data.version || '') + '</p>' +
        '<p><b>Status:</b> ' + escapeHtml(data.status || '') + '</p>';
      return;
    }
    if (moduleId === 'pending-features') {
      showPendingFeatures();
      return;
    }
    if (['backup-status', 'wizard-backup', 'back-up', 'backup'].indexOf(moduleId) !== -1 ||
        /backup/i.test(String(label || '')) || /back up/i.test(String(label || ''))) {
      showBackupStatus();
      return;
    }
    if (['archive-library', 'upload-documents', 'missing-documents', 'expiring-documents', 'archived-documents'].indexOf(moduleId) !== -1) {
      showDocumentArchive();
      return;
    }
    if (moduleId === 'about-version-history') {
      showCodeChangeHistory();
      return;
    }
    if (['nilavaram-core',
      'project-start',
      'navigation-guide',
      'getting-started',
      'users-access-guide',
      'accounting-guide',
      'accounting-operating-rules',
      'documents-imports-guide',
      'inactivity-sign-in',
      'project-architecture',
      'faq',
      'about-version-history',
      'admin-technical-guide'
    ].indexOf(moduleId) !== -1) {
      showHelpArticle(moduleId, label);
      return;
    }
    if (moduleId === 'alerts') {
      showAlerts();
      return;
    }
    if (moduleId === 'reminders') {
      showReminders();
      return;
    }
    if (moduleId === 'chart-of-accounts') {
      showChartOfAccounts('list');
      return;
    }
    if (moduleId === 'account-add-new') {
      showChartOfAccounts('add');
      return;
    }
    if (moduleId === 'account-batch-edit') {
      showChartOfAccounts('batch');
      return;
    }
    if (['input-main',
      'input-receipt',
      'input-payment',
      'input-journal',
      'input-upload-csv',
      'input-upload-pdf',
      'input-upload-image',
      'input-upload-txt',
      'input-workbench',
      'input-acode-map'
    ].indexOf(moduleId) !== -1) {
      showInputWorkspace(moduleId);
      return;
    }
    if (moduleId === 'new-transaction') {
      showTransactionWorkbench('source-input');
      return;
    }
    if (['transaction-workbench',
      'source-input',
      'reconciliation-validation',
      'account-rule-review',
      'manual-journal-entry'
    ].indexOf(moduleId) !== -1) {
      showTransactionWorkbench(moduleId);
      return;
    }
    if (moduleId === 'users') {
      showUsers();
      return;
    }
    
    if (moduleId === 'connections') {
      showConnections();
      return;
    }
    if (String(moduleId || '').indexOf('wizard-') === 0) {
      showAccountingWizardStatus(moduleId, label);
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('output').textContent = result.message;
      })
      .withFailureHandler(showError)
      .openModule(moduleId);
  }

  function openModuleWindow(moduleId, label) {
    const entitySelect = document.getElementById('entity-select');
    if (!entitySelect || !entitySelect.value) {
      showWorkspaceNotice('Select a business before opening a module window.');
      return;
    }

    const entityId = entitySelect.value;
    const entityName = entitySelect.options[entitySelect.selectedIndex].text;
    const sessionId = 'sess_' + Date.now() + '_' +
      Math.random().toString(36).slice(2, 8);
    const friendlyWindowName = label || 'Module window';

    google.script.run
      .withSuccessHandler(function(auth) {
        resumeMainWorkspaceIfInactive();
        markUserActivity();
        const baseUrl = window.location.href.split('?')[0];
        const query = '?moduleWindow=1' +
          '&moduleId=' + encodeURIComponent(auth.moduleId || moduleId) +
          '&moduleLabel=' + encodeURIComponent(auth.moduleLabel || label || moduleId) +
          '&entityId=' + encodeURIComponent(auth.entityId || entityId) +
          '&entityName=' + encodeURIComponent(auth.entityName || entityName) +
          '&sessionId=' + encodeURIComponent(sessionId);
        const popup = window.open(
          baseUrl + query,
          'Nilavaram_' + sessionId,
          'popup=yes,width=1500,height=900,resizable=yes,scrollbars=yes'
        );
        if (!popup || popup.closed) {
          registerModuleSession({
            sessionId: sessionId,
            moduleId: auth.moduleId || moduleId,
            moduleLabel: auth.moduleLabel || label || moduleId,
            windowName: friendlyWindowName,
            ipAddress: window.nilavaramClientIp || 'Pending',
            entityId: auth.entityId || entityId,
            entityName: auth.entityName || entityName,
            status: 'blocked',
            closeReason: 'popup-blocked'
          });
          showWorkspaceNotice(
            'The module window was blocked. Allow pop-ups for Nilavaram and try again.'
          );
          return;
        }
        registerModuleSession({
          sessionId: sessionId,
          moduleId: auth.moduleId || moduleId,
          moduleLabel: auth.moduleLabel || label || moduleId,
          windowName: friendlyWindowName,
          ipAddress: window.nilavaramClientIp || 'Pending',
          entityId: auth.entityId || entityId,
          entityName: auth.entityName || entityName,
          status: 'open',
          popup: popup
        });
        monitorModulePopup(sessionId, popup);
      })
      .withFailureHandler(function(error) {
        registerModuleSession({
          sessionId: sessionId,
          moduleId: moduleId,
          moduleLabel: label || moduleId,
          windowName: friendlyWindowName,
          ipAddress: window.nilavaramClientIp || 'Pending',
          entityId: entityId,
          entityName: entityName,
          status: 'blocked',
          closeReason: 'access-denied'
        });
        showWorkspaceNotice(error && error.message
          ? error.message
          : 'That module could not be opened.');
      })
      .authorizeModuleAccess(moduleId, entityId);
  }

  function showAccountingWizardStatus(moduleId, label) {
    const details = {
      'wizard-accounting-year': {
        status: 'Visible — controlled setup is pending',
        text: 'This screen will set the opening date, fiscal year and ' +
          'reporting-period controls. It must be completed before live ' +
          'opening balances or transactions are posted.'
      },
      'wizard-opening-tb': {
        status: 'Visible — opening-entry workflow is pending',
        text: 'The Opening Trial Balance will require balanced debit and ' +
          'credit lines, active Chart of Accounts codes, supporting ' +
          'evidence, approval and an append-only audit record.'
      },
      'wizard-sheet-index': {
        status: 'Visible — source index is pending',
        text: 'This will list each bank statement, CSV, PDF, image or text ' +
          'batch with its date range, file identity, import status and ' +
          'duplicate-control result.'
      },
      'wizard-create-acode-map': {
        status: 'Visible — mapping editor is pending',
        text: 'This will create reusable description-to-account suggestions ' +
          'from previously approved accounting decisions.'
      },
      'wizard-validate-acode-map': {
        status: 'Visible — validation control is pending',
        text: 'This will check every suggested code against the active ' +
          'Chart of Accounts and show green approval or red review status.'
      },
      'wizard-ledger': {
        status: 'Visible — report engine is pending',
        text: 'The General Ledger will be generated only from posted, ' +
          'balanced journal lines and will retain links to source evidence.'
      },
      'wizard-trial-balance': {
        status: 'Visible — report engine is pending',
        text: 'The Trial Balance will show account debit and credit totals ' +
          'and must balance to zero difference.'
      },
      'wizard-profit-loss': {
        status: 'Visible — report engine is pending',
        text: 'Profit and Loss will report posted income and expenses for ' +
          'the selected accounting period.'
      },
      'wizard-profit-loss-appropriation': {
        status: 'Visible — report engine is pending',
        text: 'Profit and Loss Appropriation will show approved allocations ' +
          'of the period result without altering the underlying audit trail.'
      },
      'wizard-balance-sheet': {
        status: 'Visible — report engine is pending',
        text: 'The Balance Sheet will report assets, liabilities and equity ' +
          'as of a selected date from posted journal lines.'
      },
      'wizard-error-check': {
        status: 'Visible — consolidated control screen is pending',
        text: 'This will consolidate red alerts for duplicates, imbalance, ' +
          'missing evidence, invalid account codes and reconciliation ' +
          'differences.'
      },
      'wizard-all-reports': {
