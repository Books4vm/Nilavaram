<script>
  window.nilavaramShellEntities = window.nilavaramShellEntities || [];

  function countNavigationModules(node) {
    if (!node) return 0;
    let count = node.moduleId ? 1 : 0;
    (node.children || []).forEach(function(child) {
      count += countNavigationModules(child);
    });
    return count;
  }

  function buildShellSkeleton() {
    const menu = document.getElementById('menu');
    menu.textContent = '';

    const tools = document.createElement('div');
    tools.className = 'sidebar-tools';
    tools.innerHTML =
      '<p id="shell-loading-msg" class="help-meta">Connecting securely...</p>' +
      '<button type="button" id="context-change-button" class="secondary-button context-change-button">' +
        'Change client / business</button>' +
      '<button type="button" id="customize-menu-button" class="secondary-button context-change-button" ' +
        'style="margin-top: 8px; display: none;">' +
        'Customize My Menu</button>' +
      '<div id="menu-section" hidden>' +
        '<label class="sidebar-search-label" for="menu-search">3. Menu</label>' +
        '<div class="menu-search-wrap">' +
          '<input id="menu-search" type="search" autocomplete="off" ' +
            'placeholder="Search menu items\u2026" aria-label="Search menu items">' +
        '</div>' +
        '<p id="menu-status-summary" class="menu-status-summary help-meta"></p>' +
        '<div id="menu-search-results" class="menu-search-results" hidden></div>' +
        '<div id="menu-browse-panel" class="menu-browse-panel"></div>' +
      '</div>';
    menu.appendChild(tools);
    bindMenuPickerEvents();
    bindCustomizeMenuButton();
  }

  function applyShellFromEngine(shell) {
  if (shell && shell.shellError &&
      redirectToSignInIfSessionExpired(shell.shellError)) {
    return;
  }
  const data = shell.info || {};
  window.nilavaramDashboardInfo = data;
  window.nilavaramSessionPolicy = shell.sessionPolicy || {
    warningMinutes: 9,
    timeoutMinutes: 10
  };
  renderStartupInfo(data);

  const inviteToken = typeof getInviteTokenFromUrl === 'function'
    ? getInviteTokenFromUrl()
    : '';

  function continueShellLoad() {
    if (typeof blockInactiveShellAccess === 'function' &&
        blockInactiveShellAccess(data)) {
      return;
    }

    if (shell.shellError) {
      const loading = document.getElementById('shell-loading-msg');
      if (loading) {
        loading.hidden = false;
        loading.textContent = shell.shellError;
      }
      showWorkspaceNotice(shell.shellError);
      return;
    }

    const loading = document.getElementById('shell-loading-msg');
    if (loading) loading.hidden = true;

    if (OPEN_CONNECTIONS_ON_LOAD) {
      if (typeof showConnections === 'function') showConnections();
    } else if (typeof showDefaultWorkspace === 'function') {
      showDefaultWorkspace();
    }
    if (typeof buildShellSkeleton === 'function') {
      buildShellSkeleton();
    }

    startShellContextFlow(shell.clients || [], shell.defaultContext || null);

    if (!isShellContextComplete()) {
      showWorkspaceNotice(
        'Complete Step 1 and Step 2 in the workspace, then choose a menu item.'
      );
    }
  }

  if (inviteToken) {
    google.script.run
      .withSuccessHandler(function(landing) {
        window.nilavaramInviteLanding = landing;
        continueShellLoad();
      })
      .withFailureHandler(function(error) {
        window.nilavaramInviteLanding = {
          hasToken: true,
          valid: false,
          message: error && error.message ? error.message : String(error)
        };
        continueShellLoad();
      })
      .validateInviteLanding(inviteToken);
    return;
  }

  continueShellLoad();
}

  function updateMenuSelectorState(skipReload) {
    if (!isShellContextComplete()) {
      setMenuPanelEnabled(false);
      return;
    }
    setMenuPanelEnabled(true);
    if (skipReload !== true) {
      reloadNavigationForCurrentSelection();
    }
  }

  function reloadNavigationForCurrentSelection() {
    const clientId = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.id;
    const entityId = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.id;
    const clientName = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.name;
    const entityName = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.name;

    updateWorkspaceSelectionDisplay();

    if (!clientId || !entityId) {
      showWorkspaceError(
        'Menu not loaded.',
        'clientId=' + clientId + ', entityId=' + entityId +
        '. Reselect client and business.'
      );
      return;
    }

    clearWorkspaceError();
    showWorkspaceProgress(
      'Step 3: Loading menu items from Firestore for ' +
        clientName + ' / ' + entityName + '…',
      null
    );

    google.script.run
    .withSuccessHandler(function(navigation) {
      try {
        const menus = Array.isArray(navigation) ? navigation : [];
        hideWorkspaceProgress();
        if (!menus.length) {
          showWorkspaceError(
            'No menu items returned.',
            'getNavigationForShell("' + clientId + '", "' + entityId + '") ' +
            'returned 0 groups. Run rewriteNavigationInFirestore() in Apps Script.'
          );
          return;
        }
        const visibleMenus = visibleNavigationForMenu(menus);

        // Load user preferences and apply them
        loadAndApplyMenuPreferences(visibleMenus, clientName, entityName);
      } catch (error) {
        showWorkspaceError(
          'Menu load failed in browser.',
          (error && error.message ? error.message : String(error))
        );
      }
    })
      .withFailureHandler(function(error) {
      const browse = document.getElementById('menu-browse-panel');
      const results = document.getElementById('menu-search-results');
      const section = document.getElementById('menu-section');
      if (section) section.hidden = false;
      if (results) results.hidden = true;
      if (browse) {
        browse.innerHTML =
          '<p class="error"><b>Menu could not be loaded.</b><br>' +
          escapeHtml(error && error.message ? error.message : String(error)) +
          '</p>' +
          '<button type="button" class="secondary-button" ' +
          'onclick="reloadNavigationForCurrentSelection()">Try again</button>';
      }
      showWorkspaceError(
          'Menu load failed.',
          (error && error.message ? error.message : String(error)) +
            '\nCall: getNavigationForShell("' + clientId + '", "' + entityId + '")' +
            '\nCheck Apps Script → Executions for timeout or error.'
        );
      })
      .getNavigationForShell(clientId, entityId, nilavaramSessionKey());
  }

  function openInviteWindow() {
    if (!isShellContextComplete()) {
      showWorkspaceError(
        'Select client and business before opening Users & Invitations.',
        ''
      );
      return;
    }

    const clientId = window.nilavaramSelectedClient.id;
    const clientName = window.nilavaramSelectedClient.name;
    const entityId = window.nilavaramSelectedEntity.id;
    const entityName = window.nilavaramSelectedEntity.name;
    const info = window.nilavaramDashboardInfo || {};
    const user = encodeURIComponent(info.user || '');
    const role = encodeURIComponent(info.role || '');

    const baseUrl = String(
      (typeof CONNECTIONS_BOOTSTRAP !== 'undefined' &&
        CONNECTIONS_BOOTSTRAP.accessInfo &&
        CONNECTIONS_BOOTSTRAP.accessInfo.appsScriptWebApp) ||
      window.location.href.split('?')[0]
    ).replace(/\?$/, '');

    const query =
      '?inviteWindow=1' +
      '&clientId=' + encodeURIComponent(clientId) +
      '&entityId=' + encodeURIComponent(entityId) +
      '&clientName=' + encodeURIComponent(clientName) +
      '&entityName=' + encodeURIComponent(entityName) +
      '&user=' + user +
      '&role=' + role;

    const popup = window.open(
      baseUrl + query,
      'NilavaramInvite',
      'popup=yes,width=1500,height=900,resizable=yes,scrollbars=yes'
    );

    if (!popup || popup.closed) {
      showWorkspaceError(
        'Pop-up blocked.',
        'Allow pop-ups for this site, then click Users again.'
      );
      return;
    }

    shareClientIpWithPopup(popup);

    const sessionId = 'invite_' + Date.now();
    registerModuleSession({
      sessionId: sessionId,
      moduleId: 'users',
      moduleLabel: 'Users & Invitations',
      windowName: 'Users & Invitations',
      ipAddress: window.nilavaramClientIp || 'Pending',
      entityId: entityId,
      entityName: entityName,
      status: 'open',
      popup: popup
    });
    monitorModulePopup(sessionId, popup);
    showWorkspaceNotice('Opened Users & Invitations in a new window.');
  }

  function openClientBusinessWindow() {
    if (!isShellContextComplete()) {
      showWorkspaceError(
        'Select client and business before opening Clients & Businesses.',
        ''
      );
      return;
    }

    const clientId = window.nilavaramSelectedClient.id;
    const clientName = window.nilavaramSelectedClient.name;
    const entityId = window.nilavaramSelectedEntity.id;
    const entityName = window.nilavaramSelectedEntity.name;
    const info = window.nilavaramDashboardInfo || {};
    const user = encodeURIComponent(info.user || '');
    const role = encodeURIComponent(info.role || '');

    const baseUrl = String(
      (typeof CONNECTIONS_BOOTSTRAP !== 'undefined' &&
        CONNECTIONS_BOOTSTRAP.accessInfo &&
        CONNECTIONS_BOOTSTRAP.accessInfo.appsScriptWebApp) ||
      window.location.href.split('?')[0]
    ).replace(/\?$/, '');

    const query =
      '?clientBusinessWindow=1' +
      '&clientId=' + encodeURIComponent(clientId) +
      '&entityId=' + encodeURIComponent(entityId) +
      '&clientName=' + encodeURIComponent(clientName) +
      '&entityName=' + encodeURIComponent(entityName) +
      '&user=' + user +
      '&role=' + role;

    const popup = window.open(
      baseUrl + query,
      'NilavaramClientBusiness',
      'popup=yes,width=980,height=900,resizable=yes,scrollbars=yes'
    );

    if (!popup || popup.closed) {
      showWorkspaceError(
        'Pop-up blocked.',
        'Allow pop-ups for this site, then try again.'
      );
      return;
    }

    showWorkspaceNotice('Opened Clients & Businesses in a new window.');
  }
  function openModule(moduleId, label, openSeparateWindow) {
    if (moduleId === 'users') {
      openInviteWindow();
      return;
    }

    if (typeof IS_MAIN_WORKSPACE !== 'undefined' && IS_MAIN_WORKSPACE &&
        typeof IS_MODULE_WINDOW === 'undefined') {
      openModuleWindow(moduleId, label);
      return;
    }
    if (openSeparateWindow) {
      openModuleWindow(moduleId, label);
      return;
    }

    moveContentToTop();
    document.getElementById('output').textContent = 'Loading ' + label + '...';

    if (moduleId === 'all-businesses') {
      if (typeof IS_MODULE_WINDOW !== 'undefined' && IS_MODULE_WINDOW) {
        showModuleSelfServiceGuide(moduleId, label);
        document.getElementById('output').insertAdjacentHTML(
          'beforeend',
          '<p class="help-meta">Business administration is managed from the ' +
          'main workspace. Close this window and use the main workspace ' +
          'context controls to switch client or business.</p>'
        );
        return;
      }
      openClientBusinessWindow();
      return;
    }
    if (moduleId === 'system-status') {
      const data = window.nilavaramDashboardInfo || {};
      document.getElementById('output').innerHTML =
        '<h2>System Status</h2>' +
        '<p><b>Application:</b> Nilavaram</p>' +
        '<p><b>Version:</b> ' + escapeHtml(data.version || '') + '</p>' +
        '<p><b>Status:</b> ' + escapeHtml(data.status || '') + '</p>';
      return;
    }
    if (moduleId === 'pending-features') {
      showPendingFeatures();
      return;
    }
    if (['backup-status', 'wizard-backup', 'back-up', 'backup'].indexOf(moduleId) !== -1 ||
        /backup/i.test(String(label || '')) || /back up/i.test(String(label || ''))) {
      showBackupStatus();
      return;
    }
    if (['archive-library', 'upload-documents', 'missing-documents', 'expiring-documents', 'archived-documents'].indexOf(moduleId) !== -1) {
      showDocumentArchive();
      return;
    }
    if (moduleId === 'about-version-history') {
      showCodeChangeHistory();
      return;
    }
    if (['nilavaram-core',
      'project-start',
      'navigation-guide',
      'getting-started',
      'users-access-guide',
      'accounting-guide',
      'accounting-operating-rules',
      'documents-imports-guide',
      'inactivity-sign-in',
      'project-architecture',
      'faq',
      'about-version-history',
      'admin-technical-guide'
    ].indexOf(moduleId) !== -1) {
      showHelpArticle(moduleId, label);
      return;
    }
    if (moduleId === 'alerts') {
      showAlerts();
      return;
    }
    if (moduleId === 'reminders') {
      showReminders();
      return;
    }
    if (moduleId === 'chart-of-accounts') {
      showChartOfAccounts('list');
      return;
    }
    if (moduleId === 'financial-accounts') {
      showFinancialAccounts();
      return;
    }
    if (moduleId === 'account-add-new') {
      showChartOfAccounts('add');
      return;
    }
    if (moduleId === 'account-batch-edit') {
      showChartOfAccounts('batch');
      return;
    }
    if (['input-main',
      'input-receipt',
      'input-payment',
      'input-journal',
      'input-upload-csv',
      'input-upload-pdf',
      'input-upload-image',
      'input-upload-txt',
      'input-workbench',
      'input-acode-map'
    ].indexOf(moduleId) !== -1) {
      showInputWorkspace(moduleId);
      return;
    }
    if (moduleId === 'new-transaction') {
      showTransactionWorkbench('source-input');
      return;
    }
    if (['transaction-workbench',
      'source-input',
      'reconciliation-validation',
      'account-rule-review',
      'manual-journal-entry'
    ].indexOf(moduleId) !== -1) {
      showTransactionWorkbench(moduleId);
      return;
    }
    if (moduleId === 'connections') {
      showConnections();
      return;
    }
    if (String(moduleId || '').indexOf('wizard-') === 0) {
      showAccountingWizardStatus(moduleId, label);
      return;
    }

    showModuleSelfServiceGuide(moduleId, label);
  }

  function showModuleSelfServiceGuide(moduleId, label) {
    document.getElementById('output').innerHTML =
      buildModuleSelfServiceGuideHtml_(moduleId, label);
  }

  function prependModuleSelfServiceGuide(moduleId, label) {
    const output = document.getElementById('output');
    if (!output ||
        output.querySelector('.module-self-service-guide') ||
        (moduleId === 'financial-accounts' &&
          output.querySelector('.module-help-panel'))) return;
    output.insertAdjacentHTML(
      'afterbegin',
      buildModuleSelfServiceGuideHtml_(moduleId, label)
    );
  }

  function buildModuleSelfServiceGuideHtml_(moduleId, label) {
    const id = String(moduleId || '');
    const title = String(label || moduleId || 'Nilavaram module');
    const guide = getModuleGuide_(id, title);
    return '<section class="module-help-panel module-self-service-guide" ' +
      'aria-labelledby="module-purpose-title">' +
      '<h2>' + escapeHtml(title) + '</h2>' +
        '<h3 id="module-purpose-title">What this window is for</h3>' +
        '<p>' + escapeHtml(guide.purpose) + '</p>' +
        '<h3>Where the information comes from</h3>' +
        '<p>' + escapeHtml(guide.source) + '</p>' +
        '<h3>What you will see</h3>' +
        '<p>' + escapeHtml(guide.display) + '</p>' +
        '<h3>How to use this window</h3>' +
        '<ol>' + guide.steps.map(function(step) {
          return '<li>' + escapeHtml(step) + '</li>';
        }).join('') + '</ol>' +
        '<h3>Learning points</h3>' +
        '<ul>' + guide.learn.map(function(point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul>' +
        '<h3>Do</h3>' +
        '<ul>' + guide.dos.map(function(point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul>' +
        '<h3>Do not</h3>' +
        '<ul>' + guide.donts.map(function(point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul>' +
        '<p class="help-meta"><b>Current status:</b> ' +
          escapeHtml(guide.status) + '</p>' +
      '</section>';
  }

  function getModuleGuide_(id, title) {
    const sourceGuide = typeof getSourceModuleGuide_ === 'function'
      ? getSourceModuleGuide_(id)
      : null;
    if (sourceGuide) {
      return sourceGuide;
    }
    const text = {
      purpose: 'This window is the authorized workspace for ' + title +
        ' in the selected client and business.',
      source: 'The page will read current, authorized records from Firestore. ' +
        'Supporting large files remain in approved OneDrive storage and are ' +
        'shown only through authorized metadata or protected links.',
      display: 'Records belonging to the selected client and business, ' +
        'including their status, dates, responsible users, source references ' +
        'and audit history when available.',
      steps: [
        'Read the purpose and current status before entering information.',
        'Use Add New, Edit, Search, Filter, Refresh or Open only when those actions are displayed.',
        'Save only after checking the selected client, business and entered values.',
        'Refresh after a change to confirm the current server data.'
      ],
      learn: [
        'Nilavaram displays the current authorized status; it does not guess missing information.',
        'A visible menu item does not mean every future data-entry or report service is complete.',
        'Permissions are checked on the server, not only by hiding buttons.'
      ],
      dos: [
        'Use clear names, dates, source references and responsible-person details.',
        'Report missing or incorrect information to an Admin or authorized Editor.',
        'Use the selected business context shown in the header.'
      ],
      donts: [
        'Do not enter passwords, security answers, OAuth tokens, private keys or full payment-card/account secrets.',
        'Do not assume that access to one business gives access to another.',
        'Do not share confidential files outside the approved workflow.'
      ],
      status: 'This menu guide is available now. Live data actions are enabled only when the corresponding verified module is implemented.'
    };
    if (id.indexOf('upload') !== -1 || id.indexOf('document') !== -1 ||
        id.indexOf('archive') !== -1 || id.indexOf('source') !== -1) {
      text.purpose = 'Use this window to register, find, review or preserve source documents and their relationship to the selected business.';
      text.source = 'Firestore supplies document metadata, permissions, workflow status and audit references. OneDrive stores approved large source files.';
      text.display = 'Document name, type, date, business relationship, source status, missing/expired state and an authorized file reference.';
      text.dos.push('Check that the file belongs to the selected business before linking it.');
      text.donts.push('Do not upload duplicate, unrelated or confidential files to the wrong business.');
    } else if (id.indexOf('report') !== -1 || id.indexOf('ledger') !== -1 ||
        id.indexOf('trial') !== -1 || id.indexOf('balance') !== -1 ||
        id.indexOf('profit') !== -1) {
      text.purpose = 'Use this window to review a controlled accounting or management report for the selected business and period.';
      text.source = 'The report must be calculated server-side from approved, posted and authorized Firestore accounting records.';
      text.display = 'Selected period, filters, report totals, validation status, source references and generation time.';
      text.steps = [
        'Select the reporting period and any available filters.',
        'Review validation messages and investigate exceptions.',
        'Refresh after approved postings or corrections.',
        'Export only an approved report when the export action is available.'
      ];
      text.donts.push('Do not treat a draft, unbalanced or unvalidated report as final.');
    } else if (id.indexOf('user') !== -1 || id.indexOf('permission') !== -1 ||
        id.indexOf('security') !== -1 || id.indexOf('access') !== -1) {
      text.purpose = 'Use this window to review or manage authorized Nilavaram users, roles and access to the selected work.';
      text.source = 'Firestore supplies active users, roles, client/business assignments, module permissions and audit records.';
      text.display = 'User identity, status, role, assigned scope, permitted modules and relevant audit information.';
      text.dos.push('Grant the minimum access needed for the person’s work and review it regularly.');
      text.donts.push('Do not share passwords or bypass the invitation and authorization process.');
    } else if (id === 'business-records' || id === 'business-milestones' ||
        id === 'trusts-entities' ||
        id === 'trust-owned-assets' || id === 'borrowings-liabilities' ||
        id === 'estate-documents' || id === 'business-governance-records') {
      text.purpose = 'Use Business Records as one organized workspace for important entity, ownership, asset, liability, estate, planning and governance information. The workspace may contain records related to a business, but the menu is a convenient organization of authorized records and does not by itself decide legal ownership.';
      text.source = 'When these workflows are implemented, Firestore will hold essential structured metadata, permissions, source references and audit history. Large supporting documents will remain once in approved OneDrive storage and will be shown through authorized metadata or protected links. The selected client and business provide access context; they do not require duplicate copies of a record.';
      text.display = 'Business Records will contain seven areas: Business Financial Accounts (bank and investment accounts); Business Milestones; Entities & Ownership; Owned Assets; Borrowings & Liabilities; Estate & Planning Records; and Business & Governance Records. Business Milestones may include formations, registrations, acquisitions, launches, expansions, major contracts, ownership changes, financing events, closures and other business events.';
      text.steps = [
        'Choose the appropriate Business Records area when the detailed workflow is available.',
        'For Business Milestones, create the title and subtitle that best describe the event, then enter its date, status, description, business relationship and source references.',
        'Organize uploaded source documents under the user-selected milestone title and subtitle in the approved OneDrive structure. Firestore retains only essential metadata, permissions, links, hashes and audit references.',
        'Review the client, business context, ownership information and access settings before saving.',
        'Use Search, Filter and Refresh to find current authorized records. Use Add, Edit or Update only when those actions are displayed and permitted.'
      ];
      text.learn = [
        'Business Records is one menu item that groups seven related record areas; it does not mean every record is owned by a business.',
        'Business Milestones are business records, not personal Life Timeline entries.',
        'Bank and investment accounts associated with a specific business belong in Business Records. User-owned retirement accounts belong in Life Timeline and are not business-specific by default.',
        'An asset, liability, estate or governance record may belong to a person, entity, trust, estate or multiple owners according to its source documents.',
        'A business relationship, ownership relationship, tax identity and legal responsibility are separate facts and must not be inferred from the menu location.',
        'The same authorized record can be displayed from each client/business context the user may access without creating duplicate records.',
        'View permission allows reading authorized metadata and protected links. Edit permission allows changes only when the verified workflow and role permit it.'
      ];
      text.dos = [
        'Record the owner, entity, relationship, dates, milestone title, subtitle and source evidence accurately.',
        'Use clear user-selected titles and subtitles so uploaded source documents can be organized consistently in OneDrive.',
        'Keep estate, planning, liability and governance records linked to the correct people or entities.',
        'Use approved OneDrive storage for large supporting documents.',
        'Use the audit and sharing workflow when access is changed.'
      ];
      text.donts = [
        'Do not assume that a record is business-owned merely because it appears under Business Records.',
        'Do not enter passwords, security answers, OAuth tokens, private keys or full financial-account secrets.',
        'Do not create a second copy simply because the same record is viewed from another authorized business.',
        'Do not treat stored records as legal, tax, estate, lending or governance advice.'
      ];
      text.status = 'The consolidated Business Records explanation is available now. Detailed record entry, user-defined milestone titles/subtitles, OneDrive document organization, editing, sharing, search and audit workflows will be enabled only after their verified implementation is complete.';
    } else if (id === 'all-businesses') {
      text.purpose = 'Use the main Nilavaram Workspace to find and select an authorized client and business. The same searchable business list is already displayed there, so All Businesses is not repeated as a separate left-menu destination.';
      text.source = 'The main Workspace reads the current client and business access catalog from the authorized server data. It shows only the clients and businesses available to the signed-in user.';
      text.display = 'The main Workspace shows the client name, each accessible business name, a search box and a Use this business action. Selecting a business changes the working context for the application.';
      text.steps = [
        'Return to the main Workspace instead of opening a duplicate All Businesses menu window.',
        'Search the client or business name in My accessible businesses.',
        'Select Use this business to set the authorized working context.',
        'Confirm the client and business shown in the header before opening another module.'
      ];
      text.learn = [
        'The main Workspace is the single place for the accessible client and business list.',
        'The list is server-filtered; seeing one business does not grant access to another.',
        'Changing the selected business changes the working context but does not copy or move records.'
      ];
      text.dos = [
        'Use the client name and business name shown in the main Workspace and header.',
        'Refresh the Workspace when access or business information may have changed.'
      ];
      text.donts = [
        'Do not assume that a business name appearing in another context is accessible without server authorization.',
        'Do not treat this selection list as a business record-editing page.'
      ];
      text.status = 'The main Workspace business selector is available now. The separate All Businesses left-menu destination has been removed to avoid duplicate navigation.';
    } else if (id.indexOf('transaction') !== -1 || id.indexOf('input') !== -1 ||
        id.indexOf('journal') !== -1 || id.indexOf('acode') !== -1) {
      text.purpose = 'Use this window to enter, import, review, categorize or prepare transaction information before controlled posting.';
      text.source = 'Firestore supplies drafts, source indexes, account rules and audit records. Connected imports use approved permissioned integrations.';
      text.display = 'Source batch, dates, descriptions, amounts, proposed accounts, evidence references, review status and exceptions.';
      text.donts.push('Do not post an entry without checking evidence, account coding, balance and approval status.');
    } else if (id === 'life-timeline' || id === 'identity-immigration') {
      text.purpose = 'Use Life Timeline as your personal history workspace. It brings memories, achievements, identity records, education, employment, publications, licenses, health information and renewal dates together in one user-owned place. It is not a business-owned record system.';

  function financialAccountValue_(account, key) {
    return account && account[key] ? escapeHtml(account[key]) : '';
  }

  function renderFinancialAccountForm_(account) {
    const formHost = document.getElementById('financial-account-form');
    if (!formHost) return;
    const item = account || {};
    formHost.hidden = false;
    formHost.innerHTML =
      '<h3>' + (item.id ? 'Edit Financial Account' : 'Add Financial Account') + '</h3>' +
      '<form id="financial-account-edit-form">' +
        '<input type="hidden" name="id" value="' + financialAccountValue_(item, 'id') + '">' +
        '<label>Institution name<input name="institutionName" required maxlength="120" value="' +
          financialAccountValue_(item, 'institutionName') + '"></label>' +
        '<label>Account name<input name="accountName" required maxlength="120" value="' +
          financialAccountValue_(item, 'accountName') + '"></label>' +
        '<label>Account type<input name="accountType" required maxlength="60" placeholder="Bank, investment, retirement" value="' +
          financialAccountValue_(item, 'accountType') + '"></label>' +
        '<label>Last four digits only<input name="lastFour" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="' +
          financialAccountValue_(item, 'lastFour') + '"></label>' +
        '<label>Currency<input name="currency" maxlength="3" value="' +
          (financialAccountValue_(item, 'currency') || 'USD') + '"></label>' +
        '<label>Source document reference<input name="sourceDocumentId" maxlength="200" value="' +
          financialAccountValue_(item, 'sourceDocumentId') + '"></label>' +
        '<div class="button-row">' +
          '<button class="primary-button" type="submit">Save</button>' +
          '<button class="secondary-button" type="button" id="financial-account-cancel">Cancel</button>' +
        '</div>' +
      '</form>';
    document.getElementById('financial-account-cancel').onclick =
      function() { formHost.hidden = true; };
    document.getElementById('financial-account-edit-form').onsubmit =
      function(event) {
        event.preventDefault();
        const values = {};
        new FormData(event.target).forEach(function(value, key) {
          values[key] = String(value);
        });
        setFinancialAccountStatus_('Saving...');
        google.script.run
          .withSuccessHandler(function() {
            formHost.hidden = true;
            setFinancialAccountStatus_('Financial account saved.');
            loadFinancialAccounts_();
          })
          .withFailureHandler(function(error) {
            setFinancialAccountStatus_(
              error && error.message ? error.message : String(error), true
            );
          })
          .saveFinancialAccount(
            CLIENT_ID,
            ENTITY_ID,
            values
          );
      };
  }

  function setFinancialAccountStatus_(message, isError) {
    const status = document.getElementById('financial-account-status');
    if (!status) return;
    status.textContent = message;
    status.className = isError ? 'error' : 'help-meta';
  }

  function loadFinancialAccounts_() {
    setFinancialAccountStatus_('Loading accounts...');
    google.script.run
      .withSuccessHandler(function(accounts) {
        const list = document.getElementById('financial-account-list');
        if (!list) return;
        if (!accounts.length) {
          list.innerHTML = '<p>No financial accounts have been recorded for this business.</p>';
          setFinancialAccountStatus_('No accounts found.');
          return;
        }
        list.innerHTML = '<div class="table-wrap"><table><thead><tr>' +
          '<th>Institution</th><th>Account</th><th>Type</th><th>Last four</th>' +
          '<th>Currency</th><th>Source</th><th>Action</th></tr></thead><tbody>' +
          accounts.map(function(account) {
            return '<tr><td>' + financialAccountValue_(account, 'institutionName') +
              '</td><td>' + financialAccountValue_(account, 'accountName') +
              '</td><td>' + financialAccountValue_(account, 'accountType') +
              '</td><td>**** ' + financialAccountValue_(account, 'lastFour') +
              '</td><td>' + financialAccountValue_(account, 'currency') +
              '</td><td>' + financialAccountValue_(account, 'sourceDocumentId') +
              '</td><td>' +
              (account.canEdit ? '<button type="button" class="secondary-button financial-account-edit" data-id="' +
                financialAccountValue_(account, 'id') + '">Edit</button> ' : '') +
              (account.canShare ? '<button type="button" class="secondary-button financial-account-share" data-id="' +
                financialAccountValue_(account, 'id') + '">Manage sharing</button>' : '') +
              '</td></tr>';
          }).join('') + '</tbody></table></div>';
        list.querySelectorAll('.financial-account-edit').forEach(function(button) {
          button.onclick = function() {
            const account = accounts.find(function(item) {
              return item.id === button.getAttribute('data-id');
            });
            renderFinancialAccountForm_(account);
          };
        });
        list.querySelectorAll('.financial-account-share').forEach(function(button) {
          button.onclick = function() {
            renderFinancialAccountSharing_(
              button.getAttribute('data-id'),
              accounts.find(function(item) {
                return item.id === button.getAttribute('data-id');
              })
            );
          };
        });
        setFinancialAccountStatus_(accounts.length + ' account(s) loaded.');
      })
      .withFailureHandler(function(error) {
        setFinancialAccountStatus_(
          error && error.message ? error.message : String(error), true
        );
      })
      .getFinancialAccounts(CLIENT_ID, ENTITY_ID);
  }

  function renderFinancialAccountSharing_(recordId, account) {
    const host = document.getElementById('financial-account-sharing');
    if (!host) return;
    host.hidden = false;
    host.innerHTML =
      '<h3>Manage sharing: ' + financialAccountValue_(account, 'accountName') + '</h3>' +
      '<section class="module-help-panel">' +
        '<h4>Sharing instructions</h4>' +
        '<ol>' +
          '<li>Select an active user who already has access to this business.</li>' +
          '<li>Choose <b>View</b> if the user only needs to read the information.</li>' +
          '<li>Choose <b>Edit</b> if the user must update the information.</li>' +
          '<li>To revoke access, uncheck the user and click <b>Save sharing</b>.</li>' +
        '</ol>' +
        '<p>Only share information needed for the user&#39;s work. Do not use this page to share passwords, security answers, tokens or full account numbers.</p>' +
      '</section>' +
      '<p class="help-meta">Choose active users who already have access to this business. ' +
      'Revoking access removes it immediately on the next read.</p>' +
      '<p id="financial-account-sharing-status" class="help-meta">Loading users...</p>' +
      '<div id="financial-account-sharing-users"></div>' +
      '<div class="button-row">' +
        '<button id="financial-account-sharing-save" class="primary-button" type="button">Save sharing</button>' +
        '<button id="financial-account-sharing-cancel" class="secondary-button" type="button">Cancel</button>' +
      '</div>';
    document.getElementById('financial-account-sharing-cancel').onclick =
      function() { host.hidden = true; };
    google.script.run
      .withSuccessHandler(function(candidates) {
        const users = document.getElementById('financial-account-sharing-users');
        if (!users) return;
        if (!candidates.length) {
          users.innerHTML = '<p>No other active users currently have access to this business.</p>';
        } else {
          users.innerHTML = candidates.map(function(user, index) {
            return '<label class="sharing-user-row">' +
              '<input type="checkbox" data-share-index="' + index + '"' +
                (user.permission ? ' checked' : '') + '>' +
              '<span><b>' + escapeHtml(user.displayName) + '</b><br>' +
                '<span class="help-meta">' + escapeHtml(user.email) + '</span></span>' +
              '<select data-permission-index="' + index + '">' +
                '<option value="view"' + (user.permission !== 'edit' ? ' selected' : '') +
                  '>View</option>' +
                '<option value="edit"' + (user.permission === 'edit' ? ' selected' : '') +
                  '>Edit</option></select></label>';
          }).join('');
        }
        host.dataset.candidates = JSON.stringify(candidates);
        const status = document.getElementById('financial-account-sharing-status');
        if (status) status.textContent = 'Select users and permission, then save.';
      })
      .withFailureHandler(function(error) {
        const status = document.getElementById('financial-account-sharing-status');
        if (status) {
          status.textContent = error && error.message ? error.message : String(error);
          status.className = 'error';
        }
      })
      .getFinancialAccountShareCandidates(CLIENT_ID, ENTITY_ID, recordId);
    document.getElementById('financial-account-sharing-save').onclick =
      function() {
        const candidates = JSON.parse(host.dataset.candidates || '[]');
        const shares = candidates.filter(function(user, index) {
          const checkbox = host.querySelector(
            '[data-share-index="' + index + '"]'
          );
          return checkbox && checkbox.checked;
        }).map(function(user, index) {
          const select = host.querySelector(
            '[data-permission-index="' + index + '"]'
          );
          return {
            email: user.email,
            permission: select ? select.value : 'view'
          };
        });
        const status = document.getElementById('financial-account-sharing-status');
        if (status) status.textContent = 'Saving sharing...';
        google.script.run
          .withSuccessHandler(function() {
            host.hidden = true;
            setFinancialAccountStatus_('Sharing updated.');
            loadFinancialAccounts_();
          })
          .withFailureHandler(function(error) {
            if (status) {
              status.textContent = error && error.message ? error.message : String(error);
              status.className = 'error';
            }
          })
          .updateFinancialAccountSharing(
            CLIENT_ID,
            ENTITY_ID,
            recordId,
            shares
          );
      };
  }

  function openModuleWindow(moduleId, label) {
    if (!isShellContextComplete()) {
      showWorkspaceNotice('Select client and business before opening a module window.');
      return;
    }

    const entityId = window.nilavaramSelectedEntity.id;
    const entityName = window.nilavaramSelectedEntity.name;
    const clientId = window.nilavaramSelectedClient.id;
    const clientName = window.nilavaramSelectedClient.name;
    const sessionId = 'sess_' + Date.now() + '_' +
      Math.random().toString(36).slice(2, 8);
    const friendlyWindowName = label || 'Module window';

    google.script.run
      .withSuccessHandler(function(auth) {
        resumeMainWorkspaceIfInactive();
        markUserActivity();
        const userEmail = encodeURIComponent(
          (window.nilavaramDashboardInfo && window.nilavaramDashboardInfo.user) || ''
        );
        const userRole = encodeURIComponent(
          (window.nilavaramDashboardInfo && window.nilavaramDashboardInfo.role) || ''
        );
        const baseUrl = String(
          (typeof CONNECTIONS_BOOTSTRAP !== 'undefined' &&
            CONNECTIONS_BOOTSTRAP.accessInfo &&
            CONNECTIONS_BOOTSTRAP.accessInfo.appsScriptWebApp) ||
          window.location.href.split('?')[0]
        ).replace(/\?$/, '');
        const query = '?moduleWindow=1' +
          '&moduleId=' + encodeURIComponent(auth.moduleId || moduleId) +
          '&moduleLabel=' + encodeURIComponent(auth.moduleLabel || label || moduleId) +
          '&clientId=' + encodeURIComponent(clientId) +
          '&clientName=' + encodeURIComponent(clientName) +
          '&entityId=' + encodeURIComponent(auth.entityId || entityId) +
          '&entityName=' + encodeURIComponent(auth.entityName || entityName) +
          '&sessionId=' + encodeURIComponent(sessionId) +
          '&userEmail=' + userEmail +
          '&userRole=' + userRole;
        const popup = window.open(
          baseUrl + query,
          'Nilavaram_' + sessionId,
          'popup=yes,width=1500,height=900,resizable=yes,scrollbars=yes'
        );
        if (!popup || popup.closed) {
          registerModuleSession({
            sessionId: sessionId,
            moduleId: auth.moduleId || moduleId,
            moduleLabel: auth.moduleLabel || label || moduleId,
            windowName: friendlyWindowName,
            ipAddress: window.nilavaramClientIp || 'Pending',
            entityId: auth.entityId || entityId,
            entityName: auth.entityName || entityName,
            status: 'blocked',
            closeReason: 'popup-blocked'
          });
          showWorkspaceNotice(
            'The module window was blocked. Allow pop-ups for Nilavaram and try again.'
          );
          return;
        }
        registerModuleSession({
          sessionId: sessionId,
          moduleId: auth.moduleId || moduleId,
          moduleLabel: auth.moduleLabel || label || moduleId,
          windowName: friendlyWindowName,
          ipAddress: window.nilavaramClientIp || 'Pending',
          entityId: auth.entityId || entityId,
          entityName: auth.entityName || entityName,
          status: 'open',
          popup: popup
        });
        monitorModulePopup(sessionId, popup);
      })
      .withFailureHandler(function(error) {
        registerModuleSession({
          sessionId: sessionId,
          moduleId: moduleId,
          moduleLabel: label || moduleId,
          windowName: friendlyWindowName,
          ipAddress: window.nilavaramClientIp || 'Pending',
          entityId: entityId,
          entityName: entityName,
          status: 'blocked',
          closeReason: 'access-denied'
        });
        showWorkspaceNotice(error && error.message
          ? error.message
          : 'That module could not be opened.');
      })
      .authorizeModuleAccess(moduleId, entityId, clientId);
  }

  function loadAndApplyMenuPreferences(navigation, clientName, entityName) {
    const sessionKey = nilavaramSessionKey();
    const userEmail = (window.nilavaramDashboardInfo || {}).user || '';

    google.script.run
      .withSuccessHandler(function(preferences) {
        window.nilavaramMenuPreferences = preferences || { items: [] };
        window.nilavaramOriginalNavigation = navigation;

        // Apply preferences to filter/reorder the menu
        const filtered = applyMenuPreferencesFilter(navigation, preferences);
        applyNavigationToMenu(filtered);
        updateCustomizeMenuButtonVisibility();

        // Display workspace notice after menu is rendered and count is available
        const visibleCount = window.nilavaramVisibleMenuCount;
        showWorkspaceNotice(
          'Menu loaded: ' + visibleCount + ' item(s) for ' +
            clientName + ' / ' + entityName + '.'
        );
      })
      .withFailureHandler(function(error) {
        console.log('Menu preferences load failed (using defaults):', error);
        window.nilavaramMenuPreferences = { items: [] };
        window.nilavaramOriginalNavigation = navigation;
        applyNavigationToMenu(navigation);
        updateCustomizeMenuButtonVisibility();

        // Display workspace notice after menu is rendered and count is available
        const visibleCount = window.nilavaramVisibleMenuCount;
        showWorkspaceNotice(
          'Menu loaded: ' + visibleCount + ' item(s) for ' +
            clientName + ' / ' + entityName + '.'
        );
      })
      .getUserMenuPreferences(sessionKey);
  }

  function applyMenuPreferencesFilter(navigation, preferences) {
    if (!preferences || !preferences.items || !preferences.items.length) {
      return navigation;
    }

    const prefsMap = {};
    preferences.items.forEach(function(pref) {
      prefsMap[String(pref.id)] = pref;
    });

    function filterAndReorder(nodes) {
      return nodes
        .map(function(node) {
          const pref = prefsMap[String(node.id)];
          const visible = !pref || pref.visible !== false;

          if (!visible) {
            return null;
          }

          const filtered = {
            id: node.id,
            label: node.label,
            description: node.description || '',
            type: node.type || 'link',
            moduleId: node.moduleId || '',
            wiringStatus: node.wiringStatus || 'planned',
            children: filterAndReorder(node.children || [])
          };

          if (pref && pref.order !== undefined) {
            filtered._preferenceOrder = pref.order;
          }

          return filtered;
        })
        .filter(function(node) {
          return node !== null;
        })
        .sort(function(a, b) {
          const orderA = a._preferenceOrder !== undefined ? a._preferenceOrder : 999999;
          const orderB = b._preferenceOrder !== undefined ? b._preferenceOrder : 999999;
          return orderA - orderB;
        });
    }

    return filterAndReorder(navigation);
  }

  function updateCustomizeMenuButtonVisibility() {
    const btn = document.getElementById('customize-menu-button');
    if (btn) {
      btn.style.display = isShellContextComplete() ? 'block' : 'none';
    }
  }

  function openMenuCustomizer() {
    if (!isShellContextComplete()) {
      showWorkspaceError(
        'Select client and business first.',
        'Choose a client and business before customizing the menu.'
      );
      return;
    }

    const navigation = window.nilavaramOriginalNavigation || [];
    const preferences = window.nilavaramMenuPreferences || { items: [] };
    const userEmail = (window.nilavaramDashboardInfo || {}).user || '';
    const sessionKey = nilavaramSessionKey();

    // Create and open MenuCustomizer popup
    if (typeof menuCustomizerOpen === 'function') {
      menuCustomizerOpen(navigation, preferences, userEmail, sessionKey);
    }
  }

  function reloadMenuCustomization() {
    const clientId = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.id;
    const entityId = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.id;

    if (clientId && entityId) {
      reloadNavigationForCurrentSelection();
    }
  }

  // Bind customize menu button event
  function bindCustomizeMenuButton() {
    const btn = document.getElementById('customize-menu-button');
    if (btn) {
      btn.onclick = openMenuCustomizer;
    }
  }

  // Call on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindCustomizeMenuButton);
  } else {
    bindCustomizeMenuButton();
  }
</script>
