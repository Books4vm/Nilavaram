<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('DashboardStyles') ?>
  <style>
    body.module-window-body {
      height: auto;
      min-height: 100vh;
      overflow: auto;
    }
    .module-window-header {
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .module-content {
      margin: 16px;
      max-width: none;
    }
    .header-panel-right {
      align-items: center;
      display: flex;
      justify-content: flex-end;
    }
    .module-shell-badge {
      align-self: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 700;
      line-height: 1.2;
      max-width: 220px;
      padding: 8px 12px;
      text-align: right;
      white-space: normal;
    }
    .invite-url-box {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin: 12px 0;
      word-break: break-all;
    }
    .invite-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 16px;
    }
    .invite-message {
      width: 100%;
      min-height: 180px;
      font-family: inherit;
      font-size: inherit;
    }
    .users-table {
      border-collapse: collapse;
      width: 100%;
    }
    .users-table th,
    .users-table td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .invite-access-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 16px 0;
      padding: 12px 14px;
    }
    .invite-toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .invite-toggle-btn {
      min-width: 88px;
    }
    .invite-toggle-btn.is-selected,
    .invite-toggle-btn[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .invite-group-caption {
      font-weight: 700;
      margin: 12px 0 4px;
    }
    .invite-group-caption:first-of-type {
      margin-top: 8px;
    }
    .invite-empty-group {
      color: var(--muted-text);
      font-size: .92em;
      margin: 4px 0 0;
    }
    .invite-check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px 12px;
      margin-top: 8px;
    }
    .invite-check-item {
      display: block;
      line-height: 1.4;
    }
  </style>
</head>
<body class="module-window-body">

  <header class="header module-window-header">
    <div class="header-bar">
      <div class="header-panel header-panel-left">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
            <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/>
          </svg>
          <h1>Nilavaram</h1>
        </div>
      </div>
      <div class="header-panel header-panel-center">
        <div id="startup">Loading header...</div>
      </div>
      <div class="header-panel header-panel-right">
        <div id="module-shell-meta" class="module-shell-badge"></div>
      </div>
    </div>
  </header>

  <main id="output" class="content panel module-content" tabindex="-1">
    <p>Loading invite window...</p>
  </main>

  <script>
    const INVITE_CLIENT_ID = <?!= clientIdJson ?>;
    const INVITE_CLIENT_NAME = <?!= clientNameJson ?>;
    const INVITE_ENTITY_ID = <?!= entityIdJson ?>;
    const INVITE_ENTITY_NAME = <?!= entityNameJson ?>;
    const INVITE_USER_EMAIL = <?!= userEmailJson ?>;
    const INVITE_USER_ROLE = <?!= userRoleJson ?>;
    const PAGE_VIEW_STARTED_AT = new Date();
    let inviteHeaderTimerId = null;
  </script>

  <?!= include('InviteModuleCatalog') ?>
  <?!= include('InviteAccessPicker') ?>
  <?!= include('InviteWindowCore') ?>

  <script>
    window.onload = function() {
      initInviteWindow();
      if (inviteHeaderTimerId !== null) {
        window.clearInterval(inviteHeaderTimerId);
      }
      inviteHeaderTimerId = window.setInterval(renderInviteShellHeader, 1000);
    };
  </script>

</body>
</html>
