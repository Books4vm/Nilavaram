<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --font-size-base: 20px;
      --page-background: #d9f2ff;
      --surface: #f7fcff;
      --surface-strong: #ffffff;
      --text: #050505;
      --muted-text: #344054;
      --border: #7eb8d4;
      --hover: #bde8fb;
      --primary: #075985;
      --primary-text: #ffffff;
      --focus: #005fcc;
      --error: #a40000;
      --success: #075f2c;
      color-scheme: light;
    }
    :root[data-font-size="standard"] { --font-size-base: 18px; }
    :root[data-font-size="small"] { --font-size-base: 16px; }
    :root[data-font-size="large"] { --font-size-base: 20px; }
    :root[data-theme="dark"] {
      --page-background: #08111f;
      --surface: #111c2d;
      --surface-strong: #172338;
      --text: #f8fafc;
      --muted-text: #cbd5e1;
      --border: #52647d;
      --hover: #243b5a;
      --primary: #38bdf8;
      --primary-text: #06111d;
      --focus: #7dd3fc;
      --error: #fca5a5;
      --success: #86efac;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        --page-background: #08111f;
        --surface: #111c2d;
        --surface-strong: #172338;
        --text: #f8fafc;
        --muted-text: #cbd5e1;
        --border: #52647d;
        --hover: #243b5a;
        --primary: #38bdf8;
        --primary-text: #06111d;
        --focus: #7dd3fc;
        --error: #fca5a5;
        --success: #86efac;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--page-background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: var(--font-size-base);
      height: 100vh;
      margin: 0;
      overflow: hidden;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .header {
      background: var(--surface-strong);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
      padding: 18px 24px;
      position: relative;
      z-index: 10;
    }
    .header-top {
      align-items: center;
      display: flex;
      gap: 20px;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      align-items: center;
      display: flex;
      gap: 12px;
    }
    .brand-icon {
      color: var(--primary);
      flex: 0 0 auto;
      height: 34px;
      width: 34px;
    }
    .header h1 {
      font-size: 1.55em;
      line-height: 1.2;
      margin: 0;
    }
    .appearance-controls {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .appearance-field span {
      display: block;
      font-size: .78em;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .appearance-field select {
      min-width: 145px;
      width: auto;
    }
    #startup { color: var(--muted-text); }
    .startup-line {
      align-items: baseline;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
    }
    .startup-time-line {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 6px;
    }
    .layout {
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: minmax(280px, 330px) 1fr;
      min-height: 0;
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }
    .menu-section { margin-bottom: 3px; }
    .menu-group-button {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      font-weight: bold;
      justify-content: space-between;
      padding: 11px 10px;
      text-align: left;
      width: 100%;
      color: var(--text);
      font: inherit;
    }
    .menu-group-button:hover { background: var(--hover); }
    .menu-arrow { font-size: 1.1em; }
    .submenu { display: none; margin-left: 14px; }
    .submenu.is-open { display: block; }
    .submenu-empty {
      color: var(--muted-text);
      font-size: .8em;
      padding: 6px 10px 10px;
    }
    .menu-button {
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      padding: 10px;
      text-align: left;
      width: 100%;
      color: var(--text);
      font: inherit;
    }
    .menu-button:hover { background: var(--hover); }
    .menu-main-heading,
    .menu-button.menu-level-1 {
      background: transparent;
      border: 0;
      border-bottom: 3px solid var(--primary);
      border-radius: 0;
      color: var(--text);
      display: block;
      font: inherit;
      font-weight: 800;
      margin-top: 12px;
      padding: 10px 8px 7px;
      text-align: left;
      width: 100%;
    }
    .menu-button.menu-level-1 { cursor: pointer; }
    .menu-subheading {
      color: var(--text);
      font-size: .9em;
      font-weight: 650;
      padding: 9px 8px 3px 16px;
    }
    .menu-open-list {
      display: block;
      margin: 0;
    }
    .menu-button.menu-level-2 {
      font-size: .9em;
      padding: 7px 8px 7px 16px;
    }
    .menu-button.menu-level-3 {
      font-size: .84em;
      padding: 6px 8px 6px 27px;
    }
    .content {
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }
    .panel {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      min-height: 220px;
    }
    .panel > h2:first-child {
      background: var(--surface-strong);
      border-bottom: 1px solid var(--border);
      margin: -22px 0 18px;
      padding: 22px 0 12px;
      position: sticky;
      top: -24px;
      z-index: 3;
    }
    .error { color: var(--error); }
    .success { color: var(--success); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, button {
      font: inherit;
    }
    input, select, textarea {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      min-height: 44px;
      padding: 9px 11px;
      width: 100%;
    }
    textarea {
      font: inherit;
      min-height: 260px;
      resize: vertical;
    }
    .primary-button {
      background: var(--primary);
      border: 0;
      border-radius: 7px;
      color: var(--primary-text);
      cursor: pointer;
      min-height: 44px;
      padding: 10px 18px;
    }
    .secondary-button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      cursor: pointer;
      min-height: 44px;
      padding: 10px 18px;
    }
    .help-content { white-space: pre-wrap; }
    .help-meta { color: var(--muted-text); }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .alert-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 11px;
      text-align: left;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    @media (max-width: 700px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .header-top { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        border-bottom: 1px solid var(--border);
        border-right: 0;
        max-height: 45vh;
      }
      .content { overflow: visible; }
      .form-grid { grid-template-columns: 1fr; }
      .appearance-controls { width: 100%; }
      .appearance-field { flex: 1 1 150px; }
      .appearance-field select { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
          <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/>
        </svg>
        <h1>Nilavaram</h1>
      </div>
      <div class="appearance-controls" aria-label="Display preferences">
        <label class="appearance-field" for="theme-choice">
          <span>Appearance</span>
          <select id="theme-choice">
            <option value="sky">Sky blue</option>
            <option value="dark">Dark</option>
            <option value="system">Device setting</option>
          </select>
        </label>
        <label class="appearance-field" for="font-choice">
          <span>Text size</span>
          <select id="font-choice">
            <option value="large">Large</option>
            <option value="standard">Standard</option>
            <option value="small">Small</option>
          </select>
        </label>
      </div>
    </div>
    <div id="startup">Loading...</div>
  </header>

  <div class="layout">
    <nav id="menu" class="sidebar" aria-label="Main navigation">
      Loading menu...
    </nav>
    <main class="content">
      <div id="output" class="panel" tabindex="-1">
        <h2>Dashboard</h2>
        <p>Nilavaram is opening. You may begin here while the menu loads.</p>
      </div>
    </main>
  </div>

  <script>
    const PAGE_VIEW_STARTED_AT = new Date();
    const CONNECTIONS_BOOTSTRAP = <?!= connectionsBootstrapJson ?>;
    const OPEN_CONNECTIONS_ON_LOAD = <?!= openConnectionsOnLoadJson ?>;
    let startupTimerId = null;

    window.onload = function() {
      initializeDisplayPreferences();
      if (OPEN_CONNECTIONS_ON_LOAD) {
        showConnections();
      } else {
        showDefaultDashboard();
      }
      loadStartup();
    };

    function showDefaultDashboard() {
      document.getElementById('output').innerHTML =
        '<h2>Dashboard</h2>' +
        '<p>This is the default window. Only this right-side panel changes when you choose a menu item.</p>' +
        '<p id="dashboard-loading" class="help-meta">Connecting securely and loading the menu...</p>';
    }

    function moveContentToTop() {
      const content = document.querySelector('.content');
      if (content) content.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function readPreference(key, fallback) {
      try {
        return window.localStorage.getItem(key) || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function savePreference(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (error) {
        // The selected preference still applies for this page session.
      }
    }

    function applyDisplayPreferences(theme, fontSize) {
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.fontSize = fontSize;
      document.getElementById('theme-choice').value = theme;
      document.getElementById('font-choice').value = fontSize;
    }

    function initializeDisplayPreferences() {
      const theme = readPreference('nilavaram-theme', 'sky');
      const fontSize = readPreference('nilavaram-font-size', 'large');
      applyDisplayPreferences(theme, fontSize);

      document.getElementById('theme-choice').addEventListener('change', function(event) {
        document.documentElement.dataset.theme = event.target.value;
        savePreference('nilavaram-theme', event.target.value);
      });
      document.getElementById('font-choice').addEventListener('change', function(event) {
        document.documentElement.dataset.fontSize = event.target.value;
        savePreference('nilavaram-font-size', event.target.value);
      });
    }

    function escapeHtml(value) {
      const element = document.createElement('div');
      element.textContent = String(value == null ? '' : value);
      return element.innerHTML;
    }

    function showError(error) {
      const message = error && error.message ? error.message : String(error);
      document.getElementById('output').innerHTML =
        '<p class="error">' + escapeHtml(message) + '</p>';
    }

    function getPacificViewTime(date) {
      const dateParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        weekday: 'long'
      }).formatToParts(date);
      const timeParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).formatToParts(date);
      const part = function(parts, type) {
        const found = parts.find(function(item) { return item.type === type; });
        return found ? found.value : '';
      };

      return {
        date:
          part(dateParts, 'day') + '-' +
          part(dateParts, 'month').toUpperCase() + '-' +
          part(dateParts, 'year'),
        weekday: part(dateParts, 'weekday'),
        time:
          part(timeParts, 'hour') + ':' +
          part(timeParts, 'minute') + ' ' +
          part(timeParts, 'dayPeriod')
      };
    }

    function renderStartupInfo(data) {
      const started = getPacificViewTime(PAGE_VIEW_STARTED_AT);
      const current = getPacificViewTime(new Date());

      document.getElementById('startup').innerHTML =
        '<div class="startup-line">' +
          '<span><b>User:</b> ' + escapeHtml(data.user) + '</span>' +
          '<span><b>Role:</b> ' + escapeHtml(data.role) + '</span>' +
          '<span>' + escapeHtml(started.date) + ' ' +
            escapeHtml(started.weekday) + '</span>' +
        '</div>' +
        '<div class="startup-time-line">' +
          '<span><b>Started viewing:</b> ' + escapeHtml(started.time) +
            ' PACIFIC TIME</span>' +
          '<span><b>Current time:</b> ' + escapeHtml(current.time) +
            ' PACIFIC TIME</span>' +
          '<button class="secondary-button" type="button" ' +
            'onclick="copySessionDetails()">Copy session details</button>' +
          '<span id="copy-session-result" aria-live="polite"></span>' +
        '</div>';
    }

    function getSessionDetailsText() {
      const data = window.nilavaramDashboardInfo;
      const started = getPacificViewTime(PAGE_VIEW_STARTED_AT);
      const current = getPacificViewTime(new Date());
      return [
        'User: ' + data.user,
        'Role: ' + data.role,
        started.date + ' ' + started.weekday,
        'Started viewing: ' + started.time + ' PACIFIC TIME',
        'Current time: ' + current.time + ' PACIFIC TIME'
      ].join('\n');
    }

    function copySessionDetails() {
      const text = getSessionDetailsText();
      const showCopied = function() {
        const result = document.getElementById('copy-session-result');
        if (result) result.textContent = 'Copied.';
      };
      const fallbackCopy = function() {
        const field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.position = 'absolute';
        field.style.left = '-9999px';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        document.body.removeChild(field);
        showCopied();
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function loadStartup() {
      google.script.run
        .withSuccessHandler(function(shell) {
          const data = shell.info;
          window.nilavaramDashboardInfo = data;
          renderStartupInfo(data);
          if (startupTimerId !== null) {
            window.clearInterval(startupTimerId);
          }
          startupTimerId = window.setInterval(function() {
            renderStartupInfo(data);
          }, 1000);

          if (data.accessStatus === 'invited') {
            document.getElementById('menu').textContent = '';
            document.getElementById('output').innerHTML =
              '<h2>Invitation found</h2>' +
              '<p>Your Google account has been invited to Nilavaram as ' +
              escapeHtml(data.role) + '.</p>' +
              '<button class="primary-button" type="button" ' +
              'onclick="acceptInvitation()">Accept invitation</button>';
            return;
          }
          if (data.accessStatus !== 'active') {
            document.getElementById('menu').textContent = '';
            document.getElementById('output').innerHTML =
              '<h2>Access unavailable</h2>' +
              '<p class="error">This Google account has not been invited.</p>';
            return;
          }
          buildMenu(shell.navigation || []);
          const loading = document.getElementById('dashboard-loading');
          if (loading) loading.textContent = 'Menu ready.';
        })
        .withFailureHandler(showError)
        .getDashboardShell();
    }

    function acceptInvitation() {
      google.script.run
        .withSuccessHandler(function() { window.location.reload(); })
        .withFailureHandler(showError)
        .acceptMyInvitation();
    }

    function loadMenu() {
      google.script.run
        .withSuccessHandler(buildMenu)
        .withFailureHandler(showError)
        .getNavigation();
    }

    function buildMenuLegacy(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      window.nilavaramNavigation = data;

      data.forEach(function(section) {
        if (section.type === 'link') {
          const directButton = document.createElement('button');
          directButton.type = 'button';
          directButton.className = 'menu-button';
          directButton.textContent = section.label;
          directButton.onclick = function() {
            openModule(section.moduleId, section.label);
          };
          menu.appendChild(directButton);
          return;
        }

        const wrapper = document.createElement('section');
        wrapper.className = 'menu-section';
        const groupButton = document.createElement('button');
        groupButton.type = 'button';
        groupButton.className = 'menu-group-button';
        groupButton.setAttribute('aria-expanded', 'false');

        const label = document.createElement('span');
        label.textContent = section.label;
        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.textContent = '↓';
        arrow.setAttribute('aria-hidden', 'true');
        groupButton.appendChild(label);
        groupButton.appendChild(arrow);

        const submenu = document.createElement('div');
        submenu.className = 'submenu';

        section.buttons.forEach(function(item) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'menu-button';
          button.textContent = item.label;
          button.onclick = function() { openModule(item.moduleId, item.label); };
          submenu.appendChild(button);
        });

        if (section.buttons.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'submenu-empty';
          empty.textContent = 'Modules will be added next.';
          submenu.appendChild(empty);
        }

        groupButton.onclick = function() {
          const isOpen = submenu.classList.toggle('is-open');
          groupButton.setAttribute('aria-expanded', String(isOpen));
          arrow.textContent = isOpen ? '↑' : '↓';
        };

        wrapper.appendChild(groupButton);
        wrapper.appendChild(submenu);
        menu.appendChild(wrapper);
      });
    }

    function buildMenu(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      window.nilavaramNavigation = data;
      data.forEach(function(section) {
        menu.appendChild(createNavigationNode(section, 1));
      });
    }

    function sentenceStyleMenuLabel(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      let result = text.charAt(0).toUpperCase() +
        text.slice(1).toLowerCase();
      [
        ['csv', 'CSV'],
        ['pdf', 'PDF'],
        ['faq', 'FAQ'],
        ['nilavaram', 'Nilavaram'],
        ['firestore', 'Firestore'],
        ['github', 'GitHub']
      ].forEach(function(item) {
        result = result.replace(
          new RegExp('\\b' + item[0] + '\\b', 'gi'),
          item[1]
        );
      });
      return result;
    }

    function createNavigationNode(node, level) {
      const children = node.children || [];
      if (node.type === 'link' && (!node.children || !node.children.length)) {
        const directButton = document.createElement('button');
        directButton.type = 'button';
        directButton.className = 'menu-button menu-level-' + level;
        directButton.textContent = level >= 3
          ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
          : (level === 2
            ? sentenceStyleMenuLabel(node.label)
            : node.label);
        directButton.onclick = function() {
          openModule(node.moduleId, node.label);
        };
        return directButton;
      }

      const wrapper = document.createElement(level === 1 ? 'section' : 'div');
      wrapper.className = 'menu-section';
      const heading = document.createElement('div');
      heading.className = level === 1
        ? 'menu-main-heading'
        : 'menu-subheading';
      heading.textContent = level >= 3
        ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
        : (level === 2
          ? sentenceStyleMenuLabel(node.label)
          : node.label);

      const submenu = document.createElement('div');
      submenu.className = 'menu-open-list';
      children.forEach(function(child) {
        submenu.appendChild(createNavigationNode(child, level + 1));
      });

      if (children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'submenu-empty';
        empty.textContent = 'Modules will be added next.';
        submenu.appendChild(empty);
      }

      wrapper.appendChild(heading);
      wrapper.appendChild(submenu);
      return wrapper;
    }

    function openModule(moduleId, label) {
      moveContentToTop();
      document.getElementById('output').textContent = 'Loading ' + label + '...';

      if (moduleId === 'dashboard') {
        showDefaultDashboard();
        const loading = document.getElementById('dashboard-loading');
        if (loading) loading.textContent = 'Menu ready.';
        return;
      }
      if (moduleId === 'all-businesses') {
        document.getElementById('output').innerHTML =
          '<h2>All Businesses</h2>' +
          '<p>Business records and management actions will be added next.</p>';
        return;
      }
      if (moduleId === 'system-status') {
        const data = window.nilavaramDashboardInfo;
        document.getElementById('output').innerHTML =
          '<h2>System Status</h2>' +
          '<p><b>Application:</b> Nilavaram</p>' +
          '<p><b>Version:</b> ' + escapeHtml(data.version) + '</p>' +
          '<p><b>Status:</b> ' + escapeHtml(data.status) + '</p>';
        return;
      }
      if (moduleId === 'pending-features') {
        showPendingFeatures();
        return;
      }
      if (moduleId === 'about-version-history') {
        showCodeChangeHistory();
        return;
      }
      if ([
        'nilavaram-core',
        'project-start',
        'navigation-guide',
        'getting-started',
        'users-access-guide',
        'accounting-guide',
        'accounting-operating-rules',
        'documents-imports-guide',
        'inactivity-sign-in',
        'project-architecture',
        'faq',
        'about-version-history',
        'admin-technical-guide'
      ].indexOf(moduleId) !== -1) {
        showHelpArticle(moduleId, label);
        return;
      }
      if (moduleId === 'alerts') {
        showAlerts();
        return;

        showChartOfAccounts();
        return;

        showTransactionWorkbench('source-input');
        return;

        'transaction-workbench',
        'source-input',
        'reconciliation-validation',
        'account-rule-review',
        'manual-journal-entry'
      ].indexOf(moduleId) !== -1) {
        showTransactionWorkbench(moduleId);
        return;
      }
      if (moduleId === 'users') {
        showUsers();
        return;

        google.script.run
          .withSuccessHandler(function(result) {
            document.getElementById('output').innerHTML =
              '<pre>' + escapeHtml(JSON.stringify(result, null, 2)) + '</pre>';
          })
          .withFailureHandler(showError)
          .testFirestore();
        return;
      }
      if (moduleId === 'connections') {
        showConnections();
        return;
      }
      if (String(moduleId || '').indexOf('wizard-') === 0) {
        showAccountingWizardStatus(moduleId, label);
        return;
      }

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('output').textContent = result.message;
        })
        .withFailureHandler(showError)
        .openModule(moduleId);
    }

    function appendMarkdownText(element, text) {
      String(text).split(/(\*\*[^*]+\*\*)/).forEach(function(part) {
        if (
          part.indexOf('**') === 0 &&
          part.lastIndexOf('**') === part.length - 2
        ) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          element.appendChild(strong);
        } else {
          element.appendChild(document.createTextNode(part));
        }
      });
    }

    function renderMarkdown(container, markdown) {
      container.textContent = '';
      let list = null;
      let codeBlock = null;

      String(markdown || '').split(/\r?\n/).forEach(function(line) {
        if (line.trim() === '```') {
          if (codeBlock) {
            container.appendChild(codeBlock);
            codeBlock = null;
          } else {
            codeBlock = document.createElement('pre');
            codeBlock.appendChild(document.createElement('code'));
          }
          return;
        }
        if (codeBlock) {
          codeBlock.firstChild.textContent +=
            (codeBlock.firstChild.textContent ? '\n' : '') + line;
          return;
        }

        const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (headingMatch) {
          list = null;
          const heading = document.createElement('h' + headingMatch[1].length);
          appendMarkdownText(heading, headingMatch[2]);
          container.appendChild(heading);
          return;
        }

        const listMatch = line.match(/^\s*-\s+(.+)$/);
        if (listMatch) {
          if (!list) {
            list = document.createElement('ul');
            container.appendChild(list);
          }
          const item = document.createElement('li');
          appendMarkdownText(item, listMatch[1]);
          list.appendChild(item);
          return;
        }

        list = null;
        if (!line.trim()) return;
        const paragraph = document.createElement('p');
        appendMarkdownText(paragraph, line);
        container.appendChild(paragraph);
      });

      if (codeBlock) container.appendChild(codeBlock);
    }

    function formatStoredDate(value) {
      const parts = String(value || '').split('-');
      if (parts.length !== 3) return String(value || '');
      const months = [
        'JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
        'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'
      ];
      return parts[2] + '-' + months[Number(parts[1]) - 1] + '-' + parts[0];
    }

    async function sha256File(file) {
      const buffer = await file.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest))
        .map(function(value) { return value.toString(16).padStart(2, '0'); })
        .join('');
    }

    async function saveSourceInputForm(event) {
      event.preventDefault();
      const file = document.getElementById('source-file').files[0];
      if (!file) return;
      const message = document.getElementById('source-input-message');
      message.textContent = ' Calculating file identity...';
      try {
        const hash = await sha256File(file);
        document.getElementById('source-hash-message').textContent =
          'SHA-256: ' + hash;
        const input = {
          sourceType: document.getElementById('source-type').value,
          date: document.getElementById('source-date').value,
          amount: document.getElementById('source-amount').value,
          description: document.getElementById('source-description').value,
          externalReference: document.getElementById('source-reference').value,
          storageReference: document.getElementById('source-storage').value,
          evidenceName: file.name,
          fileHash: hash
        };
        message.textContent = ' Registering...';
        google.script.run
          .withSuccessHandler(function(result) {
            message.innerHTML = ' <span class="success">' +
              escapeHtml(result.message) + '</span>';
            showTransactionWorkbench('source-input');
          })
          .withFailureHandler(function(error) {
            message.innerHTML = ' <span class="error">' +
              escapeHtml(error.message) + '</span>';
          })
          .registerSourceRecord(input);
      } catch (error) {
        message.innerHTML = ' <span class="error">' +
          escapeHtml(error.message) + '</span>';
      }
    }

          '<div><label>Approved rule</label><select id="rule-id">' + ruleOptions + '</select></div>' +
          '<div><label>Debit account</label><select id="rule-debit">' + accountOptions + '</select></div>' +
          '<div><label>Credit account</label><select id="rule-credit">' + accountOptions + '</select></div>' +
          '<div><label>Reason if suggestion changed</label><input id="rule-change-reason"></div>' +
        '</div><button class="primary-button" type="submit">Approve account assignment</button> ' +
        '<span id="rule-message"></span></form><hr><h3>Visible active rules</h3>' +
        renderRulesTable(data.rules);
      if (!accounts.length) {
        google.script.run.withSuccessHandler(function(setup) {
          window.nilavaramTransactionSetup = setup;
          renderAccountRuleReview(data);
        }).withFailureHandler(showError).getSimpleTransactionSetup();
        return;
      }
      document.getElementById('rule-id').onchange = applySelectedRule;
      document.getElementById('rule-approval-form').onsubmit = saveRuleApproval;
    }

    function renderRulesTable(rules) {
      let html = '<table><thead><tr><th>Rule</th><th>Version</th><th>Reason</th>' +
        '<th>Suggestion</th><th>Confidence</th><th>Status</th></tr></thead><tbody>';
      rules.forEach(function(rule) {
        html += '<tr><td>' + escapeHtml(rule.ruleId || rule.id) + '</td>' +
          '<td>' + escapeHtml(rule.version || 1) + '</td>' +
          '<td>' + escapeHtml(rule.matchReason || '') + '</td>' +
          '<td>' + escapeHtml((rule.debitAccountCode || '') + ' / ' +
            (rule.creditAccountCode || '')) + '</td>' +
          '<td>' + escapeHtml(rule.confidence || 0) + '%</td>' +
          '<td><span class="success">✓ Active</span></td></tr>';
      });
      return html + '</tbody></table>';
    }

    function applySelectedRule() {
      const id = document.getElementById('rule-id').value;
      const rule = (window.nilavaramWorkbench.rules || []).find(function(item) {
        return item.id === id;
      });
      if (!rule) return;
      document.getElementById('rule-debit').value = rule.debitAccountCode;
      document.getElementById('rule-credit').value = rule.creditAccountCode;
    }

    function saveRuleApproval(event) {
      event.preventDefault();
      const input = {
        sourceRecordId: document.getElementById('rule-source').value,
        ruleId: document.getElementById('rule-id').value,
        debitAccountCode: document.getElementById('rule-debit').value,
        creditAccountCode: document.getElementById('rule-credit').value,
        changedReason: document.getElementById('rule-change-reason').value
      };
      document.getElementById('rule-message').textContent = ' Approving...';
      google.script.run.withSuccessHandler(function(result) {
        document.getElementById('rule-message').innerHTML =
          ' <span class="success">' + escapeHtml(result.message) + '</span>';
      }).withFailureHandler(function(error) {
        document.getElementById('rule-message').innerHTML =
          ' <span class="error">' + escapeHtml(error.message) + '</span>';
      }).approveSourceAccountAssignment(input);
    }

    function renderManualJournalEntry(data) {
      const setup = window.nilavaramTransactionSetup;
      if (!setup) {
        google.script.run.withSuccessHandler(function(result) {
          window.nilavaramTransactionSetup = result;
          renderManualJournalEntry(data);
        }).withFailureHandler(showError).getSimpleTransactionSetup();
        return;
      }
      const entities = setup.entities.map(function(entity) {
        return '<option value="' + escapeHtml(entity.id) + '">' +
          escapeHtml(entity.name) + '</option>';
      }).join('');
      const accounts = setup.accounts.map(function(account) {
        return '<option value="' + escapeHtml(account.code) + '">' +
          escapeHtml(account.code + ' — ' + account.name) + '</option>';
      }).join('');
      document.getElementById('workbench-view').innerHTML =
        '<h3>Manual / Correction Journal Entry</h3>' +
        '<p class="error">Manual entries require evidence and audit notes. Material or uncertain corrections should be reviewed by a qualified CPA.</p>' +
        '<form id="journal-entry-form"><div class="form-grid">' +
          '<div><label>Purpose</label><select id="je-purpose"><option value="manual">Manual Journal Entry</option><option value="correction">Correction Journal Entry</option></select></div>' +
          '<div><label>Entity</label><select id="je-entity">' + entities + '</select></div>' +
          '<div><label>Date</label><input id="je-date" type="date" required></div>' +
          '<div><label>Description</label><input id="je-description" required></div>' +
          '<div><label>Amount</label><input id="je-amount" type="number" min="0.01" step="0.01" required></div>' +
          '<div><label>Debit account</label><select id="je-debit">' + accounts + '</select></div>' +
          '<div><label>Credit account</label><select id="je-credit">' + accounts + '</select></div>' +
          '<div><label>Evidence file</label><input id="je-file" type="file" required></div>' +
          '<div><label>Storage reference</label><input id="je-storage" value="E:\\nn\\Nilavaram Data\\01 Source Documents" required></div>' +
          '<div><label>Audit explanation</label><textarea id="je-note" required></textarea></div>' +
        '</div><button class="primary-button" type="submit">Save JE on verification hold</button> ' +
        '<span id="je-message"></span></form>';
      document.getElementById('journal-entry-form').onsubmit = saveJournalEntryForm;
    }

    async function saveJournalEntryForm(event) {
      event.preventDefault();
      const file = document.getElementById('je-file').files[0];
      if (!file) return;
      const message = document.getElementById('je-message');
      message.textContent = ' Calculating file identity...';
      try {
        const input = {
          entryPurpose: document.getElementById('je-purpose').value,
          entityId: document.getElementById('je-entity').value,
          date: document.getElementById('je-date').value,
          description: document.getElementById('je-description').value,
          amount: document.getElementById('je-amount').value,
          debitAccountCode: document.getElementById('je-debit').value,
          creditAccountCode: document.getElementById('je-credit').value,
          evidenceName: file.name,
          fileHash: await sha256File(file),
          storageReference: document.getElementById('je-storage').value,
          auditNote: document.getElementById('je-note').value
        };
        message.textContent = ' Saving controlled draft...';
        google.script.run.withSuccessHandler(function(result) {
          message.innerHTML = ' <span class="success">' +
            escapeHtml(result.message) + '</span>';
        }).withFailureHandler(function(error) {
          message.innerHTML = ' <span class="error">' +
            escapeHtml(error.message) + '</span>';
        }).saveEvidenceBackedJournalEntry(input);
      } catch (error) {
        message.innerHTML = ' <span class="error">' +
          escapeHtml(error.message) + '</span>';
      }
    }

    function showSimpleTransaction() {
      document.getElementById('output').textContent =
        'Preparing New Transaction...';
      google.script.run
        .withSuccessHandler(renderSimpleTransaction)
        .withFailureHandler(showError)
        .getSimpleTransactionSetup();
    }

    function renderSimpleTransaction(data) {
      window.nilavaramTransactionSetup = data;
      let entities = '';
      data.entities.forEach(function(entity) {
        entities += '<option value="' + escapeHtml(entity.id) + '">' +
          escapeHtml(entity.name) + '</option>';
      });
      let accounts = '';
      data.accounts.forEach(function(account) {
        accounts += '<option value="' + escapeHtml(account.code) + '">' +
          escapeHtml(account.code + ' — ' + account.name) + '</option>';
      });

      document.getElementById('output').innerHTML =
        '<h2>New Transaction</h2>' +
        '<p>Describe what happened. Nilavaram can reuse a previously approved pattern and prepares both accounting sides.</p>' +
        '<form id="transaction-form">' +
          '<div class="form-grid">' +
            '<div><label for="transaction-kind">What happened?</label>' +
              '<select id="transaction-kind">' +
                '<option value="paycheck">Paycheck received</option>' +
                '<option value="bill">Bill paid</option>' +
                '<option value="purchase">Purchase made</option>' +
                '<option value="transfer">Money transferred</option>' +
                '<option value="receipt">Money received</option>' +
                '<option value="loan">Loan payment</option>' +
                '<option value="other">Something else</option>' +
              '</select></div>' +
            '<div><label for="transaction-entity">Who or which organization?</label>' +
              '<select id="transaction-entity">' + entities + '</select></div>' +
            '<div><label for="transaction-description">Description from bank, CSV or PDF</label>' +
              '<input id="transaction-description" placeholder="Example: CTU PAYROLL" required></div>' +
            '<div><label for="transaction-amount">Amount</label>' +
              '<input id="transaction-amount" type="number" min="0.01" step="0.01" required></div>' +
            '<div><label for="transaction-date">Date</label>' +
              '<input id="transaction-date" type="date" required></div>' +
            '<div><label for="transaction-document">Document or PDF name, if available</label>' +
              '<input id="transaction-document"></div>' +
          '</div>' +
          '<button class="secondary-button" id="find-pattern" type="button">Find previous pattern</button>' +
          '<p id="pattern-message" class="help-meta"></p>' +
          '<details id="transaction-accounting"><summary>View or change accounting entry</summary>' +
            '<div class="form-grid">' +
              '<div><label for="transaction-debit">Money received into / Debit</label>' +
                '<select id="transaction-debit">' + accounts + '</select></div>' +
              '<div><label for="transaction-credit">Source or ownership / Credit</label>' +
                '<select id="transaction-credit">' + accounts + '</select></div>' +
            '</div>' +
          '</details>' +
          '<div class="button-row">' +
            '<button class="primary-button" type="submit">Save and post transaction</button>' +
            '<span id="transaction-message"></span>' +
          '</div>' +
        '</form>';

      document.getElementById('find-pattern').onclick = findPreviousPattern;
      document.getElementById('transaction-description').onblur =
        findPreviousPattern;
      document.getElementById('transaction-form').onsubmit =
        saveSimpleTransactionForm;
    }

    function findPreviousPattern() {
      const description =
        document.getElementById('transaction-description').value;
      if (!description.trim()) return;
      document.getElementById('pattern-message').textContent =
        'Looking for a previous pattern...';
      google.script.run
        .withSuccessHandler(function(suggestion) {
          if (!suggestion) {
            document.getElementById('pattern-message').textContent =
              'No approved pattern was found. Open the accounting details and select the accounts.';
            document.getElementById('transaction-accounting').open = true;
            return;
          }
          document.getElementById('transaction-kind').value =
            suggestion.transactionType;
          document.getElementById('transaction-entity').value =
            suggestion.memberEntityId;
          document.getElementById('transaction-debit').value =
            suggestion.debitAccountCode;
          document.getElementById('transaction-credit').value =
            suggestion.creditAccountCode;
          document.getElementById('pattern-message').textContent =
            suggestion.explanation;
        })
        .withFailureHandler(function(error) {
          document.getElementById('pattern-message').innerHTML =
            '<span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .findTransactionSuggestion(description);
    }

    function saveSimpleTransactionForm(event) {
      event.preventDefault();
      const input = {
        entityId: document.getElementById('transaction-entity').value,
        description: document.getElementById('transaction-description').value,
        amount: document.getElementById('transaction-amount').value,
        date: document.getElementById('transaction-date').value,
        sourceDocumentName: document.getElementById('transaction-document').value,
        debitAccountCode: document.getElementById('transaction-debit').value,
        creditAccountCode: document.getElementById('transaction-credit').value
      };
      document.getElementById('transaction-message').textContent =
        ' Saving and posting...';
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            document.getElementById('transaction-message').innerHTML =
              ' <span class="success">' +
              escapeHtml(result.message) + '</span>';
            document.getElementById('transaction-form').reset();
            return;
          }
          window.nilavaramPostingRetryId = result.transactionId;
          document.getElementById('transaction-message').innerHTML =
            ' <span class="error">' + escapeHtml(result.message) + '</span>' +
            ' <button class="secondary-button" type="button" ' +
            'onclick="retryPosting()">Retry posting saved draft</button>';
        })
        .withFailureHandler(function(error) {
          document.getElementById('transaction-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .saveAndPostSimpleTransaction(input);
    }

    function retryPosting() {
      const transactionId = window.nilavaramPostingRetryId;
      if (!transactionId) return;
      document.getElementById('transaction-message').textContent =
        ' Retrying posting...';
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('transaction-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          document.getElementById('transaction-form').reset();
          window.nilavaramPostingRetryId = '';
        })
        .withFailureHandler(function(error) {
          document.getElementById('transaction-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>' +
            ' <button class="secondary-button" type="button" ' +
            'onclick="retryPosting()">Retry posting saved draft</button>';
        })
        .postTransaction(transactionId);
    }

    function saveUserForm(event) {
      event.preventDefault();
      const modules = document.getElementById('allowedModules').value
        .split(',')
        .map(function(value) { return value.trim(); })
        .filter(Boolean);
      const input = {
        email: document.getElementById('email').value,
        displayName: document.getElementById('displayName').value,
        role: document.getElementById('role').value,
        allowedModules: modules
      };
      document.getElementById('user-message').textContent = ' Saving...';

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('user-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          document.getElementById('user-form').reset();
          loadUsers();
        })
        .withFailureHandler(function(error) {
          document.getElementById('user-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .saveUser(input);
    }

    function loadUsers() {
      google.script.run
        .withSuccessHandler(function(users) {
          window.nilavaramUsers = users;
          let html = '<table><thead><tr><th>Email</th><th>Name</th>' +
            '<th>Role</th><th>Status</th><th>Ltd modules</th><th></th></tr></thead><tbody>';
          users.forEach(function(user, index) {
            html += '<tr><td>' + escapeHtml(user.email) + '</td>' +
              '<td>' + escapeHtml(user.displayName) + '</td>' +
              '<td>' + escapeHtml(user.role) + '</td>' +
              '<td>' + escapeHtml(user.status) + '</td>' +
              '<td>' + escapeHtml((user.allowedModules || []).join(', ')) + '</td>' +
              '<td><button type="button" onclick="editUser(' + index + ')">Edit</button></td></tr>';
          });
          html += '</tbody></table>';
          document.getElementById('users-list').innerHTML = html;
        })
        .withFailureHandler(showError)
        .getUsers();
    }

    function editUser(index) {
      const user = (window.nilavaramUsers || [])[index];
      if (!user) return;
      document.getElementById('email').value = user.email || '';
      document.getElementById('displayName').value = user.displayName || '';
      document.getElementById('role').value = user.role || 'reader';
      document.getElementById('allowedModules').value =
        (user.allowedModules || []).join(', ');
      document.getElementById('email').focus();
    }
  </script>
</body>
</html>
