<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --font-size-base: 20px;
      --page-background: #d9f2ff;
      --surface: #f7fcff;
      --surface-strong: #ffffff;
      --text: #050505;
      --muted-text: #344054;
      --border: #7eb8d4;
      --hover: #bde8fb;
      --primary: #075985;
      --primary-text: #ffffff;
      --focus: #005fcc;
      --error: #a40000;
      --success: #075f2c;
      color-scheme: light;
    }
    :root[data-font-size="standard"] { --font-size-base: 18px; }
    :root[data-font-size="small"] { --font-size-base: 16px; }
    :root[data-font-size="large"] { --font-size-base: 20px; }
    :root[data-theme="dark"] {
      --page-background: #08111f;
      --surface: #111c2d;
      --surface-strong: #172338;
      --text: #f8fafc;
      --muted-text: #cbd5e1;
      --border: #52647d;
      --hover: #243b5a;
      --primary: #38bdf8;
      --primary-text: #06111d;
      --focus: #7dd3fc;
      --error: #fca5a5;
      --success: #86efac;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        --page-background: #08111f;
        --surface: #111c2d;
        --surface-strong: #172338;
        --text: #f8fafc;
        --muted-text: #cbd5e1;
        --border: #52647d;
        --hover: #243b5a;
        --primary: #38bdf8;
        --primary-text: #06111d;
        --focus: #7dd3fc;
        --error: #fca5a5;
        --success: #86efac;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--page-background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: var(--font-size-base);
      height: 100vh;
      margin: 0;
      overflow: hidden;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .header {
      background: var(--surface-strong);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
      padding: 18px 24px;
      position: relative;
      z-index: 10;
    }
    .header-top {
      align-items: center;
      display: flex;
      gap: 20px;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      align-items: center;
      display: flex;
      gap: 12px;
    }
    .brand-icon {
      color: var(--primary);
      flex: 0 0 auto;
      height: 34px;
      width: 34px;
    }
    .header h1 {
      font-size: 1.55em;
      line-height: 1.2;
      margin: 0;
    }
    .appearance-controls {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .appearance-field span {
      display: block;
      font-size: .78em;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .appearance-field select {
      min-width: 145px;
      width: auto;
    }
    #startup { color: var(--muted-text); }
    .startup-line {
      align-items: baseline;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
    }
    .startup-time-line {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 6px;
    }
    .layout {
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: minmax(280px, 330px) 1fr;
      min-height: 0;
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }
    .menu-section { margin-bottom: 3px; }
    .menu-group-button {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      font-weight: bold;
      justify-content: space-between;
      padding: 11px 10px;
      text-align: left;
      width: 100%;
      color: var(--text);
      font: inherit;
    }
    .menu-group-button:hover { background: var(--hover); }
    .menu-arrow { font-size: 1.1em; }
    .submenu { display: none; margin-left: 14px; }
    .submenu.is-open { display: block; }
    .submenu-empty {
      color: var(--muted-text);
      font-size: .8em;
      padding: 6px 10px 10px;
    }
    .menu-button {
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      padding: 10px;
      text-align: left;
      width: 100%;
      color: var(--text);
      font: inherit;
    }
    .menu-button:hover { background: var(--hover); }
    .menu-main-heading,
    .menu-button.menu-level-1 {
      background: transparent;
      border: 0;
      border-bottom: 3px solid var(--primary);
      border-radius: 0;
      color: var(--text);
      display: block;
      font: inherit;
      font-weight: 800;
      margin-top: 12px;
      padding: 10px 8px 7px;
      text-align: left;
      width: 100%;
    }
    .menu-button.menu-level-1 { cursor: pointer; }
    .menu-subheading {
      color: var(--text);
      font-size: .9em;
      font-weight: 650;
      padding: 9px 8px 3px 16px;
    }
    .menu-open-list {
      display: block;
      margin: 0;
    }
    .menu-button.menu-level-2 {
      font-size: .9em;
      padding: 7px 8px 7px 16px;
    }
    .menu-button.menu-level-3 {
      font-size: .84em;
      padding: 6px 8px 6px 27px;
    }
    .content {
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }
    .panel {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      min-height: 220px;
    }
    .panel > h2:first-child {
      background: var(--surface-strong);
      border-bottom: 1px solid var(--border);
      margin: -22px 0 18px;
      padding: 22px 0 12px;
      position: sticky;
      top: -24px;
      z-index: 3;
    }
    .error { color: var(--error); }
    .success { color: var(--success); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, button {
      font: inherit;
    }
    input, select, textarea {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      min-height: 44px;
      padding: 9px 11px;
      width: 100%;
    }
    textarea {
      font: inherit;
      min-height: 260px;
      resize: vertical;
    }
    .primary-button {
      background: var(--primary);
      border: 0;
      border-radius: 7px;
      color: var(--primary-text);
      cursor: pointer;
      min-height: 44px;
      padding: 10px 18px;
    }
    .secondary-button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      cursor: pointer;
      min-height: 44px;
      padding: 10px 18px;
    }
    .help-content { white-space: pre-wrap; }
    .help-meta { color: var(--muted-text); }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .alert-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 11px;
      text-align: left;
    }
    .input-card-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      margin: 18px 0;
    }
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .input-card h3 { margin-top: 0; }
    .status-green, .status-yellow, .status-red {
      border-radius: 999px;
      display: inline-block;
      font-size: .82em;
      font-weight: 800;
      padding: 4px 10px;
    }
    .status-green { background: #d8f5df; color: #075f2c; }
    .status-yellow { background: #fff2b8; color: #6b4e00; }
    .status-red { background: #ffd9d9; color: #8a0000; }
    .transaction-modal {
      background: var(--surface-strong);
      border: 2px solid var(--primary);
      border-radius: 12px;
      color: var(--text);
      height: 92vh;
      max-width: 1500px;
      padding: 0;
      width: 96vw;
    }
    .transaction-modal::backdrop { background: rgba(0, 0, 0, .58); }
    .modal-shell { display: flex; flex-direction: column; height: 100%; }
    .modal-header, .modal-footer {
      background: var(--surface-strong);
      padding: 14px 18px;
    }
    .modal-header { border-bottom: 1px solid var(--border); }
    .modal-footer { border-top: 1px solid var(--border); }
    .modal-body { overflow: auto; padding: 16px 18px; }
    .download-row {
      border: 1px solid var(--border);
      border-left-width: 7px;
      border-radius: 8px;
      display: grid;
      gap: 8px 12px;
      grid-template-columns: 150px 190px minmax(260px, 2fr) repeat(5, minmax(105px, 1fr));
      margin-bottom: 10px;
      padding: 10px;
    }
    .download-row.green { border-left-color: #16823a; }
    .download-row.yellow { border-left-color: #d3a000; }
    .download-row.red { border-left-color: #b42318; }
    .download-row.acode-review-row {
      grid-template-columns: 150px 190px minmax(280px, 2fr) 150px minmax(220px, 1fr) minmax(280px, 1.5fr);
    }
    .download-cell small { color: var(--muted-text); display: block; font-weight: 700; }
    .journal-row {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(220px, 2fr) 1fr 1fr minmax(160px, 1fr) auto;
      margin-bottom: 8px;
    }
    @media (max-width: 1100px) {
      .download-row { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .journal-row { grid-template-columns: 1fr 1fr; }
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    @media (max-width: 700px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .header-top { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        border-bottom: 1px solid var(--border);
        border-right: 0;
        max-height: 45vh;
      }
      .content { overflow: visible; }
      .form-grid { grid-template-columns: 1fr; }
      .appearance-controls { width: 100%; }
      .appearance-field { flex: 1 1 150px; }
      .appearance-field select { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/>
          <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/>
        </svg>
        <h1>Nilavaram</h1>
      </div>
      <div class="appearance-controls" aria-label="Display preferences">
        <label class="appearance-field" for="theme-choice">
          <span>Appearance</span>
          <select id="theme-choice">
            <option value="sky">Sky blue</option>
            <option value="dark">Dark</option>
            <option value="system">Device setting</option>
          </select>
        </label>
        <label class="appearance-field" for="font-choice">
          <span>Text size</span>
          <select id="font-choice">
            <option value="large">Large</option>
            <option value="standard">Standard</option>
            <option value="small">Small</option>
          </select>
        </label>
      </div>
    </div>
    <div id="startup">Loading...</div>
  </header>

  <div class="layout">
    <nav id="menu" class="sidebar" aria-label="Main navigation">
      Loading menu...
    </nav>
    <main class="content">
      <div id="output" class="panel" tabindex="-1">
        <h2>Dashboard</h2>
        <p>Nilavaram is opening. You may begin here while the menu loads.</p>
      </div>
    </main>
  </div>

  <script>
    const PAGE_VIEW_STARTED_AT = new Date();
    const CONNECTIONS_BOOTSTRAP = <?!= connectionsBootstrapJson ?>;
    const OPEN_CONNECTIONS_ON_LOAD = <?!= openConnectionsOnLoadJson ?>;
    let startupTimerId = null;

    window.onload = function() {
      initializeDisplayPreferences();
      if (OPEN_CONNECTIONS_ON_LOAD) {
        showConnections();
      } else {
        showDefaultDashboard();
      }
      loadStartup();
    };

    function showDefaultDashboard() {
      document.getElementById('output').innerHTML =
        '<h2>Dashboard</h2>' +
        '<p>This is the default window. Only this right-side panel changes when you choose a menu item.</p>' +
        '<p id="dashboard-loading" class="help-meta">Connecting securely and loading the menu...</p>';
    }

    function moveContentToTop() {
      const content = document.querySelector('.content');
      if (content) content.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function readPreference(key, fallback) {
      try {
        return window.localStorage.getItem(key) || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function savePreference(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (error) {
        // The selected preference still applies for this page session.
      }
    }

    function applyDisplayPreferences(theme, fontSize) {
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.fontSize = fontSize;
      document.getElementById('theme-choice').value = theme;
      document.getElementById('font-choice').value = fontSize;
    }

    function initializeDisplayPreferences() {
      const theme = readPreference('nilavaram-theme', 'sky');
      const fontSize = readPreference('nilavaram-font-size', 'large');
      applyDisplayPreferences(theme, fontSize);

      document.getElementById('theme-choice').addEventListener('change', function(event) {
        document.documentElement.dataset.theme = event.target.value;
        savePreference('nilavaram-theme', event.target.value);
      });
      document.getElementById('font-choice').addEventListener('change', function(event) {
        document.documentElement.dataset.fontSize = event.target.value;
        savePreference('nilavaram-font-size', event.target.value);
      });
    }

    function escapeHtml(value) {
      const element = document.createElement('div');
      element.textContent = String(value == null ? '' : value);
      return element.innerHTML;
    }

    function showError(error) {
      const message = error && error.message ? error.message : String(error);
      document.getElementById('output').innerHTML =
        '<p class="error">' + escapeHtml(message) + '</p>';
    }

    function getPacificViewTime(date) {
      const dateParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        weekday: 'long'
      }).formatToParts(date);
      const timeParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).formatToParts(date);
      const part = function(parts, type) {
        const found = parts.find(function(item) { return item.type === type; });
        return found ? found.value : '';
      };

      return {
        date:
          part(dateParts, 'day') + '-' +
          part(dateParts, 'month').toUpperCase() + '-' +
          part(dateParts, 'year'),
        weekday: part(dateParts, 'weekday'),
        time:
          part(timeParts, 'hour') + ':' +
          part(timeParts, 'minute') + ' ' +
          part(timeParts, 'dayPeriod')
      };
    }

    function renderStartupInfo(data) {
      const started = getPacificViewTime(PAGE_VIEW_STARTED_AT);
      const current = getPacificViewTime(new Date());

      document.getElementById('startup').innerHTML =
        '<div class="startup-line">' +
          '<span><b>User:</b> ' + escapeHtml(data.user) + '</span>' +
          '<span><b>Role:</b> ' + escapeHtml(data.role) + '</span>' +
          '<span>' + escapeHtml(started.date) + ' ' +
            escapeHtml(started.weekday) + '</span>' +
        '</div>' +
        '<div class="startup-time-line">' +
          '<span><b>Started viewing:</b> ' + escapeHtml(started.time) +
            ' PACIFIC TIME</span>' +
          '<span><b>Current time:</b> ' + escapeHtml(current.time) +
            ' PACIFIC TIME</span>' +
          '<button class="secondary-button" type="button" ' +
            'onclick="copySessionDetails()">Copy session details</button>' +
          '<span id="copy-session-result" aria-live="polite"></span>' +
        '</div>';
    }

    function getSessionDetailsText() {
      const data = window.nilavaramDashboardInfo;
      const started = getPacificViewTime(PAGE_VIEW_STARTED_AT);
      const current = getPacificViewTime(new Date());
      return [
        'User: ' + data.user,
        'Role: ' + data.role,
        started.date + ' ' + started.weekday,
        'Started viewing: ' + started.time + ' PACIFIC TIME',
        'Current time: ' + current.time + ' PACIFIC TIME'
      ].join('\n');
    }

    function copySessionDetails() {
      const text = getSessionDetailsText();
      const showCopied = function() {
        const result = document.getElementById('copy-session-result');
        if (result) result.textContent = 'Copied.';
      };
      const fallbackCopy = function() {
        const field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.position = 'absolute';
        field.style.left = '-9999px';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        document.body.removeChild(field);
        showCopied();
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function loadStartup() {
      const activateShell = function(shell, recoveryMessage) {
          const data = shell.info;
          window.nilavaramDashboardInfo = data;
          renderStartupInfo(data);
          if (startupTimerId !== null) {
            window.clearInterval(startupTimerId);
          }
          startupTimerId = window.setInterval(function() {
            renderStartupInfo(data);
          }, 1000);

          if (data.accessStatus === 'invited') {
            document.getElementById('menu').textContent = '';
            document.getElementById('output').innerHTML =
              '<h2>Invitation found</h2>' +
              '<p>Your Google account has been invited to Nilavaram as ' +
              escapeHtml(data.role) + '.</p>' +
              '<button class="primary-button" type="button" ' +
              'onclick="acceptInvitation()">Accept invitation</button>';
            return;
          }
          if (data.accessStatus !== 'active') {
            document.getElementById('menu').textContent = '';
            document.getElementById('output').innerHTML =
              '<h2>Access unavailable</h2>' +
              '<p class="error">This Google account has not been invited.</p>';
            return;
          }
          buildMenu(shell.navigation || []);
          if (recoveryMessage) {
            showRestrictedOneDriveRecovery(recoveryMessage);
          } else {
            const loading = document.getElementById('dashboard-loading');
            if (loading) loading.textContent = 'Menu ready.';
          }
      };
      google.script.run
        .withSuccessHandler(function(shell) { activateShell(shell, ''); })
        .withFailureHandler(function(error) {
          const originalMessage = error && error.message
            ? error.message : String(error);
          google.script.run
            .withSuccessHandler(function(shell) {
              activateShell(shell, originalMessage);
            })
            .withFailureHandler(showError)
            .getPrimaryAdminRecoveryShell();
        })
        .getDashboardShell();
    }

    function acceptInvitation() {
      google.script.run
        .withSuccessHandler(function() { window.location.reload(); })
        .withFailureHandler(showError)
        .acceptMyInvitation();
    }

    function loadMenu() {
      google.script.run
        .withSuccessHandler(buildMenu)
        .withFailureHandler(showError)
        .getNavigation();
    }

    function buildMenuLegacy(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      window.nilavaramNavigation = data;

      data.forEach(function(section) {
        if (section.type === 'link') {
          const directButton = document.createElement('button');
          directButton.type = 'button';
          directButton.className = 'menu-button';
          directButton.textContent = section.label;
          directButton.onclick = function() {
            openModule(section.moduleId, section.label);
          };
          menu.appendChild(directButton);
          return;
        }

        const wrapper = document.createElement('section');
        wrapper.className = 'menu-section';
        const groupButton = document.createElement('button');
        groupButton.type = 'button';
        groupButton.className = 'menu-group-button';
        groupButton.setAttribute('aria-expanded', 'false');

        const label = document.createElement('span');
        label.textContent = section.label;
        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.textContent = '↓';
        arrow.setAttribute('aria-hidden', 'true');
        groupButton.appendChild(label);
        groupButton.appendChild(arrow);

        const submenu = document.createElement('div');
        submenu.className = 'submenu';

        section.buttons.forEach(function(item) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'menu-button';
          button.textContent = item.label;
          button.onclick = function() { openModule(item.moduleId, item.label); };
          submenu.appendChild(button);
        });

        if (section.buttons.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'submenu-empty';
          empty.textContent = 'Modules will be added next.';
          submenu.appendChild(empty);
        }

        groupButton.onclick = function() {
          const isOpen = submenu.classList.toggle('is-open');
          groupButton.setAttribute('aria-expanded', String(isOpen));
          arrow.textContent = isOpen ? '↑' : '↓';
        };

        wrapper.appendChild(groupButton);
        wrapper.appendChild(submenu);
        menu.appendChild(wrapper);
      });
    }

    function buildMenu(data) {
      const menu = document.getElementById('menu');
      menu.textContent = '';
      window.nilavaramNavigation = data;
      data.forEach(function(section) {
        menu.appendChild(createNavigationNode(section, 1));
      });
    }

    function sentenceStyleMenuLabel(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      let result = text.charAt(0).toUpperCase() +
        text.slice(1).toLowerCase();
      [
        ['csv', 'CSV'],
        ['pdf', 'PDF'],
        ['faq', 'FAQ'],
        ['nilavaram', 'Nilavaram'],
        ['firestore', 'Firestore'],
        ['github', 'GitHub']
      ].forEach(function(item) {
        result = result.replace(
          new RegExp('\\b' + item[0] + '\\b', 'gi'),
          item[1]
        );
      });
      return result;
    }

    function createNavigationNode(node, level) {
      const children = node.children || [];
      if (node.type === 'link' && (!node.children || !node.children.length)) {
        const directButton = document.createElement('button');
        directButton.type = 'button';
        directButton.className = 'menu-button menu-level-' + level;
        directButton.textContent = level >= 3
          ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
          : (level === 2
            ? sentenceStyleMenuLabel(node.label)
            : node.label);
        directButton.onclick = function() {
          openModule(node.moduleId, node.label);
        };
        return directButton;
      }

      const wrapper = document.createElement(level === 1 ? 'section' : 'div');
      wrapper.className = 'menu-section';
      const heading = document.createElement('div');
      heading.className = level === 1
        ? 'menu-main-heading'
        : 'menu-subheading';
      heading.textContent = level >= 3
        ? '\u2014 ' + sentenceStyleMenuLabel(node.label)
        : (level === 2
          ? sentenceStyleMenuLabel(node.label)
          : node.label);

      const submenu = document.createElement('div');
      submenu.className = 'menu-open-list';
      children.forEach(function(child) {
        submenu.appendChild(createNavigationNode(child, level + 1));
      });

      if (children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'submenu-empty';
        empty.textContent = 'Modules will be added next.';
        submenu.appendChild(empty);
      }

      wrapper.appendChild(heading);
      wrapper.appendChild(submenu);
      return wrapper;
    }

        showDefaultDashboard();

          '<h2>All Businesses</h2>' +

          '<p><b>Version:</b> ' + escapeHtml(data.version) + '</p>' +
          '<p><b>Status:</b> ' + escapeHtml(data.status) + '</p>';

      if (moduleId === 'pending-features') {
        showPendingFeatures();
        return;
      }
      if (moduleId === 'about-version-history') {
        showCodeChangeHistory();
        return;
      }
      if ([
        'nilavaram-core',
        'project-start',
        'navigation-guide',
        'getting-started',
        'users-access-guide',
        'accounting-guide',
        'accounting-operating-rules',

        'input-upload-image',

          .withSuccessHandler(function(result) {
            document.getElementById('output').innerHTML =
              '<pre>' + escapeHtml(JSON.stringify(result, null, 2)) + '</pre>';
          })
          .withFailureHandler(showError)
          .testFirestore();

    function renderCodeChangeHistory(data) {
      const output = document.getElementById('output');
      output.innerHTML =
        '<h2>About and Version History</h2>' +
        '<p>This page lists code commits that were successfully pushed to the GitHub <b>main</b> branch. A local-only commit does not appear here.</p>';

      if (!data.commits.length) {
        output.innerHTML += '<p>No pushed commits were found.</p>';
        return;
      }

      const table = document.createElement('table');
      const head = document.createElement('thead');
      head.innerHTML =
        '<tr><th>Date and time</th><th>Change</th><th>Commit</th><th>Author</th></tr>';
      table.appendChild(head);
      const body = document.createElement('tbody');

      data.commits.forEach(function(commit) {
        const row = document.createElement('tr');
        const dateCell = document.createElement('td');
        const pacific = getPacificViewTime(new Date(commit.committedAt));
        dateCell.textContent =
          pacific.date + ' ' + pacific.weekday + ' ' +
          pacific.time + ' Pacific Time';

        const messageCell = document.createElement('td');
        messageCell.textContent = commit.message;

        const commitCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = commit.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = commit.shortSha;
        commitCell.appendChild(link);

        const authorCell = document.createElement('td');
        authorCell.textContent = commit.authorName;

        row.appendChild(dateCell);
        row.appendChild(messageCell);
        row.appendChild(commitCell);
        row.appendChild(authorCell);
        body.appendChild(row);
      });
      table.appendChild(body);
      output.appendChild(table);
    }

    function appendMarkdownText(element, text) {
      String(text).split(/(\*\*[^*]+\*\*)/).forEach(function(part) {
        if (
          part.indexOf('**') === 0 &&
          part.lastIndexOf('**') === part.length - 2
        ) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          element.appendChild(strong);
        } else {
          element.appendChild(document.createTextNode(part));
        }
      });
    }

    function renderMarkdown(container, markdown) {
      container.textContent = '';
      let list = null;
      let codeBlock = null;

      String(markdown || '').split(/\r?\n/).forEach(function(line) {
        if (line.trim() === '```') {
          if (codeBlock) {
            container.appendChild(codeBlock);
            codeBlock = null;
          } else {
            codeBlock = document.createElement('pre');
            codeBlock.appendChild(document.createElement('code'));
          }
          return;
        }
        if (codeBlock) {
          codeBlock.firstChild.textContent +=
            (codeBlock.firstChild.textContent ? '\n' : '') + line;
          return;
        }

        const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (headingMatch) {
          list = null;
          const heading = document.createElement('h' + headingMatch[1].length);
          appendMarkdownText(heading, headingMatch[2]);
          container.appendChild(heading);
          return;
        }

        const listMatch = line.match(/^\s*-\s+(.+)$/);
        if (listMatch) {
          if (!list) {
            list = document.createElement('ul');
            container.appendChild(list);
          }
          const item = document.createElement('li');
          appendMarkdownText(item, listMatch[1]);
          list.appendChild(item);
          return;
        }

        list = null;
        if (!line.trim()) return;
        const paragraph = document.createElement('p');
        appendMarkdownText(paragraph, line);
        container.appendChild(paragraph);
      });

      if (codeBlock) container.appendChild(codeBlock);
    }

    function formatStoredDate(value) {
      const parts = String(value || '').split('-');
      if (parts.length !== 3) return String(value || '');
      const months = [
        'JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
        'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'
      ];
      return parts[2] + '-' + months[Number(parts[1]) - 1] + '-' + parts[0];
    }

    function suggestAccountDetails() {
      const status = document.getElementById('account-suggestion');
      const button = document.getElementById('account-suggest');
      status.innerHTML = '<b>Preparing a suggestion…</b>';
      button.disabled = true;
      // Yield once so the status is painted before the server request begins.
      window.setTimeout(function() {
        try {
          const input = {
            entityId: document.getElementById('account-entity').value,
            purpose: document.getElementById('account-purpose').value,
            name: document.getElementById('account-name').value,
            lastFour: document.getElementById('account-last-four').value,
            nearCode: document.getElementById('account-near-code').value
          };
          google.script.run
        .withSuccessHandler(function(suggestion) {
          button.disabled = false;
          window.nilavaramAccountSuggestions = suggestion.choices || [suggestion];
          applyAccountSuggestion(0);
          let choiceHtml = '<b>Suggested:</b> ' + escapeHtml(suggestion.explanation);
          if (window.nilavaramAccountSuggestions.length > 1) {
            choiceHtml += '<br><label for="account-suggestion-choice">Choose a suggestion: </label>' +
              '<select id="account-suggestion-choice" onchange="applyAccountSuggestion(this.selectedIndex)">';
            window.nilavaramAccountSuggestions.forEach(function(choice) {
              choiceHtml += '<option>' + escapeHtml(choice.label ||
                (choice.code + ' — ' + choice.name)) + '</option>';
            });
            choiceHtml += '</select>';
          }
          choiceHtml += '<br><b>You remain in control:</b> open “Review accounting details” ' +
            'and replace the suggested code, type or parent before saving.';
          choiceHtml += '<br><button type="button" class="primary-button" ' +
            'id="account-save-suggestion">Use this suggestion and save account</button>';
          document.getElementById('account-suggestion').innerHTML = choiceHtml;
          document.getElementById('account-advanced').open = true;
          document.getElementById('account-save-suggestion').onclick = function() {
            const form = document.getElementById('account-form');
            if (typeof form.requestSubmit === 'function') {
              form.requestSubmit();
            } else {
              saveAccountForm({ preventDefault: function() {} });
            }
          };
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          document.getElementById('account-suggestion').innerHTML =
            '<span class="error">Suggestion failed: ' +
            escapeHtml(error && error.message ? error.message : String(error)) +
            '</span>';
        })
        .suggestChartAccount(input);
        } catch (error) {
          button.disabled = false;
          status.innerHTML = '<span class="error">Suggestion could not start: ' +
            escapeHtml(error && error.message ? error.message : String(error)) +
            '</span>';
        }
      }, 0);
    }

      document.getElementById('account-code').value = suggestion.code;
      document.getElementById('account-name').value = suggestion.name;
      document.getElementById('account-type').value = suggestion.accountType;
      document.getElementById('account-parent').value = suggestion.parentCode;

        document.getElementById('account-message').textContent =

    async function saveManualCashEntry(event, kind) {
      event.preventDefault();
      const file = document.getElementById('cash-proof').files[0];
      if (!file) return;
      const bank = document.getElementById('cash-bank').value;
      const counter = document.getElementById('cash-counter').value;
      const receipt = kind === 'receipt';
      const message = document.getElementById('cash-message');
      message.textContent = ' Calculating proof identity...';
      try {
        const hash = await sha256File(file);
        const input = {
          entryPurpose: 'manual',
          entityId: document.getElementById('cash-entity').value,
          date: document.getElementById('cash-date').value,
          description: document.getElementById('cash-description').value,
          amount: document.getElementById('cash-amount').value,
          debitAccountCode: receipt ? bank : counter,
          creditAccountCode: receipt ? counter : bank,
          evidenceName: file.name,
          fileHash: hash,
          storageReference: document.getElementById('cash-storage').value,
          auditNote: document.getElementById('cash-note').value
        };
        message.textContent = ' Saving...';
        google.script.run.withSuccessHandler(function(result) {
          message.innerHTML = '<span class="success">' + escapeHtml(result.message) + '</span>';
        }).withFailureHandler(function(error) {
          message.innerHTML = '<span class="error">' + escapeHtml(error.message) + '</span>';
        }).saveEvidenceBackedJournalEntry(input);
      } catch (error) {
        message.innerHTML = '<span class="error">' + escapeHtml(error.message) + '</span>';
      }
    }

    function updateJournalTotals() {
      let debit = 0;
      let credit = 0;
      document.querySelectorAll('.journal-row').forEach(function(row) {
        debit += Number(row.querySelector('.journal-debit').value || 0);
        credit += Number(row.querySelector('.journal-credit').value || 0);
      });
      const difference = debit - credit;
      document.getElementById('journal-totals').textContent =
        'Debit $' + debit.toFixed(2) + ' | Credit $' + credit.toFixed(2) +
        ' | Difference $' + difference.toFixed(2);
      document.getElementById('journal-save').disabled = !(debit > 0 && Math.abs(difference) < .005);
    }

    function whenReviewWindowReady_(requiredIds, callback, attempt) {
      const review = reviewDocument_();
      const ready = review && requiredIds.every(function(id) {
        return !!review.getElementById(id);
      });
      if (ready) {
        callback(review);
        return;
      }
      const nextAttempt = Number(attempt || 0) + 1;
      if (nextAttempt > 40) {
        if (review && review.body) {
          review.body.insertAdjacentHTML('afterbegin',
            '<p class="error">The review window could not finish loading. Close it and try again.</p>');

          '<div class="download-cell"><small>Transaction ID</small>' + escapeHtml(record.sourceRecordNumber) + '</div>' +

          '<div class="download-cell"><small>Transaction to classify</small>' + escapeHtml(record.transactionDate) +

          '<div class="download-cell"><small>Direction</small>' + escapeHtml(record.direction || 'Review') +
            '<br><small>Amount</small>' + formatCentsInput_(record.amountCents || 0) + '</div>' +

            escapeHtml(suggestion.reason || 'No matching rule') + '</div>' +
          '<div class="download-cell"><small>ACODE / rule</small>' + acodeAction + '</div></div>';
      }
      const sandboxReconciliation = mode === 'reconciliation' &&
        window.nilavaramActiveInputGroup &&
        window.nilavaramActiveInputGroup.environment === 'sandbox' &&
        runningCents !== null;
      const calculatedExternalCents = record.externalBalanceCents == null &&
        sandboxReconciliation ? runningCents : record.externalBalanceCents;
      const rowDifferenceCents = runningCents == null ||
        calculatedExternalCents == null
        ? null : calculatedExternalCents - runningCents;
      const statusClass = rowDifferenceCents === 0 ? 'green' :
        calculatedExternalCents == null ? 'yellow' : 'red';
      let action = '<span class="status-' + statusClass + '">' +
        (statusClass === 'green' ? 'Match' : statusClass === 'yellow' ? 'Review' : 'Fix') + '</span>';
      action = (rowDifferenceCents === null

        '<span class="status-' + statusClass + '">' +
        (statusClass === 'green' ? 'Matching' :
          statusClass === 'yellow' ? 'Review' : 'Fix') + '</span>';
      return '<div class="download-row ' + statusClass + '" data-index="' + index + '">' +

        '<div class="download-cell"><small>Raw transaction</small>' + escapeHtml(record.transactionDate) +

    function updateReconciliationPopup() {
      const group = window.nilavaramActiveInputGroup;
      const review = reviewDocument_();
      if (!review) return;
      const openingText = review.getElementById('batch-opening').value;
      const endingText = review.getElementById('batch-ending').value;
      const opening = openingText === '' ? null : Math.round(Number(openingText) * 100);
      const ending = endingText === '' ? null : Math.round(Number(endingText) * 100);
      let running = opening;
      if (opening !== null && isFinite(opening)) {
        review.getElementById('recon-rows').innerHTML = group.records.map(function(record, index) {
          running += Number(record.receiptCents || 0) - Number(record.paymentCents || 0);
          return renderDownloadedRow_(record, running, 'reconciliation', index);
        }).join('');
      }
      const sandbox = group.environment === 'sandbox';
      if (sandbox && running !== null && isFinite(running)) {
        review.getElementById('batch-ending').value = (running / 100).toFixed(2);
      }
      const effectiveEnding = sandbox ? running : ending;
      const difference = opening === null || effectiveEnding === null ? null : effectiveEnding - running;
      const summary = review.getElementById('recon-batch-summary');
      summary.className = difference === 0 ? 'status-green' : 'status-red';
      summary.textContent = difference === null
        ? 'Enter both balances to calculate the system balance and difference.'
        : 'System ending ' + formatCentsInput_(running) + ' | External ending ' +
          formatCentsInput_(effectiveEnding) + ' | Difference ' + formatCentsInput_(difference);
      review.getElementById('recon-save').disabled = !(difference === 0 &&
        review.getElementById('recon-confirm-all').checked);
    }

    function captureAcodeDrafts_() {
      const review = reviewDocument_();
      if (!review) return;
      currentAcodeRecords_().forEach(function(record) {
        const select = review.querySelector('.batch-acode[data-id="' + record.id + '"]');
        const rule = review.querySelector('.batch-rule[data-id="' + record.id + '"]');
        const operator = review.querySelector('.batch-rule-operator[data-id="' + record.id + '"]');
        const ruleText = review.querySelector('.batch-rule-text[data-id="' + record.id + '"]');
        window.nilavaramAcodeDrafts[record.id] = {
          counterAccountCode: select ? select.value : '',
          createRule: !!(rule && rule.checked),
          operator: operator ? operator.value : 'contains',
          ruleText: ruleText ? ruleText.value : record.description
        };
      });
    }

    function applyAcodeDrafts_() {
      const review = reviewDocument_();
      if (!review) return;
      currentAcodeRecords_().forEach(function(record) {
        const draft = window.nilavaramAcodeDrafts[record.id];
        if (!draft) return;
        const select = review.querySelector('.batch-acode[data-id="' + record.id + '"]');
        const rule = review.querySelector('.batch-rule[data-id="' + record.id + '"]');
        const operator = review.querySelector('.batch-rule-operator[data-id="' + record.id + '"]');
        const ruleText = review.querySelector('.batch-rule-text[data-id="' + record.id + '"]');
        if (select) select.value = draft.counterAccountCode;
        if (rule) rule.checked = draft.createRule;
        if (operator) operator.value = draft.operator;
        if (ruleText) ruleText.value = draft.ruleText;
      });
    }

    function saveAcodePopup(completeSet) {
      captureAcodeDrafts_();

      if (!review) return;
      const assignments = currentAcodeRecords_().map(function(record) {
        const draft = window.nilavaramAcodeDrafts[record.id] || {};
        return {sourceRecordId: record.id,
          counterAccountCode: draft.counterAccountCode || '',
          createRule: !!draft.createRule,
          ruleText: draft.ruleText || record.description,
          ruleName: 'Rule — ' + (draft.ruleText || record.description),
          operator: draft.operator || 'contains',
          priority: 50};
      }).filter(function(assignment) {
        return completeSet || !!assignment.counterAccountCode;

      if (completeSet && assignments.some(function(item) { return !item.counterAccountCode; })) {
        review.getElementById('acode-message').innerHTML = '<span class="error">Choose an ACODE for every displayed transaction before completing the set.</span>';
        return;

    async function sha256File(file) {
      const buffer = await file.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest))
        .map(function(value) { return value.toString(16).padStart(2, '0'); })
        .join('');
    }

    async function saveSourceInputForm(event) {
      event.preventDefault();
      const file = document.getElementById('source-file').files[0];
      if (!file) return;
      const message = document.getElementById('source-input-message');
      message.textContent = ' Calculating file identity...';
      try {
        const hash = await sha256File(file);
        document.getElementById('source-hash-message').textContent =
          'SHA-256: ' + hash;
        const input = {
          sourceType: document.getElementById('source-type').value,
          date: document.getElementById('source-date').value,

    function editTransactionRule(id) {
      const rule = (window.nilavaramWorkbench.rules || []).find(function(item) {
        return item.id === id;
      });
      if (!rule) return;
      if (!rule.taxYear) {
        alert('This is an older unscoped rule. Create a new tax-year rule instead; it will not auto-apply.');
        return;
      }
      document.getElementById('edit-rule-id').value = rule.id;
      document.getElementById('new-rule-name').value = rule.name || '';
      document.getElementById('new-rule-direction').value = rule.direction || 'money-out';
      document.getElementById('new-rule-operator').value = rule.matchOperator || 'contains';
      document.getElementById('new-rule-text').value = Array.isArray(rule.matchText)
        ? (rule.matchText[0] || '') : (rule.matchText || '');
      document.getElementById('new-rule-tax-year').value = rule.taxYear;
      document.getElementById('new-rule-tax-year').readOnly = true;
      document.getElementById('new-rule-direction').disabled = true;
      document.getElementById('new-rule-counter').value = rule.counterAccountCode || '';
      document.getElementById('new-rule-priority').value = rule.priority || 50;

      document.getElementById('transaction-message').textContent =
        ' Retrying posting...';
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('transaction-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          document.getElementById('transaction-form').reset();
          window.nilavaramPostingRetryId = '';
        })
        .withFailureHandler(function(error) {
          document.getElementById('transaction-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>' +
            ' <button class="secondary-button" type="button" ' +
            'onclick="retryPosting()">Retry posting saved draft</button>';
        })
        .postTransaction(transactionId);
    }

    function saveUserForm(event) {
      event.preventDefault();
      const modules = document.getElementById('allowedModules').value
        .split(',')
        .map(function(value) { return value.trim(); })
        .filter(Boolean);
      const input = {
        email: document.getElementById('email').value,
        displayName: document.getElementById('displayName').value,
        role: document.getElementById('role').value,
        allowedModules: modules
      };
      document.getElementById('user-message').textContent = ' Saving...';

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('user-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          document.getElementById('user-form').reset();
          loadUsers();
        })
        .withFailureHandler(function(error) {
          document.getElementById('user-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .saveUser(input);
    }

    function loadUsers() {
      google.script.run
        .withSuccessHandler(function(users) {
          window.nilavaramUsers = users;
          let html = '<table><thead><tr><th>Email</th><th>Name</th>' +
            '<th>Role</th><th>Status</th><th>Ltd modules</th><th></th></tr></thead><tbody>';
          users.forEach(function(user, index) {
            html += '<tr><td>' + escapeHtml(user.email) + '</td>' +
              '<td>' + escapeHtml(user.displayName) + '</td>' +
              '<td>' + escapeHtml(user.role) + '</td>' +
              '<td>' + escapeHtml(user.status) + '</td>' +
              '<td>' + escapeHtml((user.allowedModules || []).join(', ')) + '</td>' +
              '<td><button type="button" onclick="editUser(' + index + ')">Edit</button></td></tr>';
          });
          html += '</tbody></table>';
          document.getElementById('users-list').innerHTML = html;
        })
        .withFailureHandler(showError)
        .getUsers();
    }

    function editUser(index) {
      const user = (window.nilavaramUsers || [])[index];
      if (!user) return;
      document.getElementById('email').value = user.email || '';
      document.getElementById('displayName').value = user.displayName || '';
      document.getElementById('role').value = user.role || 'reader';
      document.getElementById('allowedModules').value =
        (user.allowedModules || []).join(', ');
      document.getElementById('email').focus();
    }
  </script>
</body>
</html>
