<script>
  const NILAVARAM_MENU_STATUS = {
    live: ['🟢', 'Live — opens module window'],
    partial: ['🟡', 'Partly working'],
    help: ['📖', 'Help guide — read only'],
    planned: ['⚪', 'Planned — to be wired'],
    improve: ['🔧', 'Live — UX to be improved']
  };

  function menuStatus(status) {
    return NILAVARAM_MENU_STATUS[status] ||
      NILAVARAM_MENU_STATUS.planned;
  }

  function visibleNavigationForMenu(navigation) {
    return (navigation || []).filter(function(section) {
      return section.id !== 'dashboard' &&
        section.moduleId !== 'dashboard';
    });
  }

  function countVisibleMenuItems(navigation) {
    return collectMenuLeaves(
      visibleNavigationForMenu(navigation),
      [],
      []
    ).length;
  }

  function menuStorageKey(id) {
    return 'nilavaramMenuExpanded_' + id;
  }

  function isMenuExpanded(id, depth) {
    try {
      const saved = sessionStorage.getItem(menuStorageKey(id));
      if (saved === '0') return false;
      if (saved === '1') return true;
    } catch (error) {
      // The default expansion state remains usable.
    }
    return depth === 0;
  }

  function saveMenuExpanded(id, expanded) {
    try {
      sessionStorage.setItem(menuStorageKey(id), expanded ? '1' : '0');
    } catch (error) {
      // The menu still works for the current page session.
    }
  }

  function menuLeafMatches(node, query, path) {
    const text = [
      node.label,
      node.description,
      node.moduleId,
      path.join(' ')
    ].join(' ').toLowerCase();

    return !query || text.indexOf(query) !== -1;
  }

  function menuHasMatch(node, query, path) {
    const nextPath = path.concat(node.label || '');

    if (node.moduleId && menuLeafMatches(node, query, nextPath)) {
      return true;
    }

    return (node.children || []).some(function(child) {
      return menuHasMatch(child, query, nextPath);
    });
  }

  function collectMenuLeaves(nodes, path, result) {
    (nodes || []).forEach(function(node) {
      const nextPath = path.concat(node.label || '');

      if (node.moduleId) {
        result.push({
          id: node.id,
          label: node.label,
          description: node.description || '',
          moduleId: node.moduleId,
          wiringStatus: node.wiringStatus || 'planned',
          breadcrumb: nextPath.join(' > ')
        });
      }

      collectMenuLeaves(node.children, nextPath, result);
    });

    return result;
  }

  function openMenuItem(item) {
    if (!isShellContextComplete()) {
      showWorkspaceNotice(
        'Select client and business before opening a menu item.'
      );
      return;
    }

    openModule(item.moduleId, item.label, true);
  }

  function createMenuLeaf(item, depth) {
    const button = document.createElement('button');
    const status = menuStatus(item.wiringStatus);

    button.type = 'button';
    button.className = 'menu-leaf';
    button.style.paddingLeft = (12 + depth * 14) + 'px';
    button.title = status[1] + ' — ' + item.label;
    button.setAttribute('aria-label', item.label);

    const label = document.createElement('span');
    label.className = 'menu-leaf-label';
    label.textContent = item.label;

    const marker = document.createElement('span');
    marker.className = 'menu-leaf-status';
    marker.setAttribute('aria-hidden', 'true');
    marker.textContent = status[0];

    button.appendChild(label);
    button.appendChild(marker);
    button.onclick = function() {
      openMenuItem(item);
    };

    return button;
  }

  function createMenuGroup(node, depth, query, rootLabel) {
    const groupId = node.id || node.label;
    const expanded = query
      ? true
      : isMenuExpanded(groupId, depth);

    const section = document.createElement('section');
    section.className = 'menu-group';
    section.dataset.groupId = groupId;

    const header = document.createElement('div');
    header.className = 'menu-group-header';

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'menu-group-toggle';
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    toggle.setAttribute(
      'aria-label',
      (expanded ? 'Collapse ' : 'Expand ') + node.label
    );
    toggle.textContent = expanded ? '▼' : '▶';

    const titleWrap = document.createElement('div');
    titleWrap.className = 'menu-group-title-wrap';

    const title = document.createElement('div');
    title.className = 'menu-group-title';
    title.textContent = node.label;
    titleWrap.appendChild(title);

    if (node.description) {
      const description = document.createElement('p');
      description.className = depth === 0
        ? 'menu-group-desc'
        : 'menu-subgroup-desc';
      description.textContent = node.description;
      titleWrap.appendChild(description);
    }

    header.appendChild(toggle);
    header.appendChild(titleWrap);
    section.appendChild(header);

    const body = document.createElement('div');
    body.className = 'menu-group-body';
    body.hidden = !expanded;

    toggle.onclick = function(event) {
      event.stopPropagation();
      const nextState = !isMenuExpanded(groupId, depth);
      saveMenuExpanded(groupId, nextState);
      renderMenuPickerPanel(
        window.nilavaramNavigation || [],
        document.getElementById('menu-search').value
      );
    };

    if (node.moduleId &&
        menuLeafMatches(node, query, [rootLabel, node.label])) {
      body.appendChild(createMenuLeaf(node, depth));
    }

    (node.children || []).forEach(function(child) {
      const childPath = [rootLabel, node.label, child.label];

      if (!menuHasMatch(child, query, childPath)) {
        return;
      }

      if (child.moduleId &&
          !(child.children || []).length) {
        body.appendChild(createMenuLeaf(child, depth + 1));
      } else {
        body.appendChild(
          createMenuGroup(child, depth + 1, query, rootLabel)
        );
      }
    });

    if (body.childNodes.length) {
      section.appendChild(body);
    }

    return section;
  }

  function createSearchResult(item) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'menu-search-result';
    button.title = menuStatus(item.wiringStatus)[1];

    const label = document.createElement('span');
    label.className = 'menu-search-result-label';
    label.textContent =
      item.label + ' ' + menuStatus(item.wiringStatus)[0];

    const path = document.createElement('span');
    path.className = 'menu-search-result-path';
    path.textContent = item.breadcrumb;

    button.appendChild(label);
    button.appendChild(path);
    button.onclick = function() {
      openMenuItem(item);
    };

    return button;
  }

  function renderMenuStatusSummary(summary, leaves, prefix) {
    summary.textContent = '';

    const total = document.createElement('span');
    total.textContent = prefix + leaves.length +
      ' menu items (groups excluded)';
    summary.appendChild(total);

    const counts = {};
    leaves.forEach(function(item) {
      const status = NILAVARAM_MENU_STATUS[item.wiringStatus]
        ? item.wiringStatus
        : 'planned';
      counts[status] = (counts[status] || 0) + 1;
    });

    Object.keys(NILAVARAM_MENU_STATUS).forEach(function(status) {
      const count = counts[status] || 0;
      const statusText = document.createElement('span');
      statusText.className = 'menu-status-count';
      statusText.title = NILAVARAM_MENU_STATUS[status][1];
      statusText.textContent = ' ' + NILAVARAM_MENU_STATUS[status][0] +
        ' ' + count;
      summary.appendChild(statusText);
    });
  }

  function renderMenuPickerPanel(navigation, searchText) {
    const browse = document.getElementById('menu-browse-panel');
    const results = document.getElementById('menu-search-results');
    const summary = document.getElementById('menu-status-summary');
    const query = String(searchText || '').trim().toLowerCase();

    const leaves = collectMenuLeaves(navigation, [], []);
    const matches = query
      ? leaves.filter(function(item) {
          return menuLeafMatches(item, query, [item.breadcrumb]);
        })
      : [];

    browse.textContent = '';
    results.textContent = '';

    if (query) {
      browse.hidden = true;
      results.hidden = false;
      summary.textContent =
        matches.length + ' of ' + leaves.length + ' menu items match';

      const heading = document.createElement('h4');
      heading.className = 'menu-search-heading';
      heading.textContent = 'Search results';
      results.appendChild(heading);

      if (!matches.length) {
        const empty = document.createElement('p');
        empty.className = 'help-meta';
        empty.textContent = 'No menu items match your search.';
        results.appendChild(empty);
        return;
      }

      matches.forEach(function(item) {
        results.appendChild(createSearchResult(item));
      });
      return;
    }
    results.hidden = true;
    browse.hidden = false;
    browse.hidden = false;
    renderMenuStatusSummary(summary, leaves, '');

    navigation.forEach(function(section) {
      if (menuHasMatch(section, '', [section.label])) {
        browse.appendChild(
          createMenuGroup(section, 0, '', section.label)
        );
      }
    });
  }

  function onMenuSearchInput(event) {
    renderMenuPickerPanel(
      window.nilavaramNavigation || [],
      event.target.value
    );
  }

  function clearMenuSearch() {
    const input = document.getElementById('menu-search');
    if (input) input.value = '';
    renderMenuPickerPanel(window.nilavaramNavigation || [], '');
  }

  function applyNavigationToMenu(navigation) {
    const visibleNavigation = visibleNavigationForMenu(navigation);

    window.nilavaramNavigation = visibleNavigation;
    window.nilavaramVisibleMenuCount =
      countVisibleMenuItems(visibleNavigation);
    renderMenuPickerPanel(visibleNavigation, '');
    updateMenuSelectorState(true);
  }

  function bindMenuPickerEvents() {
    const search = document.getElementById('menu-search');

    if (search && !search.dataset.bound) {
      search.dataset.bound = '1';
      search.addEventListener('input', onMenuSearchInput);
    }

    const changeButton =
      document.getElementById('context-change-button');

    if (changeButton && !changeButton.dataset.bound) {
      changeButton.dataset.bound = '1';
      changeButton.onclick = openContextChangePopup;
    }
  }
</script>
