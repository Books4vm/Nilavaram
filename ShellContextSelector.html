<script>
  window.nilavaramShellClients = window.nilavaramShellClients || [];
  window.nilavaramContextStep = window.nilavaramContextStep || 'client';

  function saveSelectedClient(clientId, clientName) {
    window.nilavaramSelectedClient = { id: clientId, name: clientName };
    try {
      sessionStorage.setItem('nilavaramSelectedClientId', clientId);
      sessionStorage.setItem('nilavaramSelectedClientName', clientName);
    } catch (error) {}
  }

  function saveSelectedBusiness(entityId, entityName) {
    window.nilavaramSelectedEntity = { id: entityId, name: entityName };
    try {
      sessionStorage.setItem('nilavaramSelectedEntityId', entityId);
      sessionStorage.setItem('nilavaramSelectedEntityName', entityName);
    } catch (error) {}
  }

  function saveSelectedAccountingYear(accountingYear) {
    window.nilavaramSelectedAccountingYear =
      String(accountingYear || '2026');
    try {
      sessionStorage.setItem(
        'nilavaramSelectedAccountingYear',
        window.nilavaramSelectedAccountingYear
      );
    } catch (error) {}
  }

  function isShellContextComplete() {
    return Boolean(
      window.nilavaramSelectedClient && window.nilavaramSelectedClient.id &&
      window.nilavaramSelectedEntity && window.nilavaramSelectedEntity.id
    );
  }

  function getShellContextHeaderText() {
    if (!isShellContextComplete()) {
      return 'Select client and business';
    }
    return window.nilavaramSelectedClient.name + '  ·  ' +
      window.nilavaramSelectedEntity.name;
  }

  function syncContextHeader() {
    if (typeof renderStartupLine === 'function') {
      renderStartupLine();
    }
    if (typeof updateWorkspaceSelectionDisplay === 'function') {
      updateWorkspaceSelectionDisplay();
    }
    const meta = document.getElementById('module-meta');
    if (meta && isShellContextComplete()) {
      meta.innerHTML =
        '<span><b>Client:</b> ' + escapeHtml(window.nilavaramSelectedClient.name) +
        '</span> &nbsp; <span><b>Business:</b> ' +
        escapeHtml(window.nilavaramSelectedEntity.name) + '</span>';
    }
  }

  function updateMainWorkspaceContextSession() {
    const session = window.nilavaramModuleSessions &&
      window.nilavaramModuleSessions['main-workspace'];
    if (!session || !isShellContextComplete()) return;
    session.entityId = window.nilavaramSelectedEntity.id;
    session.entityName = window.nilavaramSelectedEntity.name;
    if (typeof renderWorkspaceSessions === 'function') {
      renderWorkspaceSessions();
    }
  }

  function setMenuPanelEnabled(enabled) {
    const section = document.getElementById('menu-section');
    if (section) section.hidden = !enabled;
    const loading = document.getElementById('shell-loading-msg');
    if (loading) loading.hidden = enabled;
  }

  function refreshShellContextDisplay_(saveDefault, showContextNotice) {
    window.nilavaramContextStep = 'done';
    syncContextHeader();
    updateMainWorkspaceContextSession();
    setMenuPanelEnabled(true);
    renderWorkspaceContextSteps();
    if (saveDefault) {
      saveCurrentWorkspaceDefault_();
    }
    if (typeof reloadNavigationForCurrentSelection === 'function') {
      reloadNavigationForCurrentSelection();
    }
    if (showContextNotice && typeof showWorkspaceNotice === 'function') {
      showWorkspaceNotice(
        'Context set: ' + window.nilavaramSelectedClient.name + ' / ' +
          window.nilavaramSelectedEntity.name + '. Choose a menu item.'
      );
    }
  }

  function onShellContextComplete() {
    refreshShellContextDisplay_(true, true);
  }

  function startShellContextFlow(clients, defaultContext) {
    window.nilavaramShellClients = clients || [];
    if (defaultContext) {
      saveSelectedClient(defaultContext.clientId, defaultContext.clientName);
      saveSelectedBusiness(defaultContext.entityId, defaultContext.entityName);
      saveSelectedAccountingYear(defaultContext.accountingYear || '2026');
      window.nilavaramContextRestoredFromServer = true;
    } else {
      clearShellContextSelection_();
    }
    if (isShellContextComplete()) {
      onShellContextComplete();
      return;
    }

    function clearShellContextSelection_() {
      window.nilavaramSelectedClient = null;
      window.nilavaramSelectedEntity = null;
      window.nilavaramSelectedAccountingYear = '2026';
      try {
        sessionStorage.removeItem('nilavaramSelectedClientId');
        sessionStorage.removeItem('nilavaramSelectedClientName');
        sessionStorage.removeItem('nilavaramSelectedEntityId');
        sessionStorage.removeItem('nilavaramSelectedEntityName');
        sessionStorage.removeItem('nilavaramSelectedAccountingYear');
      } catch (error) {}
    }
    window.nilavaramContextStep = 'client';
    setMenuPanelEnabled(false);
    renderWorkspaceContextSteps();
    syncContextHeader();
  }

  function restoreShellContextFromSession() {
    let clientId = '';
    let clientName = '';
    let entityId = '';
    let entityName = '';
    let accountingYear = '';
    try {
      clientId = sessionStorage.getItem('nilavaramSelectedClientId') || '';
      clientName = sessionStorage.getItem('nilavaramSelectedClientName') || '';
      entityId = sessionStorage.getItem('nilavaramSelectedEntityId') || '';
      entityName = sessionStorage.getItem('nilavaramSelectedEntityName') || '';
      accountingYear = sessionStorage.getItem('nilavaramSelectedAccountingYear') || '';
    } catch (error) {}

    if (clientId && clientName) {
      saveSelectedClient(clientId, clientName);
    }
    if (entityId && entityName) {
      saveSelectedBusiness(entityId, entityName);
    }
    if (accountingYear) {
      saveSelectedAccountingYear(accountingYear);
    }
  }

  function renderWorkspaceContextSteps() {
    const host = document.getElementById('workspace-context-steps');
    if (!host) return;
    const instructions = document.getElementById(
      'workspace-context-instructions'
    );
    if (instructions) {
      instructions.hidden = isShellContextComplete();
    }

    if (isShellContextComplete()) {
      host.innerHTML =
        '<section class="shell-context-steps shell-context-steps-complete">' +
          '<h3>Working context</h3>' +
          '<p><b>Client:</b> ' + escapeHtml(window.nilavaramSelectedClient.name) + '</p>' +
          '<p><b>Business:</b> ' + escapeHtml(window.nilavaramSelectedEntity.name) + '</p>' +
          '<p><b>Accounting year:</b> ' +
            escapeHtml(window.nilavaramSelectedAccountingYear || '2026') + '</p>' +
          '<label>Default accounting year<input id="workspace-accounting-year" ' +
            'inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="' +
            escapeHtml(window.nilavaramSelectedAccountingYear || '2026') + '"></label>' +
          '<p class="help-meta">Use <b>Change client / business</b> in the left panel to switch context.</p>' +
        '</section>';
      return;
    }

    let html =
      '<section class="shell-context-steps">' +
        '<h3>Before menu items load</h3>' +
        '<p class="help-meta">Complete both steps below. The header will show your client and business when done.</p>';

    html += renderContextClientListHtml('workspace');
    if (window.nilavaramContextStep === 'business' ||
        window.nilavaramSelectedClient) {
      html += renderContextBusinessListHtml('workspace');
    }
    html += '</section>';
    host.innerHTML = html;
    bindContextListHandlers(host);
  }

  function renderContextClientListHtml(mode) {
    const clients = window.nilavaramShellClients || [];
    const selectedId = window.nilavaramSelectedClient &&
      window.nilavaramSelectedClient.id;
    let html =
      '<div class="shell-context-block" data-context-block="client">' +
        '<h4>Step 1 — Select client</h4>' +
        '<ul class="shell-context-list">';
    if (!clients.length) {
      html += '<li class="help-meta">No clients available.</li>';
    }
    clients.forEach(function(client) {
      const active = client.id === selectedId ? ' is-selected' : '';
      html += '<li><button type="button" class="shell-context-item' + active + '" ' +
        'data-context-action="client" data-client-id="' + escapeHtml(client.id) + '" ' +
        'data-client-name="' + escapeHtml(client.name) + '">' +
        escapeHtml(client.name) + '</button></li>';
    });
    html += '</ul></div>';
    return html;
  }

  function renderContextBusinessListHtml(mode) {
    const entities = window.nilavaramShellEntities || [];
    const selectedId = window.nilavaramSelectedEntity &&
      window.nilavaramSelectedEntity.id;
    let html =
      '<div class="shell-context-block" data-context-block="business">' +
        '<h4>Step 2 — Select business</h4>';
    if (!window.nilavaramSelectedClient) {
      html += '<p class="help-meta">Choose a client first.</p></div>';
      return html;
    }
    if (window.nilavaramContextLoadingBusinesses) {
      html += '<p class="help-meta">Loading businesses...</p></div>';
      return html;
    }
    html += '<ul class="shell-context-list">';
    if (!entities.length) {
      html += '<li class="help-meta">No businesses yet for this client.</li>';
    }
    entities.forEach(function(entity) {
      const active = entity.id === selectedId ? ' is-selected' : '';
      html += '<li><button type="button" class="shell-context-item' + active + '" ' +
        'data-context-action="business" data-entity-id="' + escapeHtml(entity.id) + '" ' +
        'data-entity-name="' + escapeHtml(entity.name) + '">' +
        escapeHtml(entity.name) + '</button></li>';
    });
    html += '</ul></div>';
    return html;
  }

  function bindContextListHandlers(root) {
    if (!root) return;
    root.querySelectorAll('[data-context-action="client"]').forEach(function(button) {
      button.onclick = function() {
        selectShellClient(
          button.getAttribute('data-client-id'),
          button.getAttribute('data-client-name')
        );
      };
    });
    root.querySelectorAll('[data-context-action="business"]').forEach(function(button) {
      button.onclick = function() {
        selectShellBusiness(
          button.getAttribute('data-entity-id'),
          button.getAttribute('data-entity-name')
        );
      };
    });
  }

  function selectShellClient(clientId, clientName) {
    if (!clientId) return;
    saveSelectedClient(clientId, clientName);
    window.nilavaramContextStep = 'business';
    window.nilavaramSelectedEntity = null;
    try {
      sessionStorage.removeItem('nilavaramSelectedEntityId');
      sessionStorage.removeItem('nilavaramSelectedEntityName');
    } catch (error) {}
    syncContextHeader();
    window.nilavaramContextLoadingBusinesses = true;
    if (document.getElementById('popup-context-host')) {
      renderContextChangePopup();
    } else {
      renderWorkspaceContextSteps();
    }
    if (typeof showWorkspaceProgress === 'function') {
      showWorkspaceProgress('Step 2: Loading businesses for ' + clientName + '…', 30);
    }
    google.script.run
      .withSuccessHandler(function(entities) {
        window.nilavaramContextLoadingBusinesses = false;
        window.nilavaramShellEntities = entities || [];
        if (typeof hideWorkspaceProgress === 'function') hideWorkspaceProgress();
        if (document.getElementById('popup-context-host')) {
          renderContextChangePopup();
        } else {
          renderWorkspaceContextSteps();
        }
        if (typeof showWorkspaceNotice === 'function') {
          showWorkspaceNotice(
            'Client: ' + clientName + '. Now choose a business (Step 2).'
          );
        }
      })
      .withFailureHandler(function(error) {
        window.nilavaramContextLoadingBusinesses = false;
        if (document.getElementById('popup-context-host')) {
          renderContextChangePopup();
        } else {
          renderWorkspaceContextSteps();
        }
        if (typeof showWorkspaceError === 'function') {
          showWorkspaceError(
            'Could not load businesses.',
            error && error.message ? error.message : String(error)
          );
        }
      })
      .getBusinessEntitiesForClient(clientId, nilavaramSessionKey());
  }

  function selectShellBusiness(entityId, entityName) {
    if (!entityId) return;
    saveSelectedBusiness(entityId, entityName);
    syncContextHeader();
    if (document.getElementById('popup-context-host')) {
      renderContextChangePopup();
      return;
    }
    onShellContextComplete();
  }

  function saveCurrentWorkspaceDefault_() {
    if (!isShellContextComplete()) return;
    google.script.run
      .withSuccessHandler(function(context) {
        if (context && context.accountingYear) {
          saveSelectedAccountingYear(context.accountingYear);
        }
      })
      .withFailureHandler(function(error) {
        if (typeof showWorkspaceNotice === 'function') {
          showWorkspaceNotice(
            'Context selected, but the default could not be saved: ' +
            (error && error.message ? error.message : String(error))
          );
        }
      })
      .saveUserDefaultWorkspaceContext(
        window.nilavaramSelectedClient.id,
        window.nilavaramSelectedEntity.id,
        window.nilavaramSelectedAccountingYear || '',
        nilavaramSessionKey()
      );
  }

  function refreshSavedShellContext_() {
    google.script.run
      .withSuccessHandler(function(shell) {
        const context = shell && shell.defaultContext;
        if (!context) {
          if (typeof showWorkspaceError === 'function') {
            showWorkspaceError(
              'Saved context could not be refreshed.',
              'No saved client and business context was returned.'
            );
          }
          return;
        }
        window.nilavaramShellClients = shell.clients || [];
        saveSelectedClient(context.clientId, context.clientName);
        saveSelectedBusiness(context.entityId, context.entityName);
        const accountingYear = String(context.accountingYear || '').trim();
        if (/^\d{4}$/.test(accountingYear)) {
          saveSelectedAccountingYear(accountingYear);
        } else if (typeof showWorkspaceNotice === 'function') {
          showWorkspaceNotice(
            'Saved context did not include a valid accounting year; ' +
            'the currently displayed year was left unchanged.'
          );
        }
        refreshShellContextDisplay_(false, false);
      })
      .withFailureHandler(function(error) {
        if (typeof showWorkspaceError === 'function') {
          showWorkspaceError(
            'Saved context could not be refreshed.',
            error && error.message ? error.message : String(error)
          );
        }
      })
      .getDashboardShell(nilavaramSessionKey());
  }

  function stopContextPopupMonitor_() {
    const monitor = window.nilavaramContextPopupMonitor;
    if (monitor && monitor.timer) {
      window.clearInterval(monitor.timer);
    }
    window.nilavaramContextPopupMonitor = null;
  }

  function monitorContextPopup_(popup) {
    const activeMonitor = window.nilavaramContextPopupMonitor;
    if (activeMonitor && activeMonitor.timer) return;
    const monitor = { popup: popup, timer: null };
    monitor.timer = window.setInterval(function() {
      if (!popup.closed) return;
      window.clearInterval(monitor.timer);
      if (window.nilavaramContextPopupMonitor === monitor) {
        window.nilavaramContextPopupMonitor = null;
      }
      refreshSavedShellContext_();
    }, 500);
    window.nilavaramContextPopupMonitor = monitor;
  }

  function openContextChangePopup() {
    if (window.nilavaramContextPopupMonitor) {
      if (typeof showWorkspaceNotice === 'function') {
        showWorkspaceNotice(
          'Close the existing Change client / business popup before opening another.'
        );
      }
      return;
    }

    // Open popup synchronously to avoid popup blockers
    const popup = window.open(
      'about:blank',
      'NilavaramContext',
      'popup=yes,width=520,height=720,resizable=yes,scrollbars=yes'
    );

    if (!popup || popup.closed) {
      if (typeof showWorkspaceNotice === 'function') {
        showWorkspaceNotice('Allow pop-ups to change client and business.');
      }
      return;
    }
    monitorContextPopup_(popup);

    // Fetch the actual URL and navigate the popup
    google.script.run
      .withSuccessHandler(function(webAppUrl) {
        const baseUrl = String(webAppUrl || '').split('?')[0];
        const targetUrl = baseUrl + '?contextWindow=1';

        // Navigate the opened popup to the target URL
        if (popup && !popup.closed) {
          try {
            popup.location.href = targetUrl;
          } catch (error) {
            if (typeof showWorkspaceNotice === 'function') {
              showWorkspaceNotice(
                'Could not navigate popup: ' +
                (error && error.message ? error.message : String(error))
              );
            }
          }
        }
      })
      .withFailureHandler(function(error) {
        if (typeof showWorkspaceNotice === 'function') {
          showWorkspaceNotice(
            'Unable to retrieve context URL: ' +
            (error && error.message ? error.message : String(error))
          );
        }
        // Close the blank popup if URL retrieval failed
        if (popup && !popup.closed) {
          popup.close();
        }
      })
      .getNilavaramWebAppUrl();
  }

  function renderContextChangePopup() {
    const output = document.getElementById('output');
    if (!output) return;
    output.innerHTML =
      '<h2>Change client / business</h2>' +
      '<p class="help-meta">Choose a client, then a business. The main workspace header and menu will update.</p>' +
      '<p class="help-meta">The selected client and business become your default for the next login. You can change them here at any time.</p>' +
      '<div id="popup-context-host"></div>' +
      '<div class="shell-context-popup-actions">' +
        '<button type="button" class="primary-button" id="context-popup-apply">Apply</button>' +
        '<button type="button" class="secondary-button" id="context-popup-cancel">Cancel</button>' +
      '</div>';
    const host = document.getElementById('popup-context-host');
    host.innerHTML = renderContextClientListHtml('popup');
    if (window.nilavaramSelectedClient) {
      host.innerHTML += renderContextBusinessListHtml('popup');
    }
    host.innerHTML +=
      '<label>Default accounting year<input id="context-popup-accounting-year" ' +
      'inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="' +
      escapeHtml(window.nilavaramSelectedAccountingYear || '') + '"></label>';
    host.insertAdjacentHTML('beforeend',
      '<p id="context-popup-save-status" class="help-meta" role="status" ' +
      'aria-live="polite"></p>');
    bindContextListHandlers(host);
    document.getElementById('context-popup-cancel').onclick = function() {
      window.top.close();
    };
    document.getElementById('context-popup-apply').onclick = function() {
      if (window.nilavaramContextApplyPending) return;
      if (!isShellContextComplete()) {
        output.insertAdjacentHTML('beforeend',
          '<p class="error">Select both a client and a business before Apply.</p>');
        return;
      }
      const yearInput = document.getElementById('context-popup-accounting-year');
      const accountingYear = yearInput ? yearInput.value.trim() : '';
      if (accountingYear && !/^\d{4}$/.test(accountingYear)) {
        output.insertAdjacentHTML('beforeend',
          '<p class="error">Enter the accounting year as four digits.</p>');
        return;
      }
      const applyButton = document.getElementById('context-popup-apply');
      const status = document.getElementById('context-popup-save-status');
      window.nilavaramContextApplyPending = true;
      applyButton.disabled = true;
      applyButton.textContent = 'Applying...';
      if (status) status.textContent = 'Saving selected context...';
      google.script.run
        .withSuccessHandler(function(context) {
          const savedYear = String(
            context && context.accountingYear || ''
          ).trim();
          if (!context ||
              context.clientId !== window.nilavaramSelectedClient.id ||
              context.entityId !== window.nilavaramSelectedEntity.id ||
              !/^\d{4}$/.test(savedYear)) {
            if (status) {
              status.className = 'error';
              status.textContent =
                'The save response could not confirm the selected context and ' +
                'accounting year. The popup will remain open; do not retry Apply.';
            }
            return;
          }
          saveSelectedAccountingYear(savedYear);
          window.top.close();
        })
        .withFailureHandler(function(error) {
          window.nilavaramContextApplyPending = false;
          applyButton.disabled = false;
          applyButton.textContent = 'Apply';
          if (status) {
            status.className = 'error';
            status.textContent =
              'Context was not saved: ' +
              (error && error.message ? error.message : String(error));
          }
        })
        .saveUserDefaultWorkspaceContext(
          window.nilavaramSelectedClient.id,
          window.nilavaramSelectedEntity.id,
          accountingYear,
          nilavaramSessionKey()
        );
    };
  }

  function initContextPopupFromShell() {
    google.script.run
      .withSuccessHandler(function(shell) {
        window.nilavaramShellClients = shell.clients || [];
        restoreShellContextFromSession();
        if (window.nilavaramSelectedClient) {
          google.script.run
            .withSuccessHandler(function(entities) {
              window.nilavaramShellEntities = entities || [];
              renderContextChangePopup();
            })
            .getBusinessEntitiesForClient(
              window.nilavaramSelectedClient.id,
              nilavaramSessionKey()
            );
        } else {
          renderContextChangePopup();
        }
      })
      .withFailureHandler(function(error) {
        if (redirectToSignInIfSessionExpired(error)) return;
        document.getElementById('output').innerHTML =
          '<p class="error">' + escapeHtml(error && error.message || error) + '</p>';
      })
      .getDashboardShell(nilavaramSessionKey());
  }
</script>
