<script>
  function nilavaramSessionKey() {
    try {
      return window.localStorage.getItem('nilavaramSessionKey') || '';
    } catch (error) {
      return '';
    }
  }

  function applyDashboardInfoBootstrap() {
    const info = (typeof DASHBOARD_INFO_BOOTSTRAP === 'object' &&
      DASHBOARD_INFO_BOOTSTRAP)
      ? DASHBOARD_INFO_BOOTSTRAP
      : {};
    window.nilavaramDashboardInfo = info;
    if (info.clientIp) {
      window.nilavaramClientIp = info.clientIp;
    }
    renderStartupLine();
  }

  window.onload = function() {
    applyDashboardInfoBootstrap();
    if (typeof captureClientIpOnce === 'function') {
      captureClientIpOnce();
    }
    initializeDisplayPreferences();
    if (startupTimerId !== null) {
      window.clearInterval(startupTimerId);
    }
    startupTimerId = window.setInterval(renderStartupLine, 1000);
    if (OPEN_CONNECTIONS_ON_LOAD) {
      if (typeof showConnections === 'function') {
        showConnections();
      }
    } else if (typeof showDefaultWorkspace === 'function') {
      showDefaultWorkspace();
    }
    if (typeof buildShellSkeleton === 'function') {
      buildShellSkeleton();
    }
    if (typeof loadShellFromEngine === 'function') {
      loadShellFromEngine();
    }
  };

  function moveContentToTop() {
    const content = document.querySelector('.content');
    if (content) content.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function readPreference(key, fallback) {
    try {
      return window.localStorage.getItem(key) || fallback;
    } catch (error) {
      return fallback;
    }
  }

  function savePreference(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (error) {
      // The selected preference still applies for this page session.
    }
  }

  function applyDisplayPreferences(theme, fontSize) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = fontSize;
    document.getElementById('theme-choice').value = theme;
    document.getElementById('font-choice').value = fontSize;
  }

  function initializeDisplayPreferences() {
    const theme = readPreference('nilavaram-theme', 'sky');
    const fontSize = readPreference('nilavaram-font-size', 'large');
    applyDisplayPreferences(theme, fontSize);

    document.getElementById('theme-choice').addEventListener('change', function(event) {
      document.documentElement.dataset.theme = event.target.value;
      savePreference('nilavaram-theme', event.target.value);
    });
    document.getElementById('font-choice').addEventListener('change', function(event) {
      document.documentElement.dataset.fontSize = event.target.value;
      savePreference('nilavaram-font-size', event.target.value);
    });
  }

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = String(value == null ? '' : value);
    return element.innerHTML;
  }

  function showError(error) {
    const message = error && error.message ? error.message : String(error);
    document.getElementById('output').innerHTML =
      '<p class="error">' + escapeHtml(message) + '</p>';
  }

  function getUserViewTime(date) {
    const dateParts = new Intl.DateTimeFormat(undefined, {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      weekday: 'long'
    }).formatToParts(date);
    const timeParts = new Intl.DateTimeFormat(undefined, {
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).formatToParts(date);
    const part = function(parts, type) {
      const found = parts.find(function(item) { return item.type === type; });
      return found ? found.value : '';
    };

    return {
      date:
        part(dateParts, 'day') + '-' +
        part(dateParts, 'month').toUpperCase() + '-' +
        part(dateParts, 'year'),
      weekday: part(dateParts, 'weekday'),
      time:
        part(timeParts, 'hour') + ':' +
        part(timeParts, 'minute') + ' ' +
        part(timeParts, 'dayPeriod')
    };
  }

  function renderStartupLine() {
    const data = window.nilavaramDashboardInfo || {};
    const started = getUserViewTime(PAGE_VIEW_STARTED_AT);
    const current = getUserViewTime(new Date());
    const userText = data.bootstrapError
      ? '<span class="error"><b>User:</b> ' +
        escapeHtml(data.bootstrapError) + '</span>'
      : data.user
      ? '<b>User:</b> ' + escapeHtml(data.user) +
        ' &nbsp; <b>Role:</b> ' + escapeHtml(data.role || 'none')
      : '<b>User:</b> not available';

    document.getElementById('startup').innerHTML =
      '<div class="startup-date-line">' +
        escapeHtml(started.date) + ' &nbsp; ' + escapeHtml(started.weekday) +
        ' &nbsp; <span class="startup-context">' +
        escapeHtml(typeof getShellContextHeaderText === 'function'
          ? getShellContextHeaderText()
          : 'Select client and business') +
        '</span>' +
      '</div>' +
      '<div class="startup-time-line">' +
        '<b>Started:</b> ' + escapeHtml(started.time) +
        ' &nbsp; <b>Current:</b> ' + escapeHtml(current.time) +
      '</div>' +
      '<div class="startup-user-line">' + userText + '</div>';
  }

  function renderStartupClock() {
    renderStartupLine();
  }

  function renderStartupInfo(data) {
    window.nilavaramDashboardInfo = data;
    renderStartupLine();
  }

  function getSessionDetailsText() {
    const data = window.nilavaramDashboardInfo || {};
    const started = getUserViewTime(PAGE_VIEW_STARTED_AT);
    const current = getUserViewTime(new Date());
    return [
      'User: ' + (data.user || ''),
      'Role: ' + (data.role || ''),
      started.date + ' ' + started.weekday,
      'Started viewing: ' + started.time + ' (local time)',
      'Current time: ' + current.time + ' (local time)'
    ].join('\n');
  }

  function copySessionDetails() {
    const text = getSessionDetailsText();
    const showCopied = function() {
      const result = document.getElementById('copy-session-result');
      if (result) result.textContent = 'Copied.';
    };
    const fallbackCopy = function() {
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'absolute';
      field.style.left = '-9999px';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      showCopied();
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function getInviteTokenFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      return String(params.get('invite') || '').trim();
    } catch (error) {
      return '';
    }
  }

  function renderWrongInviteAccountPanel(landing) {
    document.getElementById('menu').textContent = '';
    document.getElementById('output').innerHTML =
      '<h2>Invitation link</h2>' +
      '<p><b>This invitation is for:</b> ' + escapeHtml(landing.email) + '</p>' +
      '<p><b>You are signed in as:</b> ' +
        escapeHtml((window.nilavaramDashboardInfo || {}).user || '') + '</p>' +
      '<p class="error">Sign out, then open the invitation link again and choose ' +
        escapeHtml(landing.email) + ' when Google asks which account to use.</p>' +
      '<p class="help-meta">Tip: use a private/incognito window to avoid the wrong ' +
        'Google account opening automatically.</p>';
  }

  function renderInviteOnboardingPanel(data, landing) {
    document.getElementById('menu').textContent = '';

    const displayName = landing.displayName || data.user || '';
    const phoneDisplay = landing.mobilePhoneDisplay || '';

    let html =
      '<h2>Welcome to Nilavaram</h2>' +
      '<p>Complete this one-time setup before entering the workspace.</p>' +
      '<p class="help-meta"><b>Invited role:</b> ' + escapeHtml(data.role || landing.role || '') +
      '</p>' +
      '<p class="help-meta">If you did not receive the invitation email in your Inbox, ' +
      'check your <b>Spam</b> or <b>Junk</b> folder.</p>' +
      '<form id="invite-onboarding-form">' +
        '<div><label for="onboard-displayName">Display name</label>' +
          '<input id="onboard-displayName" type="text" required value="' +
          escapeHtml(displayName) + '"></div>' +
        '<div><label for="onboard-email">Google email (read-only)</label>' +
          '<input id="onboard-email" type="email" readonly value="' +
          escapeHtml(data.user || landing.email || '') + '"></div>' +
        '<div><label for="onboard-mobilePhone">US mobile phone</label>' +
          '<input id="onboard-mobilePhone" type="tel" inputmode="tel" required value="' +
          escapeHtml(phoneDisplay) + '"></div>' +
        '<p class="help-meta">Confirm this is your US mobile number. SMS reminders may be sent later.</p>' +
        '<label><input id="onboard-spam-ack" type="checkbox" required> ' +
          'I will check Spam/Junk if the invitation email is not in my Inbox.</label>' +
        '<div style="margin-top:16px">' +
          '<button class="primary-button" type="submit" id="onboard-submit-btn">' +
            'Confirm profile and accept invitation</button>' +
        '</div>' +
        '<p id="onboard-message" class="help-meta"></p>' +
      '</form>';

    document.getElementById('output').innerHTML = html;

    const form = document.getElementById('invite-onboarding-form');
    if (!form) {
      return;
    }
    form.onsubmit = function(event) {
      event.preventDefault();
      confirmAndAcceptInvitation();
    };
  }

  function blockInactiveShellAccess(data) {
    const inviteToken = getInviteTokenFromUrl();
    const landing = window.nilavaramInviteLanding;

    if (landing && landing.hasToken && landing.valid && !landing.emailMatchesSignedIn) {
      renderWrongInviteAccountPanel(landing);
      return true;
    }

    if (data.accessStatus === 'invited') {
      if (landing && landing.hasToken) {
        if (!landing.valid) {
          document.getElementById('menu').textContent = '';
          document.getElementById('output').innerHTML =
            '<h2>Invitation link</h2>' +
            '<p class="error">' + escapeHtml(landing.message) + '</p>';
          return true;
        }
        if (!landing.emailMatchesSignedIn) {
          renderWrongInviteAccountPanel(landing);
          return true;
        }
        if (landing.alreadyActive) {
          document.getElementById('menu').textContent = '';
          document.getElementById('output').innerHTML =
            '<h2>Invitation already active</h2>' +
            '<p>Your invitation is already active. Reloading the workspace...</p>';
          return true;
        }
      } else if (data.inviteTokenRequired && !inviteToken) {
        document.getElementById('menu').textContent = '';
        document.getElementById('output').innerHTML =
          '<h2>Invitation required</h2>' +
          '<p class="error">Open the invitation link from your email to continue.</p>';
        return true;
      }

      renderInviteOnboardingPanel(data, landing || {});
      return true;
    }

    if (data.accessStatus !== 'active') {
      document.getElementById('menu').textContent = '';
      document.getElementById('output').innerHTML =
        '<h2>Access unavailable</h2>' +
        '<p class="error">This Google account has not been invited. ' +
        'The menu and module windows are not available.</p>';
      return true;
    }
    return false;
  }

  function redirectAfterInviteAccept() {
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('invite');
      window.location.href = url.toString();
    } catch (error) {
      window.location.reload();
    }
  }

  function confirmAndAcceptInvitation() {
    const token = getInviteTokenFromUrl();
    const messageEl = document.getElementById('onboard-message');
    const submitBtn = document.getElementById('onboard-submit-btn');
    const displayName = document.getElementById('onboard-displayName').value;
    const mobilePhone = document.getElementById('onboard-mobilePhone').value;
    const spamAck = document.getElementById('onboard-spam-ack');

    if (!spamAck || !spamAck.checked) {
      if (messageEl) {
        messageEl.textContent = ' Please confirm the Spam/Junk checkbox.';
      }
      return;
    }

    if (messageEl) {
      messageEl.textContent = ' Saving your profile and accepting invitation...';
    }
    if (submitBtn) {
      submitBtn.disabled = true;
    }

    google.script.run
      .withSuccessHandler(function() {
        google.script.run
          .withSuccessHandler(function() {
            redirectAfterInviteAccept();
          })
          .withFailureHandler(function(error) {
            if (submitBtn) submitBtn.disabled = false;
            showError(error);
          })
          .acceptMyInvitation(token);
      })
      .withFailureHandler(function(error) {
        if (submitBtn) submitBtn.disabled = false;
        if (messageEl) {
          messageEl.textContent = ' ' +
            (error && error.message ? error.message : String(error));
        } else {
          showError(error);
        }
      })
      .completeInviteOnboarding(token, {
        displayName: displayName,
        mobilePhone: mobilePhone
      });
  }

  function loadShellFromEngine() {
    const loading = document.getElementById('shell-loading-msg');
    if (loading) {
      loading.hidden = false;
      loading.textContent = 'Connecting securely...';
    }
    google.script.run
      .withSuccessHandler(function(shell) {
        applyShellFromEngine(shell);
      })
      .withFailureHandler(function(error) {
        renderStartupLine();
        const message = error && error.message ? error.message : String(error);
        if (loading) {
          loading.hidden = false;
          loading.textContent = 'Connection failed: ' + message;
        }
        showWorkspaceNotice('Server connection failed: ' + message);
      })
      .getDashboardShell(nilavaramSessionKey());
  }

  function acceptInvitation() {
    confirmAndAcceptInvitation();
  }
</script>
