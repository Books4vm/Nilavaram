<script>
  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = String(value == null ? '' : value);
    return element.innerHTML;
  }

  function readPopupPreference(key, fallback) {
    try {
      return window.localStorage.getItem(key) || fallback;
    } catch (error) {
      return fallback;
    }
  }

  function applyPopupDisplayPreferences() {
    const theme = readPopupPreference('nilavaram-theme', 'sky');
    const fontSize = readPopupPreference('nilavaram-font-size', 'large');
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = fontSize;
  }

  function getUserViewTime(date) {
    const dateParts = new Intl.DateTimeFormat(undefined, {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      weekday: 'long'
    }).formatToParts(date);
    const timeParts = new Intl.DateTimeFormat(undefined, {
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).formatToParts(date);
    const part = function(parts, type) {
      const found = parts.find(function(item) { return item.type === type; });
      return found ? found.value : '';
    };

    return {
      date:
        part(dateParts, 'day') + '-' +
        part(dateParts, 'month').toUpperCase() + '-' +
        part(dateParts, 'year'),
      weekday: part(dateParts, 'weekday'),
      time:
        part(timeParts, 'hour') + ':' +
        part(timeParts, 'minute') + ' ' +
        part(timeParts, 'dayPeriod')
    };
  }

  function formatInviteScopeSummary(user) {
    const parts = [];
    const clients = user.allowedClientIds || [];
    const entities = user.allowedEntityIds || [];
    const modules = user.allowedModules || [];
    if (clients.length) parts.push(clients.length + ' client(s)');
    if (entities.length) parts.push(entities.length + ' business(es)');
    if (modules.length) parts.push(modules.length + ' module(s)');
    return parts.length ? parts.join(', ') : 'All';
  }

  function formatInvitePhoneDisplay(user) {
    if (user && user.mobilePhoneDisplay) {
      return user.mobilePhoneDisplay;
    }
    const digits = String(user && user.mobilePhone || '').replace(/\D/g, '');
    const tenDigit = digits.length === 11 && digits.charAt(0) === '1'
      ? digits.slice(1)
      : digits;
    if (tenDigit.length !== 10) {
      return '';
    }
    return '(' + tenDigit.slice(0, 3) + ') ' +
      tenDigit.slice(3, 6) + '-' + tenDigit.slice(6);
  }

  function updateInvitePhoneFieldForRole(role) {
    const phoneInput = document.getElementById('invite-mobilePhone');
    const disclaimer = document.getElementById('invite-sms-disclaimer');
    if (!phoneInput) return;
    const disabledRole = role === 'disabled';
    phoneInput.required = !disabledRole;
    phoneInput.disabled = disabledRole;
    if (disclaimer) {
      disclaimer.hidden = disabledRole;
    }
  }

  function renderInviteShellHeader() {
    const startup = document.getElementById('startup');
    const badge = document.getElementById('module-shell-meta');
    const started = getUserViewTime(
      typeof PAGE_VIEW_STARTED_AT !== 'undefined'
        ? PAGE_VIEW_STARTED_AT
        : new Date()
    );
    const current = getUserViewTime(new Date());

    const clientName = (typeof INVITE_CLIENT_NAME !== 'undefined' && INVITE_CLIENT_NAME)
      ? INVITE_CLIENT_NAME : 'Client not passed';
    const entityName = (typeof INVITE_ENTITY_NAME !== 'undefined' && INVITE_ENTITY_NAME)
      ? INVITE_ENTITY_NAME : 'Business not passed';
    const userEmail = (typeof INVITE_USER_EMAIL !== 'undefined' && INVITE_USER_EMAIL)
      ? INVITE_USER_EMAIL : 'User not passed';
    const userRole = (typeof INVITE_USER_ROLE !== 'undefined' && INVITE_USER_ROLE)
      ? INVITE_USER_ROLE : 'Role not passed';

    if (startup) {
      startup.innerHTML =
        '<div class="startup-date-line">' +
          escapeHtml(started.date) + ' &nbsp; ' + escapeHtml(started.weekday) +
          ' &nbsp; <span class="startup-context">' +
          escapeHtml(clientName) + ' · ' + escapeHtml(entityName) +
          '</span></div>' +
        '<div class="startup-time-line">' +
          '<b>Started:</b> ' + escapeHtml(started.time) +
          ' &nbsp; <b>Current:</b> ' + escapeHtml(current.time) +
        '</div>' +
        '<div class="startup-user-line">' +
          '<b>User:</b> ' + escapeHtml(userEmail) +
          ' &nbsp; <b>Role:</b> ' + escapeHtml(userRole) +
        '</div>';
    }

    if (badge) {
      badge.textContent = 'Users & Invitations';
    }
  }

  function copyInviteText(text, resultId) {
    const showCopied = function() {
      const el = document.getElementById(resultId);
      if (el) el.textContent = 'Copied.';
    };
    const fallbackCopy = function() {
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'absolute';
      field.style.left = '-9999px';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      showCopied();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function initInviteWindow() {
    applyPopupDisplayPreferences();
    renderInviteShellHeader();
    google.script.run
      .withSuccessHandler(renderInviteWindow)
      .withFailureHandler(function(error) {
        document.getElementById('output').innerHTML =
          '<p class="error">' + escapeHtml(error && error.message || error) + '</p>';
      })
      .getInvitePageData();
  }

  function bindInviteRolePicker() {
    const roleSelect = document.getElementById('invite-role');
    if (!roleSelect) return;
    roleSelect.onchange = function() {
      updateInviteAccessPickersForRole(roleSelect.value);
      updateInvitePhoneFieldForRole(roleSelect.value);
    };
  }

  function loadUserIntoInviteForm(user) {
    if (!user) return;
    document.getElementById('invite-email').value = user.email || '';
    document.getElementById('invite-displayName').value = user.displayName || '';
    document.getElementById('invite-mobilePhone').value = formatInvitePhoneDisplay(user);
    document.getElementById('invite-role').value = user.role || 'reader';
    updateInviteAccessPickersForRole(user.role || 'reader');
    updateInvitePhoneFieldForRole(user.role || 'reader');
    applyInviteAccessSelection({
      allowedClientIds: user.allowedClientIds || [],
      allowedEntityIds: user.allowedEntityIds || [],
      allowedModules: user.allowedModules || []
    });
    document.getElementById('invite-form').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('invite-form-message').textContent =
      ' Editing ' + (user.email || '') + '. Save to update, then Copy invite to resend.';
  }

  function resendInviteEmailForUser(email) {
    if (!email) return;
    google.script.run
      .withSuccessHandler(function(result) {
        alert(result.message);
        loadInviteMessage(email);
        google.script.run
          .withSuccessHandler(function(pageData) {
            window.nilavaramInvitePage = pageData;
            renderInviteUsersTable(pageData.users || []);
          })
          .getInvitePageData();
      })
      .withFailureHandler(function(error) {
        alert(error && error.message ? error.message : String(error));
      })
      .resendInviteEmail(email);
  }

  function renderInviteWindow(data) {
    window.nilavaramInvitePage = data;
    window.nilavaramInviteAccessCatalog = data.accessCatalog || { clients: [] };
    const output = document.getElementById('output');

    let mainUiSection =
      '<section class="workspace-selection">' +
        '<h3>Main UI URL</h3>' +
        '<p class="help-meta">Saving an invitation sends email automatically from your ' +
          'Gmail account. Each invite link includes a unique token (?invite=...).</p>' +
        '<div class="invite-url-box" id="main-ui-url-display">' +
          escapeHtml(data.mainUiUrl || '(not set yet)') +
        '</div>' +
        '<div class="invite-actions">' +
          '<button type="button" class="secondary-button" id="copy-main-ui-url">' +
            'Copy link</button>' +
          '<span id="copy-main-ui-result" class="help-meta"></span>' +
        '</div>';

    if (data.canEditMainUiUrl) {
      mainUiSection +=
        '<label for="main-ui-url-input"><b>Super Admin — update URL</b></label>' +
        '<input id="main-ui-url-input" type="url" style="width:100%;margin:8px 0;" ' +
          'value="' + escapeHtml(data.mainUiUrl || '') + '">' +
        '<div class="invite-actions">' +
          '<button type="button" class="primary-button" id="save-main-ui-url">' +
            'Save URL</button>' +
          '<button type="button" class="secondary-button" id="refresh-main-ui-url">' +
            'Refresh from deployment</button>' +
          '<span id="main-ui-save-result" class="help-meta"></span>' +
        '</div>';
    }
    mainUiSection += '</section>';

    output.innerHTML =
      mainUiSection +
      '<section class="workspace-selection">' +
        '<h3>Invite a user</h3>' +
        '<form id="invite-form">' +
          '<div class="form-grid">' +
            '<div><label for="invite-email">Google email</label>' +
              '<input id="invite-email" type="email" required></div>' +
            '<div><label for="invite-displayName">Display name</label>' +
              '<input id="invite-displayName" type="text" required></div>' +
            '<div><label for="invite-mobilePhone">US mobile phone</label>' +
              '<input id="invite-mobilePhone" type="tel" inputmode="tel" ' +
              'autocomplete="tel" placeholder="(555) 123-4567" required></div>' +
            '<div><label for="invite-role">Role</label>' +
              '<select id="invite-role">' +
                '<option value="admin">Admin</option>' +
                '<option value="editor">Editor</option>' +
                '<option value="reader">Reader</option>' +
                '<option value="ltd">Ltd</option>' +
                '<option value="disabled">Disabled</option>' +
              '</select></div>' +
          '</div>' +
          '<p id="invite-sms-disclaimer" class="help-meta">' +
            'SMS account reminders are sent only to US mobile numbers. ' +
            'By saving this invitation, you confirm this is a US mobile number for the invitee.' +
          '</p>' +
          '<div id="invite-access-pickers"></div>' +
          '<button class="primary-button" type="submit">Save invitation</button>' +
          '<span id="invite-form-message"></span>' +
        '</form>' +
      '</section>' +
      '<section class="workspace-selection" id="invite-message-panel" hidden>' +
        '<h3>Invite message — backup copy</h3>' +
        '<p class="help-meta">Email is sent automatically on Save. Use Copy message only if ' +
          'you need to resend manually.</p>' +
        '<textarea id="invite-message-text" class="invite-message" readonly></textarea>' +
        '<div class="invite-actions">' +
          '<button type="button" class="secondary-button" id="copy-invite-message">' +
            'Copy message</button>' +
          '<span id="copy-invite-message-result" class="help-meta"></span>' +
        '</div>' +
      '</section>' +
      '<section class="workspace-selection">' +
        '<h3>Existing users</h3>' +
        '<div id="invite-users-list">Loading...</div>' +
      '</section>';

    updateInviteAccessPickersForRole(
      document.getElementById('invite-role').value || 'admin'
    );
    updateInvitePhoneFieldForRole(
      document.getElementById('invite-role').value || 'admin'
    );
    bindInviteRolePicker();

    document.getElementById('copy-main-ui-url').onclick = function() {
      copyInviteText(data.mainUiUrl || '', 'copy-main-ui-result');
    };
    if (data.canEditMainUiUrl) {
      document.getElementById('save-main-ui-url').onclick = saveMainUiUrlFromInviteWindow;
      document.getElementById('refresh-main-ui-url').onclick = refreshMainUiUrlFromInviteWindow;
    }
    document.getElementById('invite-form').onsubmit = saveInviteForm;
    document.getElementById('copy-invite-message').onclick = function() {
      copyInviteText(
        document.getElementById('invite-message-text').value,
        'copy-invite-message-result'
      );
    };

    renderInviteUsersTable(data.users || []);
  }

  function saveMainUiUrlFromInviteWindow() {
    const url = document.getElementById('main-ui-url-input').value;
    document.getElementById('main-ui-save-result').textContent = ' Saving...';
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('main-ui-save-result').textContent = ' ' + result.message;
        initInviteWindow();
      })
      .withFailureHandler(function(error) {
        document.getElementById('main-ui-save-result').innerHTML =
          ' <span class="error">' + escapeHtml(error.message) + '</span>';
      })
      .saveMainUiUrl(url);
  }

  function refreshMainUiUrlFromInviteWindow() {
    document.getElementById('main-ui-save-result').textContent = ' Refreshing...';
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('main-ui-save-result').textContent = ' ' + result.message;
        initInviteWindow();
      })
      .withFailureHandler(function(error) {
        document.getElementById('main-ui-save-result').innerHTML =
          ' <span class="error">' + escapeHtml(error.message) + '</span>';
      })
      .refreshMainUiUrlFromDeployment();
  }

  function saveInviteForm(event) {
    event.preventDefault();
    const role = document.getElementById('invite-role').value;
    const access = collectInviteAccessInput(role);
    const input = {
      email: document.getElementById('invite-email').value,
      displayName: document.getElementById('invite-displayName').value,
      mobilePhone: document.getElementById('invite-mobilePhone').value,
      role: role,
      allowedClientIds: access.allowedClientIds,
      allowedEntityIds: access.allowedEntityIds,
      allowedModules: access.allowedModules
    };

    document.getElementById('invite-form-message').textContent = ' Saving and sending email...';
    google.script.run
      .withSuccessHandler(function(result) {
        const cssClass = result.emailSent ? 'success' : 'error';
        document.getElementById('invite-form-message').innerHTML =
          ' <span class="' + cssClass + '">' + escapeHtml(result.message) + '</span>';
        loadInviteMessage(input.email, function(inviteResult) {
          showInviteSavedPopup(input.email, inviteResult, result);
          google.script.run
            .withSuccessHandler(function(pageData) {
              window.nilavaramInvitePage = pageData;
              renderInviteUsersTable(pageData.users || []);
            })
            .getInvitePageData();
        });
      })
      .withFailureHandler(function(error) {
        document.getElementById('invite-form-message').innerHTML =
          ' <span class="error">' + escapeHtml(error.message) + '</span>';
      })
      .saveUser(input);
  }

  function loadInviteMessage(email, onComplete) {
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('invite-message-panel').hidden = false;
        document.getElementById('invite-message-text').value = result.message;
        if (typeof onComplete === 'function') {
          onComplete(result);
        }
      })
      .withFailureHandler(function(error) {
        alert(error && error.message ? error.message : String(error));
      })
      .getInviteMessageForUser(email);
  }

  function renderInviteUsersTable(users) {
    const host = document.getElementById('invite-users-list');
    if (!host) return;

    let html =
      '<table class="users-table"><thead><tr>' +
        '<th>Email</th><th>Name</th><th>Phone</th><th>Role</th><th>Scope</th>' +
        '<th>Status</th><th>Actions</th>' +
      '</tr></thead><tbody>';

    users.forEach(function(user, index) {
      html +=
        '<tr>' +
          '<td>' + escapeHtml(user.email) + '</td>' +
          '<td>' + escapeHtml(user.displayName || '') + '</td>' +
          '<td>' + escapeHtml(formatInvitePhoneDisplay(user) || '—') + '</td>' +
          '<td>' + escapeHtml(user.role) + '</td>' +
          '<td>' + escapeHtml(formatInviteScopeSummary(user)) + '</td>' +
          '<td>' + escapeHtml(user.status) + '</td>' +
          '<td>' +
            '<button type="button" class="secondary-button invite-edit-btn" ' +
              'data-user-index="' + index + '">Edit</button> ' +
            (user.status === 'invited'
              ? '<button type="button" class="secondary-button invite-resend-btn" ' +
                  'data-user-index="' + index + '">Resend email</button> '
              : '') +
            '<button type="button" class="secondary-button invite-copy-btn" ' +
              'data-user-index="' + index + '">Copy message</button>' +
          '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    host.innerHTML = html;

    host.querySelectorAll('.invite-edit-btn').forEach(function(button) {
      button.onclick = function() {
        const idx = Number(button.getAttribute('data-user-index'));
        loadUserIntoInviteForm(
          (window.nilavaramInvitePage && window.nilavaramInvitePage.users || [])[idx]
        );
      };
    });

    host.querySelectorAll('.invite-resend-btn').forEach(function(button) {
      button.onclick = function() {
        const idx = Number(button.getAttribute('data-user-index'));
        const user = (window.nilavaramInvitePage &&
          window.nilavaramInvitePage.users || [])[idx];
        if (user && user.email) {
          resendInviteEmailForUser(user.email);
        }
      };
    });
  }

function openManageClientsFromInviteWindow() {
  const page = window.nilavaramInvitePage || {};
  const baseUrl = String(page.mainUiUrl || '').replace(/\?$/, '');
  if (!baseUrl) {
    alert('Save or refresh the Main UI URL first.');
    return;
  }

  const query =
    '?clientBusinessWindow=1' +
    '&clientId=' + encodeURIComponent(
      typeof INVITE_CLIENT_ID !== 'undefined' ? INVITE_CLIENT_ID : ''
    ) +
    '&entityId=' + encodeURIComponent(
      typeof INVITE_ENTITY_ID !== 'undefined' ? INVITE_ENTITY_ID : ''
    ) +
    '&clientName=' + encodeURIComponent(
      typeof INVITE_CLIENT_NAME !== 'undefined' ? INVITE_CLIENT_NAME : ''
    ) +
    '&entityName=' + encodeURIComponent(
      typeof INVITE_ENTITY_NAME !== 'undefined' ? INVITE_ENTITY_NAME : ''
    ) +
    '&user=' + encodeURIComponent(page.currentAdminEmail || '') +
    '&role=' + encodeURIComponent('admin');

  const popup = window.open(
    baseUrl + query,
    'NilavaramClientBusiness',
    'popup=yes,width=980,height=900,resizable=yes,scrollbars=yes'
  );

  if (!popup || popup.closed) {
    alert('Pop-up blocked. Allow pop-ups, then try again.');
    return;
  }

  const msg = document.getElementById('invite-manage-clients-msg');
  if (msg) {
    msg.textContent = ' Manage window open — close it to refresh the list.';
  }

  const timer = window.setInterval(function() {
    if (!popup || popup.closed) {
      window.clearInterval(timer);
      refreshInviteClientCatalog();
    }
  }, 500);
}

function refreshInviteClientCatalog() {
  const msg = document.getElementById('invite-manage-clients-msg');
  if (msg) {
    msg.textContent = ' Refreshing client list...';
  }

  google.script.run
    .withSuccessHandler(function(data) {
      window.nilavaramInviteAccessCatalog = data.accessCatalog || { clients: [] };
      const roleSelect = document.getElementById('invite-role');
      updateInviteAccessPickersForRole(roleSelect ? roleSelect.value : 'admin');
      if (msg) {
        msg.textContent = ' Client and business list updated.';
      }
    })
    .withFailureHandler(function(error) {
      if (msg) {
        msg.textContent = ' ' + (error && error.message ? error.message : String(error));
      }
    })
    .getInviteAccessCatalog();
}

function bindInviteManageClientsButton() {
  const button = document.getElementById('invite-manage-clients-btn');
  if (!button) return;
  button.onclick = openManageClientsFromInviteWindow;
}

function showInviteSavedPopup(email, inviteResult, saveResult) {
  const safeEmail = String(email || '').trim();
  const save = saveResult || {};
  const lines = [];

  if (save.emailSent) {
    lines.push(
      'Invitation saved.',
      'Two emails were sent:',
      '  1. Full invitation (with setup link)',
      '  2. Short ALERT — check Spam/Junk',
      '',
      'Invitee: ' + safeEmail,
      '',
      'They must sign in with exactly that Google account.',
      'Phone push only works if that Gmail is on their phone Gmail app.'
    );
  } else {
    lines.push(
      'Invitation saved, but email was NOT sent.',
      '',
      'Invitee: ' + safeEmail,
      '',
      String(save.emailError || save.message || 'Unknown email error.'),
      '',
      'Use Resend email on the user row, or Copy message below.'
    );
  }

  if (inviteResult && inviteResult.inviteUrl) {
    lines.push('', 'Setup link:', inviteResult.inviteUrl);
  }

  alert(lines.join('\n'));

  const panel = document.getElementById('invite-message-panel');
  if (panel) {
    panel.hidden = false;
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
</script>
