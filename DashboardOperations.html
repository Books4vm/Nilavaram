    function validateMicrosoftOneDrive() {
      const output = document.getElementById('output');
      output.insertAdjacentHTML(
        'afterbegin',
        '<p id="microsoft-live-check"><b>Contacting Microsoft Graph...</b></p>'
      );
      const timeoutId = window.setTimeout(function() {
        const message = document.getElementById('microsoft-live-check');
        if (message) {
          message.innerHTML =
            '<span class="error"><b>The live Microsoft check did not ' +
            'return within 30 seconds.</b></span>';
        }
      }, 30000);
      google.script.run
        .withSuccessHandler(function(status) {
          window.clearTimeout(timeoutId);
          renderMicrosoftConnection(status);
          document.getElementById('output').insertAdjacentHTML(
            'afterbegin',
            '<p class="success"><b>Live Microsoft Graph validation passed.</b></p>'
          );
        })
        .withFailureHandler(function(error) {
          window.clearTimeout(timeoutId);
          showError(error);
        })
        .validateMicrosoftConnectionForUi();
    }

    function renderCodeChangeHistory(data) {
      const output = document.getElementById('output');
      output.innerHTML =
        '<h2>About and Version History</h2>' +
        '<p>This page lists code commits that were successfully pushed to the GitHub <b>main</b> branch. A local-only commit does not appear here.</p>';

      if (!data.commits.length) {
        output.innerHTML += '<p>No pushed commits were found.</p>';
        return;
      }

      const table = document.createElement('table');
      const head = document.createElement('thead');
      head.innerHTML =
        '<tr><th>Date and time</th><th>Change</th><th>Commit</th><th>Author</th></tr>';
      table.appendChild(head);
      const body = document.createElement('tbody');

      data.commits.forEach(function(commit) {
        const row = document.createElement('tr');
        const dateCell = document.createElement('td');
        const pacific = getPacificViewTime(new Date(commit.committedAt));
        dateCell.textContent =
          pacific.date + ' ' + pacific.weekday + ' ' +
          pacific.time + ' Pacific Time';

        const messageCell = document.createElement('td');
        messageCell.textContent = commit.message;

        const commitCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = commit.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = commit.shortSha;
        commitCell.appendChild(link);

        const authorCell = document.createElement('td');
        authorCell.textContent = commit.authorName;

        row.appendChild(dateCell);
        row.appendChild(messageCell);
        row.appendChild(commitCell);
        row.appendChild(authorCell);
        body.appendChild(row);
      });
      table.appendChild(body);
      output.appendChild(table);
    }

    function renderHelpArticle(article) {
      window.nilavaramHelpArticle = article;
      const output = document.getElementById('output');
      output.textContent = '';

      const heading = document.createElement('h2');
      heading.textContent = article.title;
      output.appendChild(heading);

      const meta = document.createElement('p');
      meta.className = 'help-meta';
      meta.textContent =
        'Version ' + article.version + ' Â· Updated by ' + article.updatedBy;
      output.appendChild(meta);

      const content = document.createElement('div');
      content.className = 'help-content';
      renderMarkdown(content, article.content);
      output.appendChild(content);

      if (article.canEdit) {
        const buttons = document.createElement('div');
        buttons.className = 'button-row';
        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'primary-button';
        editButton.textContent = 'Edit Help Content';
        editButton.onclick = showHelpEditor;
        buttons.appendChild(editButton);
        output.appendChild(buttons);
      }
    }

    function appendMarkdownText(element, text) {
      String(text).split(/(\*\*[^*]+\*\*)/).forEach(function(part) {
        if (
          part.indexOf('**') === 0 &&
          part.lastIndexOf('**') === part.length - 2
        ) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          element.appendChild(strong);
        } else {
          element.appendChild(document.createTextNode(part));
        }
      });
    }

    function renderMarkdown(container, markdown) {
      container.textContent = '';
      let list = null;
      let codeBlock = null;

      String(markdown || '').split(/\r?\n/).forEach(function(line) {
        if (line.trim() === '```') {
          if (codeBlock) {
            container.appendChild(codeBlock);
            codeBlock = null;
          } else {
            codeBlock = document.createElement('pre');
            codeBlock.appendChild(document.createElement('code'));
          }
          return;
        }
        if (codeBlock) {
          codeBlock.firstChild.textContent +=
            (codeBlock.firstChild.textContent ? '\n' : '') + line;
          return;
        }

        const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (headingMatch) {
          list = null;
          const heading = document.createElement('h' + headingMatch[1].length);
          appendMarkdownText(heading, headingMatch[2]);
          container.appendChild(heading);
          return;
        }

        const listMatch = line.match(/^\s*-\s+(.+)$/);
        if (listMatch) {
          if (!list) {
            list = document.createElement('ul');
            container.appendChild(list);
          }
          const item = document.createElement('li');
          appendMarkdownText(item, listMatch[1]);
          list.appendChild(item);
          return;
        }

        list = null;
        if (!line.trim()) return;
        const paragraph = document.createElement('p');
        appendMarkdownText(paragraph, line);
        container.appendChild(paragraph);
      });

      if (codeBlock) container.appendChild(codeBlock);
    }

    function renderDevelopmentTasks(tasks) {
      const output = document.getElementById('output');
      output.innerHTML = '<h2>Pending Features</h2>';
      tasks.forEach(function(task) {
        const article = document.createElement('article');
        article.className = 'alert-item';
        const heading = document.createElement('h3');
        heading.textContent = task.title;
        article.appendChild(heading);

        const details = document.createElement('p');
        details.textContent =
          'Assigned to: ' + task.assignedTo +
          ' \u00B7 Due: ' + formatStoredDate(task.dueDate) +
          ' \u00B7 Status: ' + task.status;
        article.appendChild(details);

        const list = document.createElement('ul');
        (task.requirements || []).forEach(function(requirement) {
          const item = document.createElement('li');
          item.textContent = requirement;
          list.appendChild(item);
        });
        article.appendChild(list);
        output.appendChild(article);
      });
    }

    function formatStoredDate(value) {
      const parts = String(value || '').split('-');
      if (parts.length !== 3) return String(value || '');
      const months = [
        'JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
        'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'
      ];
      return parts[2] + '-' + months[Number(parts[1]) - 1] + '-' + parts[0];
    }

        .trim().toLowerCase();

            String(account.code || '').toLowerCase().indexOf(query) === -1 &&
            String(account.name || '').toLowerCase().indexOf(query) === -1) return;
        displayed += 1;
        html += '<tr><td>' + escapeHtml(account.code) + '</td>' +
          '<td>' + escapeHtml(account.name) +

    function reviewDeleteAccountBatch() {
      const ids = selectedBatchAccountIds();
      const message = document.getElementById('account-batch-message');
      const results = document.getElementById('account-batch-results');
      if (!ids.length) {
        message.innerHTML = '<span class="error"> Select at least one account.</span>';
        return;
      }
      if (!window.confirm(
        'Review ' + ids.length + ' selected account(s) and permanently delete only those with no references? Protected accounts will be retained.'
      )) return;
      message.textContent = ' Reviewing references and deleting only unused accountsâ€¦';
      results.innerHTML = '';
      google.script.run.withSuccessHandler(function(result) {
        message.innerHTML = '<span class="success"> ' + escapeHtml(result.message) + '</span>';
        let html = '';
        if ((result.deleted || []).length) {
          html += '<article class="alert-item"><h3>Deleted unused accounts</h3><ul>' +
            result.deleted.map(function(account) {
              return '<li>' + escapeHtml(account.code + ' â€” ' + account.name) + '</li>';
            }).join('') + '</ul></article>';
        }
        if ((result.blocked || []).length) {
          html += '<article class="alert-item"><h3 class="error">Protected â€” action required</h3>' +
            '<p class="error"><b>These accounts were not deleted.</b> Reassign their references, then run Review / delete selected again.</p>' +
            result.blocked.map(function(account) {
              return '<section><p class="error"><b>' +
                escapeHtml(account.code + ' â€” ' + account.name) + '</b>: ' +
                escapeHtml(account.referenceCount) + ' reference(s). ' +
                escapeHtml(account.reason) + '</p>' +
                ((account.references || []).length
                  ? '<ul>' + account.references.map(function(ref) {
                      return '<li>' + escapeHtml(ref.collection + ': ' +
                        (ref.date || '') + ' ' + (ref.description || ref.id)) + '</li>';
                    }).join('') + '</ul>' : '') +
                (account.referencesTruncated
                  ? '<p class="error">Only the first 25 references are shown.</p>' : '') +
                '</section>';
            }).join('') +
            '<div class="button-row"><button type="button" onclick="showChartOfAccounts(\'batch\')">Continue Batch Edit</button>' +
            '<button type="button" onclick="showInputWorkspace(\'input-main\')">Go to Input / ACODE work</button></div></article>';
        }
        results.innerHTML = html || '<p>No accounts were changed.</p>';
        document.querySelectorAll('.account-batch-check:checked').forEach(function(box) {
          if ((result.deleted || []).some(function(item) { return item.id === box.value; })) {
            box.closest('tr').remove();
          } else {
            box.checked = false;
          }
        });
        results.scrollIntoView({behavior: 'smooth', block: 'start'});
      }).withFailureHandler(function(error) {
        message.innerHTML = '<span class="error"> ' + escapeHtml(error.message) + '</span>';
      }).reviewAndDeleteUnusedChartAccountsBatch(ids);
    }

    }

    function deleteReviewedChartAccount(accountId, accountCode) {
      if (!window.confirm(
        'Permanently delete unused account ' + accountCode +
        '? This action removes it from the Chart of Accounts. An audit-history copy will remain.'
      )) return;
      google.script.run.withSuccessHandler(function(result) {
        window.alert(result.message);
        showChartOfAccounts();
      }).withFailureHandler(function(error) {
        document.getElementById('account-deletion-review').innerHTML =
          '<p class="error">' + escapeHtml(error.message) + '</p>';
      }).deleteUnusedChartAccount(accountId);
    }

    function editChartAccount(index) {
      const account = window.nilavaramChartData.accounts[index];
      if (!account) return;
      document.getElementById('account-id').value = account.id || '';
      document.getElementById('account-entity').value = account.entityId || '';
      document.getElementById('account-code').value = account.code || '';
      document.getElementById('account-name').value = account.name || '';
      document.getElementById('account-type').value = account.accountType || 'group';
      document.getElementById('account-parent').value = account.parentCode || '';
      document.getElementById('account-status').value = account.status || 'active';
      document.getElementById('account-notes').value = account.notes || '';
      document.getElementById('account-advanced').open = true;
      document.getElementById('account-form').style.display = '';
      let actions = document.getElementById('account-edit-actions');
      if (!actions) {
        actions = document.createElement('div');
        actions.id = 'account-edit-actions';
        actions.className = 'button-row';
        document.getElementById('account-form').appendChild(actions);
      }
      actions.innerHTML = '<button type="button" onclick="changeChartAccountVisibility(' +
        index + ', ' + (account.isHidden ? 'true' : 'false') + ')">' +
        (account.isHidden ? 'Restore account' : 'Hide account') + '</button>' +
        '<button type="button" onclick="reviewChartAccountDeletion(' + index +
        ')">Review / delete account</button>';
      document.getElementById('account-code').focus();
    }

    function clearAccountForm() {
      document.getElementById('account-form').reset();
      document.getElementById('account-id').value = '';
      document.getElementById('account-message').textContent = '';
      document.getElementById('account-suggestion').textContent = '';
      window.nilavaramAccountSuggestions = [];
    }

    function suggestAccountDetails() {
      const status = document.getElementById('account-suggestion');
      const button = document.getElementById('account-suggest');
      status.innerHTML = '<b>Preparing a suggestionâ€¦</b>';
      button.disabled = true;
      // Yield once so the status is painted before the server request begins.
      window.setTimeout(function() {
        try {
          const input = {
            entityId: document.getElementById('account-entity').value,
            purpose: document.getElementById('account-purpose').value,
            name: document.getElementById('account-name').value,
            lastFour: document.getElementById('account-last-four').value,
            nearCode: document.getElementById('account-near-code').value
          };
          google.script.run
        .withSuccessHandler(function(suggestion) {
          button.disabled = false;
          window.nilavaramAccountSuggestions = suggestion.choices || [suggestion];
          applyAccountSuggestion(0);
          let choiceHtml = '<b>Suggested:</b> ' + escapeHtml(suggestion.explanation);
          if (window.nilavaramAccountSuggestions.length > 1) {
            choiceHtml += '<br><label for="account-suggestion-choice">Choose a suggestion: </label>' +
              '<select id="account-suggestion-choice" onchange="applyAccountSuggestion(this.selectedIndex)">';
            window.nilavaramAccountSuggestions.forEach(function(choice) {
              choiceHtml += '<option>' + escapeHtml(choice.label ||
                (choice.code + ' â€” ' + choice.name)) + '</option>';
            });
            choiceHtml += '</select>';
          }
          choiceHtml += '<br><b>You remain in control:</b> open â€œReview accounting detailsâ€ ' +
            'and replace the suggested code, type or parent before saving.';
          choiceHtml += '<br><button type="button" class="primary-button" ' +
            'id="account-save-suggestion">Use this suggestion and save account</button>';
          document.getElementById('account-suggestion').innerHTML = choiceHtml;
          document.getElementById('account-advanced').open = true;
          document.getElementById('account-save-suggestion').onclick = function() {
            const form = document.getElementById('account-form');
            if (typeof form.requestSubmit === 'function') {
              form.requestSubmit();
            } else {
              saveAccountForm({ preventDefault: function() {} });
            }
          };
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          document.getElementById('account-suggestion').innerHTML =
            '<span class="error">Suggestion failed: ' +
            escapeHtml(error && error.message ? error.message : String(error)) +
            '</span>';
        })
        .suggestChartAccount(input);
        } catch (error) {
          button.disabled = false;
          status.innerHTML = '<span class="error">Suggestion could not start: ' +
            escapeHtml(error && error.message ? error.message : String(error)) +
            '</span>';
        }
      }, 0);
    }

    function applyAccountSuggestion(index) {
      const suggestion = (window.nilavaramAccountSuggestions || [])[index];
      if (!suggestion) return;
      document.getElementById('account-code').value = suggestion.code;
      document.getElementById('account-name').value = suggestion.name;
      document.getElementById('account-type').value = suggestion.accountType;
      document.getElementById('account-parent').value = suggestion.parentCode;
    }

    function saveAccountForm(event) {
      event.preventDefault();
      const name = document.getElementById('account-name').value.trim();
      if (!name) {
        document.getElementById('account-message').innerHTML =
          ' <span class="error">Enter the plain account name.</span>';
        document.getElementById('account-name').focus();
        return;
      }
      if (!document.getElementById('account-code').value.trim()) {
        document.getElementById('account-message').textContent =
          ' Preparing the missing ACODE and accounting detailsâ€¦';
        google.script.run.withSuccessHandler(function(suggestion) {
          window.nilavaramAccountSuggestions = suggestion.choices || [suggestion];
          applyAccountSuggestion(0);
          document.getElementById('account-suggestion').innerHTML =
            '<span class="success"><b>Prepared:</b> ' +
            escapeHtml(document.getElementById('account-code').value) + ' â€” ' +
            escapeHtml(document.getElementById('account-name').value) + '</span>';
          persistAccountForm();
        }).withFailureHandler(function(error) {
          document.getElementById('account-message').innerHTML =
            ' <span class="error">Please correct this: ' +
            escapeHtml(error.message) + '</span>';
        }).suggestChartAccount({
          entityId: document.getElementById('account-entity').value,
          purpose: document.getElementById('account-purpose').value,
          name: name,
          lastFour: document.getElementById('account-last-four').value,
          nearCode: document.getElementById('account-near-code').value
        });
        return;
      }
      persistAccountForm();
    }

    function persistAccountForm() {
      const input = {
        id: document.getElementById('account-id').value,
        entityId: document.getElementById('account-entity').value,
        code: document.getElementById('account-code').value,
        name: document.getElementById('account-name').value,
        accountType: document.getElementById('account-type').value,
        parentCode: document.getElementById('account-parent').value,
        status: document.getElementById('account-status').value,
        notes: document.getElementById('account-notes').value
      };
      document.getElementById('account-message').textContent = ' Saving...';
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('account-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          showChartOfAccounts();
        })
        .withFailureHandler(function(error) {
          document.getElementById('account-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .saveChartAccount(input);
    }

    function saveUserForm(event) {
      event.preventDefault();
      const modules = document.getElementById('allowedModules').value
        .split(',')
        .map(function(value) { return value.trim(); })
        .filter(Boolean);
      const input = {
        email: document.getElementById('email').value,
        displayName: document.getElementById('displayName').value,
        role: document.getElementById('role').value,
        allowedModules: modules
      };
      document.getElementById('user-message').textContent = ' Saving...';

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('user-message').innerHTML =
            ' <span class="success">' + escapeHtml(result.message) + '</span>';
          document.getElementById('user-form').reset();
          loadUsers();
        })
        .withFailureHandler(function(error) {
          document.getElementById('user-message').innerHTML =
            ' <span class="error">' + escapeHtml(error.message) + '</span>';
        })
        .saveUser(input);
    }

    function loadUsers() {
      google.script.run
        .withSuccessHandler(function(users) {
          window.nilavaramUsers = users;
          let html = '<table><thead><tr><th>Email</th><th>Name</th>' +
            '<th>Role</th><th>Status</th><th>Ltd modules</th><th></th></tr></thead><tbody>';
          users.forEach(function(user, index) {
            html += '<tr><td>' + escapeHtml(user.email) + '</td>' +
              '<td>' + escapeHtml(user.displayName) + '</td>' +
              '<td>' + escapeHtml(user.role) + '</td>' +
              '<td>' + escapeHtml(user.status) + '</td>' +
              '<td>' + escapeHtml((user.allowedModules || []).join(', ')) + '</td>' +
              '<td><button type="button" onclick="editUser(' + index + ')">Edit</button></td></tr>';
          });
          html += '</tbody></table>';
          document.getElementById('users-list').innerHTML = html;
        })
        .withFailureHandler(showError)
        .getUsers();
    }

    function editUser(index) {
      const user = (window.nilavaramUsers || [])[index];
      if (!user) return;
      document.getElementById('email').value = user.email || '';
      document.getElementById('displayName').value = user.displayName || '';
      document.getElementById('role').value = user.role || 'reader';
      document.getElementById('allowedModules').value =
        (user.allowedModules || []).join(', ');
      document.getElementById('email').focus();
    }
</script>
